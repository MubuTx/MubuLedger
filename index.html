  <script>
/* Reusable UI pieces: KPI cards, calendar, heatmap, trade modal, checklist modal. */
const UI = (() => {
  const info = tip => `<span class="info" title="${U.esc(tip)}">i</span>`;

  function kpiRow(s, { compact = false } = {}) {
    const wlTotal = s.avgWin + s.avgLoss;
    const wPct = wlTotal ? s.avgWin / wlTotal * 100 : 50;
    const card = (label, tip, value, viz = '', extra = '') => `
      <div class="card kpi">
        <div class="label">${label} ${info(tip)}${extra}</div>
        <div class="kpi-row"><div class="value">${value}</div>${viz ? `<div class="viz">${viz}</div>` : ''}</div>
      </div>`;
    const gauge = (w, b, l) => `${Charts.gaugeSVG([{ v: w, c: Charts.C.green }, { v: b, c: '#7C8BE0' }, { v: l, c: Charts.C.red }])}
      <div class="gauge-legend"><span class="pill g">${w}</span><span class="pill b">${b}</span><span class="pill r">${l}</span></div>`;
    const netCard = `
      <div class="card kpi">
        <div class="label">Net P&amp;L ${info('Total gross P&L minus commissions for the filtered trades.')} <span class="count-badge">${s.count}</span></div>
        <div class="kpi-row"><div class="value ${U.cls(s.total)}">${U.money(s.total)}</div></div>
        ${compact ? `<div style="margin-top:6px">${Charts.sparkSVG(M.cumulative(s.days).map(x => x.cum), 200, 34)}</div>` : ''}
      </div>`;
    const winCard = card('Trade win %', 'Winners ÷ (winners + losers). Break-even trades are excluded.', U.pct(s.winRate), gauge(s.wins, s.be, s.losses));
    const pfCard = card('Profit factor', 'Gross winning $ ÷ gross losing $.', U.num(s.pf), Charts.donutSVG(s.gw, s.gl));
    const dayCard = card('Day win %', 'Green days ÷ (green + red days).', U.pct(s.dayWinRate), gauge(s.winDays, s.beDays, s.lossDays));
    const wlCard = card('Avg win/loss trade', 'Average winning trade ÷ average losing trade.', U.num(s.ratio), `
      <div class="wl"><div class="wl-bar"><div class="w" style="width:${wPct}%"></div><div class="l" style="width:${100 - wPct}%"></div></div>
      <div class="wl-vals"><span class="pos">${U.moneyShort(s.avgWin)}</span><span class="neg">-${U.moneyShort(s.avgLoss)}</span></div></div>`);
    return `<div class="grid ${compact ? 'g-4' : 'g-5'}">${netCard}${compact ? pfCard + winCard + wlCard : winCard + pfCard + dayCard + wlCard}</div>`;
  }

  /* ---------- Month calendar with weekly totals ---------- */
  function calendar(container, trades, monthKey, { onNav, onDay } = {}) {
    const [y, m] = monthKey.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const daysIn = new Date(y, m, 0).getDate();
    const dayMap = new Map(M.days(trades).map(d => [d.key, d]));
    const start = first.getDay();
    const cells = Math.ceil((start + daysIn) / 7) * 7;
    const today = U.todayKey();
    let monthNet = 0, monthDays = 0;

    /* Runs active this month get a fixed "lane" so their lines line up across days. */
    const visAcc = App.filters && App.filters.account !== 'all' ? new Set([App.filters.account]) : null;
    const monthFrom = `${y}-${U.pad(m)}-01`, monthTo = `${y}-${U.pad(m)}-${U.pad(daysIn)}`;
    const lanes = Runs.all().filter(r => {
      if (visAcc && !r.stages.some(st => visAcc.has(st.account))) return false;
      const sp = Runs.span(r); return sp && sp.from <= monthTo && sp.to >= monthFrom;
    }).sort((a, b) => (Runs.span(a).from < Runs.span(b).from ? -1 : 1));
    const laneOf = new Map(lanes.map((r, i) => [r.id, i]));
    const runLines = key => {
      const hits = Runs.onDay(key, visAcc).filter(h => laneOf.has(h.run.id));
      if (!hits.length) return '';
      return '<div class="run-lines">' + hits.map(h => {
        const lane = laneOf.get(h.run.id);
        const cls = ['run-line', 'st-' + h.stage.type.toLowerCase(), h.runStart ? 'rs' : '', h.runEnd ? 're' : ''].join(' ');
        const tip = `${h.run.name} — ${h.stage.type} (${h.stage.account})${h.stageStart ? ' · promoted to ' + h.stage.type : ''}${h.payout ? ' · payout ' + U.money(h.payout.amount) : ''}`;
        return `<span class="${cls}" style="--rc:${h.run.color};bottom:${4 + lane * 7}px" title="${U.esc(tip)}">${h.stageStart ? '<i class="run-promo"></i>' : ''}${h.payout ? '<i class="run-pay">$</i>' : ''}${h.runEnd && h.run.status === 'blown' ? '<i class="run-x">×</i>' : ''}</span>`;
      }).join('') + '</div>';
    };

    let html = U.DOW.map(d => `<div class="dow">${d}</div>`).join('') + '<div class="dow" style="background:transparent"></div>';
    let wk = 0, wNet = 0, wDays = 0;
    for (let i = 0; i < cells; i++) {
      const dn = i - start + 1;
      if (dn < 1 || dn > daysIn) html += '<div class="cell out"></div>';
      else {
        const key = `${y}-${U.pad(m)}-${U.pad(dn)}`;
        const d = dayMap.get(key);
        const note = Store.data.notes[key];
        if (d) {
          monthNet += d.net; monthDays++; wNet += d.net; wDays++;
          const c = d.net > 0 ? 'win' : d.net < 0 ? 'loss' : 'be';
          html += `<div class="cell ${c} ${key === today ? 'today' : ''}" data-day="${key}">${note ? '<span class="note-dot" title="Has notes"></span>' : ''}
            <span class="d">${dn}</span><span class="amt">${U.moneyShort(d.net)}</span>
            <span class="sub">${d.trades.length} trade${d.trades.length > 1 ? 's' : ''}<br>${(d.winRate * 100).toFixed(1)}%</span>${runLines(key)}</div>`;
        } else html += `<div class="cell ${key === today ? 'today' : ''}">${note ? '<span class="note-dot"></span>' : ''}<span class="d">${dn}</span>${runLines(key)}</div>`;
      }
      if (i % 7 === 6) {
        wk++;
        html += `<div class="week"><span class="wk">Week ${wk}</span><span class="amt ${U.cls(wNet)}">${U.moneyShort(wNet)}</span><span class="chip">${wDays} day${wDays === 1 ? '' : 's'}</span></div>`;
        wNet = 0; wDays = 0;
      }
    }
    const legend = lanes.length ? `<div class="run-legend">
        ${lanes.map(r => {
          const sm = Runs.summary(r); const stl = Runs.statusLabel(r);
          const lastType = (r.stages[r.stages.length - 1] || {}).type || 'Eval';
          return `<a class="run-chip" href="#/runs?id=${r.id}" title="Open run"><span class="run-swatch st-${lastType.toLowerCase()}" style="--rc:${r.color}"></span><b>${U.esc(r.name)}</b><span class="pill ${stl.cls}">${stl.text}</span><span class="${U.cls(sm.s.total)}">${U.moneyShort(sm.s.total)}</span></a>`;
        }).join('')}
        <span class="run-key"><span class="run-swatch st-eval" style="--rc:#6B7290"></span>Eval <span class="run-swatch st-funded" style="--rc:#6B7290"></span>Funded <i class="run-promo static"></i>Promoted <i class="run-pay static">$</i>Payout</span>
      </div>` : `<div class="run-legend empty"><span class="help">Group an eval and the funded account it became into one <b>run</b> to see your whole progression here.</span><a class="btn sm" href="#/runs">Set up runs</a></div>`;
    container.innerHTML = `
      <div class="cal-head">
        <button class="btn sm ghost" data-nav="-1">‹</button>
        <div class="month">${U.MONTHS[m - 1]} ${y}</div>
        <button class="btn sm ghost" data-nav="1">›</button>
        <button class="btn sm" data-nav="0">This month</button>
        <div class="stats">Monthly stats: <span class="chip ${U.cls(monthNet)}">${U.moneyShort(monthNet)}</span><span class="chip">${monthDays} day${monthDays === 1 ? '' : 's'}</span></div>
      </div>
      <div class="cal" style="--run-pad:${lanes.length ? 8 + lanes.length * 7 : 6}px">${html}</div>
      ${legend}`;
    U.$$('[data-nav]', container).forEach(b => b.onclick = () => {
      const n = +b.dataset.nav;
      let key;
      if (n === 0) key = U.todayKey().slice(0, 7);
      else { const d = new Date(y, m - 1 + n, 1); key = `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}`; }
      onNav && onNav(key);
    });
    U.$$('[data-day]', container).forEach(c => c.onclick = () => onDay && onDay(c.dataset.day));
  }

  /* ---------- Rule-checklist heatmap (last 12 weeks) ---------- */
  function heatmap(tradedDays) {
    const rules = Store.data.settings.rules;
    const today = U.todayKey();
    const endSat = U.addDays(U.weekStart(today), 6);
    const start = U.addDays(endSat, -12 * 7 + 1);
    let grid = '', lastMonth = '';
    for (let w = 0; w < 12; w++) {
      const colStart = U.addDays(start, w * 7);
      const mo = U.MONTHS[+colStart.slice(5, 7) - 1].slice(0, 3);
      grid += `<div class="m">${mo !== lastMonth ? mo : ''}</div>`; lastMonth = mo;
      for (let d = 0; d < 7; d++) {
        const key = U.addDays(colStart, d);
        if (key > today) { grid += '<div class="heat-cell future"></div>'; continue; }
        const done = (Store.data.checks[key] || []).filter(id => rules.some(r => r.id === id)).length;
        const frac = rules.length ? done / rules.length : 0;
        const lvl = frac === 0 ? 0 : frac <= .25 ? 1 : frac <= .5 ? 2 : frac < 1 ? 3 : 4;
        grid += `<div class="heat-cell l${lvl} ${tradedDays.has(key) ? 'traded' : ''}" title="${U.fmtLong(key)} — ${done}/${rules.length} rules${tradedDays.has(key) ? ' · traded' : ''}"></div>`;
      }
    }
    return `<div class="heat"><div class="heat-days"><span></span>${U.DOW.map(d => `<span>${d}</span>`).join('')}</div><div class="heat-grid">${grid}</div></div>
      <div class="heat-legend">Less <span class="heat-cell"></span><span class="heat-cell l1"></span><span class="heat-cell l2"></span><span class="heat-cell l3"></span><span class="heat-cell l4"></span> More</div>`;
  }

  /* ---------- Modal ---------- */
  function modal({ title, body, footer = [], wide = false, onClose }) {
    const root = U.$('#modalRoot');
    root.innerHTML = `<div class="modal-backdrop"><div class="modal ${wide ? 'wide' : ''}">
      <div class="modal-head"><h3>${U.esc(title)}</h3><button class="icon-btn" data-close>×</button></div>
      <div class="modal-body"></div><div class="modal-foot"></div></div></div>`;
    const bodyEl = U.$('.modal-body', root), footEl = U.$('.modal-foot', root);
    if (typeof body === 'string') bodyEl.innerHTML = body; else bodyEl.appendChild(body);
    const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', esc); onClose && onClose(); };
    const esc = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', esc);
    footer.forEach(b => {
      const btn = U.h(`<button class="btn ${b.cls || ''}">${U.esc(b.label)}</button>`);
      btn.onclick = () => b.onClick ? b.onClick(close, bodyEl) : close();
      footEl.appendChild(btn);
    });
    if (!footer.length) footEl.remove();
    U.$('[data-close]', root).onclick = close;
    U.$('.modal-backdrop', root).addEventListener('mousedown', e => { if (e.target.classList.contains('modal-backdrop')) close(); });
    return { close, bodyEl };
  }

  function confirm(title, msg, label = 'Confirm', danger = true) {
    return new Promise(res => {
      modal({ title, body: `<p style="margin:0;line-height:1.6">${msg}</p>`, footer: [
        { label: 'Cancel', onClick: c => { res(false); c(); } },
        { label, cls: danger ? 'danger' : 'primary', onClick: c => { res(true); c(); } },
      ], onClose: () => res(false) });
    });
  }

  /* ---------- Trade detail / edit ---------- */
  function tradeModal(id, onChange) {
    const t = Store.data.trades.find(x => x.id === id);
    if (!t) return;
    const n = M.net(t);
    let rating = t.rating || 0;
    const setups = Store.setups();
    const body = U.h(`<div>
      <div class="detail-grid">
        <div><div class="k">Symbol</div><div class="v">${U.esc(t.symbol)}</div></div>
        <div><div class="k">Side</div><div class="v"><span class="side ${t.side.toLowerCase()}">${t.side}</span></div></div>
        <div><div class="k">Account</div><div class="v">${U.esc(t.account)}</div></div>
        <div><div class="k">Opened</div><div class="v">${U.fmtDateTime(t.entryTime)}</div></div>
        <div><div class="k">Closed</div><div class="v">${U.fmtDateTime(t.exitTime)}</div></div>
        <div><div class="k">Duration</div><div class="v">${U.duration(M.holdSec(t))}</div></div>
        <div><div class="k">Qty</div><div class="v">${t.qty}</div></div>
        <div><div class="k">Entry</div><div class="v">${U.price(t.entryPrice)}</div></div>
        <div><div class="k">Exit</div><div class="v">${U.price(t.exitPrice)}</div></div>
        <div><div class="k">Gross P&amp;L</div><div class="v ${U.cls(t.gross)}">${U.money(t.gross)}</div></div>
        <div><div class="k">Commissions</div><div class="v">${U.money(M.fees(t))}</div></div>
        <div><div class="k">Net P&amp;L</div><div class="v ${U.cls(n)}">${U.money(n)}</div></div>
      </div>
      <div class="form-row">
        <div><label class="field-label">Setup / playbook</label>
          <input class="inp" id="tmSetup" list="tmSetups" value="${U.esc(t.setup || '')}" placeholder="e.g. Opening drive, Liquidity sweep">
          <datalist id="tmSetups">${setups.map(s => `<option value="${U.esc(s)}">`).join('')}</datalist></div>
        <div><label class="field-label">Tags (comma separated)</label>
          <input class="inp" id="tmTags" value="${U.esc((t.tags || []).join(', '))}" placeholder="A+, FOMO, early exit"></div>
      </div>
      <div style="margin-bottom:14px"><label class="field-label">Execution rating</label>
        <div class="stars" id="tmStars">${[1, 2, 3, 4, 5].map(i => `<button data-v="${i}" class="${i <= rating ? 'on' : ''}">★</button>`).join('')}</div></div>
      <label class="field-label">Trade notes</label>
      <textarea class="notes" id="tmNotes" placeholder="Why did you take it? What did you see? What would you do differently?">${U.esc(t.notes || '')}</textarea>
    </div>`);
    U.$$('#tmStars button', body).forEach(b => b.onclick = () => {
      rating = +b.dataset.v === rating ? 0 : +b.dataset.v;
      U.$$('#tmStars button', body).forEach(x => x.classList.toggle('on', +x.dataset.v <= rating));
    });
    modal({
      title: `${t.symbol} · ${U.fmtLong(U.dayKey(t.entryTime))}`, body, wide: true,
      footer: [
        { label: 'Delete trade', cls: 'danger left', onClick: async c => {
          c();
          if (await confirm('Delete trade?', 'This removes the trade from your journal. Re-importing the same CSV would bring it back.', 'Delete')) {
            Store.deleteTrades([t.id]); App.toast('Trade deleted'); onChange && onChange();
          }
        } },
        { label: 'Cancel' },
        { label: 'Save', cls: 'primary', onClick: c => {
          Store.updateTrade(t.id, {
            setup: U.$('#tmSetup', body).value.trim(),
            tags: U.$('#tmTags', body).value.split(',').map(s => s.trim()).filter(Boolean),
            notes: U.$('#tmNotes', body).value, rating,
          });
          c(); App.toast('Trade saved'); onChange && onChange();
        } },
      ],
    });
  }

  function checklistHTML(day) {
    const done = new Set(Store.data.checks[day] || []);
    const rules = Store.data.settings.rules;
    if (!rules.length) return '<div class="help">No rules yet — add your trading rules in Settings.</div>';
    return `<div class="checklist" data-day="${day}">${rules.map(r => `<label><input type="checkbox" value="${r.id}" ${done.has(r.id) ? 'checked' : ''}> <span>${U.esc(r.text)}</span></label>`).join('')}</div>`;
  }
  function bindChecklist(el, onChange) {
    U.$$('.checklist', el).forEach(list => {
      list.addEventListener('change', () => {
        const ids = U.$$('input:checked', list).map(i => i.value);
        Store.setChecks(list.dataset.day, ids);
        onChange && onChange();
      });
    });
  }

  function checklistModal(day, onChange) {
    const body = U.h(`<div><div class="help" style="margin-bottom:10px">${U.fmtLong(day)}</div>${checklistHTML(day)}</div>`);
    bindChecklist(body);
    modal({ title: 'Daily checklist', body, footer: [{ label: 'Done', cls: 'primary', onClick: c => { c(); onChange && onChange(); } }] });
  }

  function emptyState(title = 'No trades yet', msg = 'Import your Tradovate CSV to start building your journal.') {
    return `<div class="card"><div class="empty">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#5867D6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg>
      <h3>${title}</h3><div>${msg}</div>
      <div class="actions"><a class="btn primary" href="#/import">Import CSV</a><button class="btn" data-demo>Load demo data</button></div>
    </div></div>`;
  }

  return { info, kpiRow, calendar, heatmap, modal, confirm, tradeModal, checklistHTML, bindChecklist, checklistModal, emptyState };
})();

</script>
  <script>
window.Views = window.Views || {};

Views.dashboard = {
  title: 'Dashboard',
  render(el) {
    const trades = App.filtered();
    if (!Store.data.trades.length) { el.innerHTML = UI.emptyState(); return; }
    const s = M.summarize(trades);
    const cum = M.cumulative(s.days);
    const labels = cum.map(c => U.fmtShort(c.key));
    const sc = M.score(s);
    const today = U.todayKey();
    const rules = Store.data.settings.rules;
    const todayDone = (Store.data.checks[today] || []).filter(id => rules.some(r => r.id === id)).length;
    const tradedDays = new Set(s.days.map(d => d.key));

    el.innerHTML = `
      ${UI.kpiRow(s)}
      <div class="grid g-3">
        <div class="card"><div class="card-head"><h3>Mubu score</h3>${UI.info('Composite of win %, profit factor, avg win/loss, recovery factor, max drawdown and consistency (share of profit from your best day).')}</div>
          <div class="card-body score-wrap">
            <div class="chart-box" style="height:250px"><canvas id="cRadar"></canvas></div>
            <div class="score-foot">
              <div><div class="sublabel">Your Mubu score</div><div class="big">${sc.total.toFixed(2)}</div></div>
              <div class="score-scale"><div class="score-track"><div class="marker" style="left:${sc.total}%"></div></div>
                <div class="score-ticks"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span></div></div>
            </div>
          </div></div>
        <div class="card"><div class="card-head"><h3>Progress tracker</h3>${UI.info('Daily rule checklist completion over the last 12 weeks. Outlined squares = days you traded.')}
          <div class="right"><a href="#/settings" class="btn sm ghost">Edit rules</a></div></div>
          <div class="card-body">
            ${UI.heatmap(tradedDays)}
            <div class="today-score">
              <div><div class="help">Today's score</div><div class="big">${todayDone}/${rules.length}</div></div>
              <div class="progress"><div style="width:${rules.length ? todayDone / rules.length * 100 : 0}%"></div></div>
              <button class="btn sm" id="btnChecklist" style="margin-left:auto">Daily checklist</button>
            </div>
          </div></div>
        <div class="card"><div class="card-head"><h3>Daily net cumulative P&amp;L</h3>${UI.info('Running total of net P&L by trading day.')}</div>
          <div class="card-body"><div class="chart-box" style="height:330px">${cum.length ? '<canvas id="cCum"></canvas>' : '<div class="no-data">No trades in this range</div>'}</div></div></div>
      </div>

      <div class="grid g-3">
        <div class="card"><div class="card-head"><h3>Net daily P&amp;L</h3>${UI.info('Net P&L per trading day.')}</div>
          <div class="card-body"><div class="chart-box">${cum.length ? '<canvas id="cDaily"></canvas>' : '<div class="no-data">No data</div>'}</div></div></div>
        <div class="card"><div class="tabs" id="rtTabs"><button class="active" data-t="recent">Recent trades</button><button data-t="best">Best / worst</button></div>
          <div class="table-wrap" id="rtBody" style="max-height:300px;overflow-y:auto"></div></div>
        <div class="card"><div class="card-head"><h3>Account balance</h3>${UI.info('Starting balance (Settings) + cumulative net P&L for the selected account(s).')}</div>
          <div class="card-body"><div class="chart-box" id="balBox"></div></div></div>
      </div>

      <div class="grid g-cal">
        <div class="card" id="calWrap"></div>
        <div class="stack">
          <div class="card"><div class="card-head"><h3>Drawdown</h3>${UI.info('Distance below the running equity peak, by day.')}</div>
            <div class="card-body"><div class="chart-box sm">${cum.length ? '<canvas id="cDD"></canvas>' : '<div class="no-data">No data</div>'}</div></div></div>
          <div class="card"><div class="card-head"><h3>Trade time performance</h3>${UI.info('Each dot is a trade: entry time of day vs net P&L.')}</div>
            <div class="card-body"><div class="chart-box sm">${trades.length ? '<canvas id="cTime"></canvas>' : '<div class="no-data">No data</div>'}</div></div></div>
        </div>
      </div>`;

    Charts.radar(U.$('#cRadar', el), Object.keys(sc.parts), Object.values(sc.parts));
    if (cum.length) {
      Charts.area(U.$('#cCum', el), labels, cum.map(c => +c.cum.toFixed(2)));
      Charts.bars(U.$('#cDaily', el), labels, cum.map(c => +c.net.toFixed(2)));
      Charts.drawdown(U.$('#cDD', el), labels, cum.map(c => +c.dd.toFixed(2)));
    }
    if (trades.length) Charts.timeScatter(U.$('#cTime', el), trades);

    // Balance
    const accts = App.filters.account === 'all' ? [...new Set(trades.map(t => t.account))] : [App.filters.account];
    const bals = Store.data.settings.startingBalances;
    const known = accts.filter(a => bals[a] !== undefined && bals[a] !== '');
    const balBox = U.$('#balBox', el);
    if (!known.length || !cum.length) {
      balBox.innerHTML = `<div class="no-data"><div>No account balance data to show here.<br>Add a starting balance in <a href="#/settings">Settings</a>.</div></div>`;
    } else {
      const start = known.reduce((a, k) => a + (+bals[k] || 0), 0);
      const tradesK = trades.filter(t => known.includes(t.account));
      const ck = M.cumulative(M.days(tradesK));
      balBox.innerHTML = '<canvas></canvas>';
      Charts.lineSeries(U.$('canvas', balBox), ck.map(c => U.fmtShort(c.key)), ck.map(c => +(start + c.cum).toFixed(2)), { color: Charts.C.navy });
    }

    // Recent / best-worst
    const rtBody = U.$('#rtBody', el);
    const renderRT = mode => {
      let list;
      if (mode === 'recent') list = [...trades].sort(M.byTime).reverse().slice(0, 12);
      else { const sorted = [...trades].sort((a, b) => M.net(b) - M.net(a)); list = [...sorted.slice(0, 6), ...sorted.slice(-6).reverse()].filter((v, i, a) => a.indexOf(v) === i); }
      rtBody.innerHTML = `<table class="tbl"><thead><tr><th>Close date</th><th>Symbol</th><th>Side</th><th class="num">Net P&amp;L</th></tr></thead><tbody>
        ${list.map(t => { const n = M.net(t); return `<tr class="clickable" data-id="${t.id}"><td>${U.fmtDate(U.dayKey(t.exitTime))}</td><td><b>${U.esc(t.symbol)}</b></td><td><span class="side ${t.side.toLowerCase()}">${t.side}</span></td><td class="num ${U.cls(n)}">${U.money(n)}</td></tr>`; }).join('') || '<tr class="empty-row"><td colspan="4">No trades</td></tr>'}
        </tbody></table>`;
      U.$$('tr[data-id]', rtBody).forEach(r => r.onclick = () => UI.tradeModal(r.dataset.id, () => App.render()));
    };
    renderRT('recent');
    U.$$('#rtTabs button', el).forEach(b => b.onclick = () => {
      U.$$('#rtTabs button', el).forEach(x => x.classList.toggle('active', x === b)); renderRT(b.dataset.t);
    });

    // Calendar
    if (!App.calMonth) App.calMonth = (s.days.length ? s.days[s.days.length - 1].key : today).slice(0, 7);
    const drawCal = () => UI.calendar(U.$('#calWrap', el), trades, App.calMonth, {
      onNav: k => { App.calMonth = k; drawCal(); },
      onDay: d => { location.hash = `#/journal?day=${d}`; },
    });
    drawCal();

    U.$('#btnChecklist', el).onclick = () => UI.checklistModal(today, () => App.render());
  },
};

  <script>
window.Views = window.Views || {};

Views.journal = {
  title: 'Daily Journal',
  pageSize: 10,
  shown: 10,
  open: new Set(),
  miniMonth: null,

  render(el, params) {
    const trades = App.filtered();
    if (!Store.data.trades.length) { el.innerHTML = UI.emptyState(); return; }
    const days = M.days(trades).reverse();
    const target = params.day;
    if (target) {
      const idx = days.findIndex(d => d.key === target);
      if (idx >= 0) { this.shown = Math.max(this.shown, Math.ceil((idx + 1) / this.pageSize) * this.pageSize); this.open.add(target); }
      this.miniMonth = target.slice(0, 7);
    }
    if (!this.open.size && days.length) days.slice(0, 3).forEach(d => this.open.add(d.key));
    if (!this.miniMonth) this.miniMonth = (days[0] ? days[0].key : U.todayKey()).slice(0, 7);

    // Days with notes but no trades still deserve a card (e.g. a "no trade" day)
    const noteOnly = Object.keys(Store.data.notes).filter(k => !days.some(d => d.key === k) && App.inRange(k)).map(k => ({ key: k, trades: [], net: 0, noteOnly: true }));
    const all = [...days, ...noteOnly].sort((a, b) => a.key < b.key ? 1 : -1);
    const visible = all.slice(0, this.shown);

    el.innerHTML = `
      <div class="journal-layout">
        <div>
          <div class="toolbar">
            <button class="btn sm" id="jCollapse">Collapse all</button>
            <button class="btn sm" id="jExpand">Expand all</button>
            <div class="right">
              <input type="date" class="inp" id="jNoteDay" value="${U.todayKey()}" style="width:auto">
              <button class="btn sm primary" id="jStart">Start my day</button>
            </div>
          </div>
          <div id="jDays">${visible.length ? visible.map(d => this.dayCard(d)).join('') : '<div class="card"><div class="empty">No trading days in this date range.</div></div>'}</div>
          ${all.length > this.shown ? `<div style="text-align:center;margin-top:8px"><button class="btn" id="jMore">Load more days (${all.length - this.shown} left)</button></div>` : ''}
        </div>
        <div class="journal-side">
          <div class="card mini-cal" id="jMini"></div>
          <div class="card"><div class="card-head"><h3>Period summary</h3></div><div class="card-body list-rows" id="jSum"></div></div>
        </div>
      </div>`;

    const s = M.summarize(trades);
    U.$('#jSum', el).innerHTML = [
      ['Trading days', s.dayCount], ['Net P&L', `<span class="${U.cls(s.total)}">${U.money(s.total)}</span>`],
      ['Avg day', `<span class="${U.cls(s.avgDay)}">${U.money(s.avgDay)}</span>`], ['Best day', `<span class="pos">${U.money(s.bestDay)}</span>`],
      ['Worst day', `<span class="neg">${U.money(s.worstDay)}</span>`], ['Day win %', U.pct(s.dayWinRate)],
    ].map(([k, v]) => `<div class="row"><span class="help" style="flex:1">${k}</span><b>${v}</b></div>`).join('');

    this.drawMini(el, days);
    visible.forEach(d => { if (this.open.has(d.key)) this.fillBody(el, d); });

    U.$$('.day-head', el).forEach(h => h.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      const card = h.parentElement, key = card.dataset.day;
      const d = all.find(x => x.key === key);
      if (card.classList.toggle('open')) { this.open.add(key); this.fillBody(el, d); }
      else { this.open.delete(key); Charts.destroyIn(card); }
    }));
    U.$$('[data-addnote]', el).forEach(b => b.onclick = () => {
      const card = b.closest('.day-card'); const key = card.dataset.day;
      if (!card.classList.contains('open')) { card.classList.add('open'); this.open.add(key); this.fillBody(el, all.find(x => x.key === key)); }
      setTimeout(() => U.$('textarea', card)?.focus(), 50);
    });
    U.$('#jCollapse', el).onclick = () => { this.open.clear(); App.render(); };
    U.$('#jExpand', el).onclick = () => { visible.forEach(d => this.open.add(d.key)); App.render(); };
    const more = U.$('#jMore', el); if (more) more.onclick = () => { this.shown += this.pageSize; App.render(); };
    U.$('#jStart', el).onclick = () => {
      const key = U.$('#jNoteDay', el).value || U.todayKey();
      this.open.add(key);
      if (!Store.data.notes[key]) Store.setNote(key, `Pre-market plan (${U.fmtLong(key)})\n- Bias:\n- Key levels:\n- News/events:\n- Max loss today:\n\nPost-session review\n- `);
      App.go(`#/journal?day=${key}`);
    };
    if (target) setTimeout(() => document.getElementById('day-' + target)?.scrollIntoView({ behavior: 'smooth' }), 60);
  },

  dayCard(d) {
    const open = this.open.has(d.key);
    return `<div class="card day-card ${open ? 'open' : ''}" id="day-${d.key}" data-day="${d.key}">
      <div class="day-head">
        <span class="chev"><svg width="12" height="12" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
        <span class="date">${U.fmtLong(d.key)}</span><span class="dot"></span>
        ${d.noteOnly ? '<span class="help">No trades — notes only</span>' : `<span class="net ${U.cls(d.net)}">Net P&amp;L ${U.money(d.net)}</span>`}
        ${Store.data.notes[d.key] ? '<span class="tag">Note</span>' : ''}
        <div class="right"><button class="btn sm" data-addnote>✎ ${Store.data.notes[d.key] ? 'Edit note' : 'Add note'}</button></div>
      </div>
      <div class="day-body"></div>
    </div>`;
  },

  fillBody(el, d) {
    const card = document.getElementById('day-' + d.key);
    if (!card) return;
    const body = U.$('.day-body', card);
    Charts.destroyIn(card);
    const list = d.trades;
    const fees = list.reduce((a, t) => a + M.fees(t), 0);
    const pf = d.gl ? d.gw / d.gl : (d.gw ? Infinity : 0);
    body.innerHTML = `
      ${list.length ? `<div class="day-top">
        <div class="chart-box sm"><canvas></canvas></div>
        <div class="stat-grid">
          <div class="s"><div class="k">Total trades</div><div class="v">${list.length}</div></div>
          <div class="s"><div class="k">Winners</div><div class="v">${d.wins}</div></div>
          <div class="s"><div class="k">Gross P&amp;L</div><div class="v ${U.cls(d.gross)}">${U.money(d.gross)}</div></div>
          <div class="s"><div class="k">Commissions</div><div class="v">${U.money(fees)}</div></div>
          <div class="s"><div class="k">Winrate</div><div class="v">${U.pct(d.winRate, 0)}</div></div>
          <div class="s"><div class="k">Losers</div><div class="v">${d.losses}</div></div>
          <div class="s"><div class="k">Volume</div><div class="v">${d.volume}</div></div>
          <div class="s"><div class="k">Profit factor</div><div class="v">${U.num(pf)}</div></div>
        </div>
      </div>
      <div class="table-wrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th class="num">Qty</th><th class="num">Entry</th><th class="num">Exit</th><th>Duration</th><th>Setup</th><th class="num">Net P&amp;L</th></tr></thead><tbody>
        ${list.map(t => { const n = M.net(t); return `<tr class="clickable" data-id="${t.id}"><td>${U.fmtTime(t.entryTime)}</td><td><b>${U.esc(t.symbol)}</b></td><td><span class="side ${t.side.toLowerCase()}">${t.side}</span></td><td class="num">${t.qty}</td><td class="num">${U.price(t.entryPrice)}</td><td class="num">${U.price(t.exitPrice)}</td><td>${U.duration(M.holdSec(t))}</td><td>${t.setup ? `<span class="tag">${U.esc(t.setup)}</span>` : ''}</td><td class="num ${U.cls(n)}"><b>${U.money(n)}</b></td></tr>`; }).join('')}
      </tbody></table></div>` : ''}
      <div class="day-notes">
        <div><label class="field-label">Journal notes <span class="saved-hint">Saved</span></label>
          <textarea class="notes" placeholder="Plan, mindset, what went right, what to fix tomorrow…">${U.esc(Store.data.notes[d.key] || '')}</textarea></div>
        <div><label class="field-label">Rules checklist</label>${UI.checklistHTML(d.key)}</div>
      </div>`;

    if (list.length) {
      let c = 0;
      const pts = [{ t: 'Start', v: 0 }, ...list.map(t => { c += M.net(t); return { t: U.fmtTime(t.exitTime), v: +c.toFixed(2) }; })];
      Charts.area(U.$('canvas', body), pts.map(p => p.t), pts.map(p => p.v));
    }
    const ta = U.$('textarea', body), hint = U.$('.saved-hint', body);
    const save = U.debounce(() => { Store.setNote(d.key, ta.value); hint.classList.add('show'); setTimeout(() => hint.classList.remove('show'), 1200); }, 500);
    ta.addEventListener('input', save);
    UI.bindChecklist(body);
    U.$$('tr[data-id]', body).forEach(r => r.onclick = () => UI.tradeModal(r.dataset.id, () => App.render()));
  },

  drawMini(el, days) {
    const box = U.$('#jMini', el);
    const [y, m] = this.miniMonth.split('-').map(Number);
    const first = new Date(y, m - 1, 1).getDay(), n = new Date(y, m, 0).getDate();
    const map = new Map(days.map(d => [d.key, d]));
    let cells = U.DOW.map(d => `<div class="dw">${d.slice(0, 2)}</div>`).join('');
    for (let i = 0; i < first; i++) cells += '<div class="md blank"></div>';
    for (let dn = 1; dn <= n; dn++) {
      const key = `${y}-${U.pad(m)}-${U.pad(dn)}`, d = map.get(key);
      const c = d ? (d.net > 0 ? 'win' : d.net < 0 ? 'loss' : 'be') : '';
      cells += `<div class="md ${c}" ${d ? `data-day="${key}" title="${U.money(d.net)}"` : ''}>${dn}</div>`;
    }
    box.innerHTML = `<div class="mh"><button class="btn sm ghost" data-m="-1">‹</button><span>${U.MONTHS[m - 1]} ${y}</span><button class="btn sm ghost" data-m="1">›</button></div><div class="mini-grid">${cells}</div>`;
    U.$$('[data-m]', box).forEach(b => b.onclick = () => {
      const d = new Date(y, m - 1 + +b.dataset.m, 1);
      this.miniMonth = `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}`; this.drawMini(el, days);
    });
    U.$$('[data-day]', box).forEach(c => c.onclick = () => App.go(`#/journal?day=${c.dataset.day}`));
  },
};

  <script>
window.Views = window.Views || {};

Views.trades = {
  title: 'Trade Log',
  sort: { key: 'entryTime', dir: -1 },
  page: 0,
  perPage: 50,
  search: '',
  result: 'all',
  side: 'all',
  selected: new Set(),

  cols: [
    { key: 'entryTime', label: 'Open date', val: t => t.entryTime },
    { key: 'symbol', label: 'Symbol', val: t => t.symbol },
    { key: 'status', label: 'Status', val: t => M.net(t) },
    { key: 'side', label: 'Side', val: t => t.side },
    { key: 'exitTime', label: 'Close date', val: t => t.exitTime },
    { key: 'qty', label: 'Qty', val: t => t.qty, num: true },
    { key: 'entryPrice', label: 'Entry price', val: t => t.entryPrice, num: true },
    { key: 'exitPrice', label: 'Exit price', val: t => t.exitPrice, num: true },
    { key: 'net', label: 'Net P&L', val: t => M.net(t), num: true },
    { key: 'dur', label: 'Duration', val: t => M.holdSec(t), num: true },
    { key: 'setup', label: 'Setup', val: t => t.setup || '' },
    { key: 'account', label: 'Account', val: t => t.account },
  ],

  rows() {
    let list = App.filtered();
    const q = this.search.trim().toLowerCase();
    if (q) list = list.filter(t => [t.symbol, t.setup, t.account, t.notes, (t.tags || []).join(' '), U.fmtDate(U.dayKey(t.entryTime))].join(' ').toLowerCase().includes(q));
    if (this.result !== 'all') list = list.filter(t => { const n = M.net(t); return this.result === 'win' ? n > 0 : this.result === 'loss' ? n < 0 : n === 0; });
    if (this.side !== 'all') list = list.filter(t => t.side === this.side);
    const col = this.cols.find(c => c.key === this.sort.key) || this.cols[0];
    const dir = this.sort.dir;
    return [...list].sort((a, b) => { const x = col.val(a), y = col.val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  },

  render(el) {
    if (!Store.data.trades.length) { el.innerHTML = UI.emptyState(); return; }
    const s = M.summarize(App.filtered());
    el.innerHTML = `
      ${UI.kpiRow(s, { compact: true })}
      <div class="card">
        <div class="card-head" style="flex-wrap:wrap">
          <input class="inp" id="tlSearch" placeholder="Search symbol, setup, tag, note, date…" value="${U.esc(this.search)}" style="max-width:300px">
          <select class="inp" id="tlResult" style="width:auto">
            <option value="all">All results</option><option value="win">Winners</option><option value="loss">Losers</option><option value="be">Break-even</option></select>
          <select class="inp" id="tlSide" style="width:auto"><option value="all">Long &amp; short</option><option value="Long">Long</option><option value="Short">Short</option></select>
          <div class="right">
            <span class="help" id="tlSelInfo"></span>
            <button class="btn sm danger" id="tlDelete" disabled>Delete selected</button>
            <button class="btn sm" id="tlExport">Export CSV</button>
          </div>
        </div>
        <div class="table-wrap" id="tlTable"></div>
        <div class="card-body" id="tlPager" style="display:flex;gap:8px;align-items:center;justify-content:flex-end"></div>
      </div>`;
    U.$('#tlResult', el).value = this.result;
    U.$('#tlSide', el).value = this.side;
    U.$('#tlSearch', el).addEventListener('input', U.debounce(e => { this.search = e.target.value; this.page = 0; this.drawTable(el); }, 200));
    U.$('#tlResult', el).onchange = e => { this.result = e.target.value; this.page = 0; this.drawTable(el); };
    U.$('#tlSide', el).onchange = e => { this.side = e.target.value; this.page = 0; this.drawTable(el); };
    U.$('#tlDelete', el).onclick = async () => {
      const n = this.selected.size;
      if (await UI.confirm(`Delete ${n} trade${n > 1 ? 's' : ''}?`, 'They will be removed from the journal. Re-importing the same CSV would bring them back.', 'Delete')) {
        Store.deleteTrades([...this.selected]); this.selected.clear(); App.toast(`${n} trade(s) deleted`); App.render();
      }
    };
    U.$('#tlExport', el).onclick = () => this.exportCSV(this.rows());
    this.drawTable(el);
  },

  drawTable(el) {
    const rows = this.rows();
    const pages = Math.max(1, Math.ceil(rows.length / this.perPage));
    this.page = Math.min(this.page, pages - 1);
    const slice = rows.slice(this.page * this.perPage, (this.page + 1) * this.perPage);
    const arrow = k => this.sort.key === k ? (this.sort.dir > 0 ? ' ▲' : ' ▼') : '';
    const allChecked = slice.length && slice.every(t => this.selected.has(t.id));
    U.$('#tlTable', el).innerHTML = `<table class="tbl"><thead><tr>
      <th class="c"><input type="checkbox" id="tlAll" ${allChecked ? 'checked' : ''}></th>
      ${this.cols.map(c => `<th class="sortable ${c.num ? 'num' : ''}" data-k="${c.key}">${c.label}${arrow(c.key)}</th>`).join('')}
      </tr></thead><tbody>
      ${slice.map(t => {
        const n = M.net(t);
        const st = n > 0 ? 'win' : n < 0 ? 'loss' : 'be';
        return `<tr class="clickable" data-id="${t.id}">
          <td class="c"><input type="checkbox" class="tlChk" value="${t.id}" ${this.selected.has(t.id) ? 'checked' : ''}></td>
          <td>${U.fmtDate(U.dayKey(t.entryTime))} <span class="help">${U.fmtTime(t.entryTime)}</span></td>
          <td><b>${U.esc(t.symbol)}</b></td>
          <td><span class="status ${st}">${st === 'be' ? 'BE' : st.toUpperCase()}</span></td>
          <td><span class="side ${t.side.toLowerCase()}">${t.side}</span></td>
          <td>${U.fmtDate(U.dayKey(t.exitTime))} <span class="help">${U.fmtTime(t.exitTime)}</span></td>
          <td class="num">${t.qty}</td>
          <td class="num">${U.price(t.entryPrice)}</td>
          <td class="num">${U.price(t.exitPrice)}</td>
          <td class="num ${U.cls(n)}"><b>${U.money(n)}</b></td>
          <td class="num">${U.duration(M.holdSec(t))}</td>
          <td>${t.setup ? `<span class="tag">${U.esc(t.setup)}</span>` : ''}${(t.tags || []).slice(0, 2).map(x => `<span class="tag" style="background:#F1F3F9;color:#3A4260">${U.esc(x)}</span>`).join('')}${t.notes ? ' 📝' : ''}</td>
          <td class="help">${U.esc(t.account)}</td>
        </tr>`;
      }).join('') || `<tr class="empty-row"><td colspan="${this.cols.length + 1}">No trades match.</td></tr>`}
      </tbody></table>`;
    U.$('#tlPager', el).innerHTML = `<span class="help">${rows.length} trade${rows.length === 1 ? '' : 's'} · page ${this.page + 1} of ${pages}</span>
      <button class="btn sm" data-p="-1" ${this.page === 0 ? 'disabled' : ''}>‹ Prev</button><button class="btn sm" data-p="1" ${this.page >= pages - 1 ? 'disabled' : ''}>Next ›</button>`;

    U.$$('th[data-k]', el).forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      this.sort = { key: k, dir: this.sort.key === k ? -this.sort.dir : -1 }; this.drawTable(el);
    });
    U.$$('[data-p]', el).forEach(b => b.onclick = () => { this.page += +b.dataset.p; this.drawTable(el); });
    U.$$('tr[data-id]', el).forEach(r => r.addEventListener('click', e => {
      if (e.target.closest('input')) return;
      UI.tradeModal(r.dataset.id, () => App.render());
    }));
    const updateSel = () => {
      U.$('#tlDelete', el).disabled = !this.selected.size;
      U.$('#tlSelInfo', el).textContent = this.selected.size ? `${this.selected.size} selected` : '';
    };
    U.$$('.tlChk', el).forEach(c => c.onchange = () => { c.checked ? this.selected.add(c.value) : this.selected.delete(c.value); updateSel(); });
    U.$('#tlAll', el).onchange = e => { slice.forEach(t => e.target.checked ? this.selected.add(t.id) : this.selected.delete(t.id)); this.drawTable(el); };
    updateSel();
  },

  exportCSV(list) {
    const head = ['Account', 'Symbol', 'Side', 'Qty', 'Entry Time', 'Exit Time', 'Entry Price', 'Exit Price', 'Gross P&L', 'Fees', 'Net P&L', 'Setup', 'Tags', 'Rating', 'Notes'];
    const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
    const lines = [head.join(',')].concat(list.map(t => [t.account, t.symbol, t.side, t.qty, t.entryTime.replace('T', ' '), t.exitTime.replace('T', ' '),
      t.entryPrice, t.exitPrice, t.gross, M.fees(t).toFixed(2), M.net(t).toFixed(2), t.setup || '', (t.tags || []).join('; '), t.rating || '', t.notes || ''].map(q).join(',')));
    U.download(`mubu-trades-${U.todayKey()}.csv`, lines.join('\n'), 'text/csv');
  },
};
