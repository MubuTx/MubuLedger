<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mubu Journal</title>
  <meta name="description" content="Personal futures trading journal — import CSVs, track performance, journal every day.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1236'/%3E%3Cpath d='M7 23V9l9 9 9-9v14' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ==========================================================
   Mubu Journal — midnight blue + white
   ========================================================== */
:root {
  --navy-950: #050820;
  --navy-900: #080D2B;
  --navy-800: #0B1236;
  --navy-700: #121B4B;
  --navy-600: #1A2563;
  --navy-500: #24318A;
  --brand: #1F2E86;
  --brand-hover: #2A3DA8;
  --brand-soft: #E9ECFA;
  --brand-line: #5867D6;

  --bg: #F4F6FB;
  --card: #FFFFFF;
  --border: #E6E9F2;
  --border-strong: #D5DAE8;
  --text: #0E1530;
  --text-2: #3A4260;
  --muted: #6B7290;
  --faint: #9AA1BA;

  --green: #12A06A;
  --green-strong: #0E8A5B;
  --green-bg: #E6F6EE;
  --green-cell: #D8F1E4;
  --red: #E5484D;
  --red-strong: #C8363B;
  --red-bg: #FDECEC;
  --red-cell: #F9DADB;
  --gray-cell: #F0F2F7;

  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(14, 21, 48, .04), 0 2px 8px rgba(14, 21, 48, .04);
  --sidebar-w: 248px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); text-decoration: none; }
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 13px; color: var(--text); }

.app { display: flex; min-height: 100vh; }

/* ---------------- Sidebar ---------------- */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 45%, var(--navy-700) 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 18px 14px;
  transition: width .18s ease;
  z-index: 40;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; }
.logo {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(135deg, #3445B8, #1A2563);
  display: grid; place-items: center; color: #fff;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset;
}
.logo svg { width: 20px; height: 20px; }
.brand-name { font-weight: 700; letter-spacing: .14em; font-size: 14px; white-space: nowrap; }
.collapse-btn {
  margin-left: auto; background: transparent; border: 0; color: rgba(255,255,255,.7);
  font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 6px;
}
.collapse-btn:hover { background: rgba(255,255,255,.08); color: #fff; }

.btn-add {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: #fff; color: var(--navy-800); font-weight: 600;
  border-radius: 10px; padding: 11px 12px; margin-bottom: 18px;
  transition: transform .1s, background .15s;
}
.btn-add:hover { background: #EEF0FB; }
.btn-add .plus { font-size: 18px; line-height: 1; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 12px;
  color: rgba(255,255,255,.72); padding: 10px 12px; border-radius: 9px;
  font-weight: 500; white-space: nowrap;
}
.nav a svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.active { background: rgba(255,255,255,.12); color: #fff; box-shadow: inset 3px 0 0 #fff; }
.nav .sep { height: 1px; background: rgba(255,255,255,.09); margin: 10px 6px; }
.nav .badge-new {
  font-size: 9px; font-weight: 700; background: #3D55E0; color: #fff;
  padding: 2px 5px; border-radius: 4px; letter-spacing: .04em;
}
.sidebar-foot { margin-top: auto; font-size: 11px; color: rgba(255,255,255,.55); padding: 10px 6px 0; line-height: 1.5; border-top: 1px solid rgba(255,255,255,.09); }
.user-email { color: #fff; font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync { display: flex; align-items: center; gap: 6px; margin: 2px 0 8px; }
.sync::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #3ECF8E; }
.sync.busy::before { background: #F2C14B; }
.sync.err::before { background: #FF6B6B; }
.signout { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; border: 0; color: rgba(255,255,255,.72); padding: 9px 8px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 500; }
.signout:hover { background: rgba(255,255,255,.08); color: #fff; }
.app.collapsed .user-box { display: none; }
.app.collapsed .signout { justify-content: center; }

/* Auth screen */
.auth-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  background: radial-gradient(1200px 600px at 20% 0%, #1A2563 0%, transparent 60%), linear-gradient(180deg, var(--navy-900), var(--navy-700));
}
.auth-screen[hidden] { display: none; }
.auth-card { width: 100%; max-width: 400px; background: #fff; border-radius: 16px; padding: 30px 28px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.auth-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .14em; font-size: 13px; color: var(--navy-800); margin-bottom: 22px; }
.auth-brand .logo { color: #fff; }
.auth-card h2 { margin: 0 0 18px; font-size: 21px; letter-spacing: -.01em; }
.auth-card .inp { min-height: 42px; font-size: 14px; }
.auth-submit { width: 100%; margin-top: 18px; padding: 11px; font-size: 14px; }
.auth-links { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 16px; font-size: 13px; color: var(--muted); }
.auth-links a { font-weight: 600; }

.app.collapsed .sidebar { width: 72px; }
.app.collapsed .brand-name, .app.collapsed .nav span, .app.collapsed .btn-add .lbl,
.app.collapsed .sidebar-foot .lbl, .app.collapsed .badge-new { display: none; }
.app.collapsed .collapse-btn { transform: rotate(180deg); margin-left: 0; }
.app.collapsed .brand { flex-direction: column; }
.app.collapsed .nav a { justify-content: center; padding: 10px; }

/* ---------------- Main ---------------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  background: rgba(255,255,255,.96); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px; min-height: 68px;
}
.topbar h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.menu-btn { display: none; background: none; border: 0; padding: 4px; cursor: pointer; color: var(--text); }
.menu-btn svg { width: 22px; height: 22px; }
.filters { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input[type=date] {
  border: 1px solid var(--border-strong); background: #fff; border-radius: 9px;
  padding: 8px 10px; min-height: 36px; cursor: pointer;
}
.filters label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

.view { padding: 22px 28px 48px; }

/* ---------------- Cards & grid ---------------- */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); min-width: 0;
}
.card-head {
  display: flex; align-items: center; gap: 10px; padding: 16px 18px;
  border-bottom: 1px solid var(--border);
}
.card-head h3 { font-size: 15px; font-weight: 600; margin: 0; }
.card-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-body { padding: 16px 18px; }
.info {
  display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%;
  border: 1.3px solid var(--faint); color: var(--faint); font-size: 10px; font-weight: 700; cursor: help;
}

.grid { display: grid; gap: 16px; margin-bottom: 16px; }
.g-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-cal { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* KPI */
.kpi { padding: 16px 18px; display: flex; flex-direction: column; min-height: 112px; }
.kpi .label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; white-space: nowrap; }
.kpi .kpi-row { display: flex; align-items: center; gap: 10px; flex: 1; }
.kpi .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.kpi .count-badge { background: var(--gray-cell); color: var(--text-2); font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 6px; }
.kpi .viz { width: 92px; flex-shrink: 0; margin-left: auto; text-align: center; display: flex; flex-direction: column; align-items: center; }
.kpi .viz .wl { width: 100%; }
.kpi .viz:has(.wl) { width: auto; flex: 1; min-width: 80px; max-width: 170px; }
.gauge { width: 100%; display: block; }
.gauge-legend { display: flex; justify-content: space-between; margin-top: 2px; gap: 4px; }
.pill { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 99px; }
.pill.g { background: var(--green-bg); color: var(--green-strong); }
.pill.r { background: var(--red-bg); color: var(--red-strong); }
.pill.b { background: var(--brand-soft); color: var(--brand); }
.wl-bar { display: flex; height: 7px; border-radius: 99px; overflow: hidden; background: var(--gray-cell); }
.wl-bar .w { background: var(--green); }
.wl-bar .l { background: var(--red); }
.wl-vals { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-top: 6px; }

.pos { color: var(--green); }
.neg { color: var(--red); }
.flat { color: var(--muted); }

.chart-box { position: relative; height: 280px; }
.chart-box.sm { height: 200px; }
.chart-box.lg { height: 340px; }
.chart-box.xs { height: 150px; }

/* Score */
.score-wrap { display: flex; flex-direction: column; }
.score-foot { display: flex; align-items: center; gap: 18px; border-top: 1px solid var(--border); padding-top: 14px; margin-top: 6px; }
.score-foot .big { font-size: 26px; font-weight: 700; }
.score-foot .sublabel { color: var(--muted); font-size: 12px; }
.score-scale { flex: 1; }
.score-track { position: relative; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #E5484D, #F2A93B 40%, #E9D33F 55%, #12A06A); }
.score-track .marker { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--navy-700); transform: translate(-50%, -50%); }
.score-ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--faint); margin-top: 5px; }

/* Heatmap */
.heat { display: grid; grid-template-columns: 34px 1fr; gap: 6px; }
.heat-days { display: grid; grid-template-rows: 14px repeat(7, 1fr); gap: 4px; font-size: 11px; color: var(--muted); }
.heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: 14px repeat(7, 1fr); gap: 4px; }
.heat-grid .m { font-size: 10px; color: var(--faint); white-space: nowrap; }
.heat-cell { aspect-ratio: 1; border-radius: 4px; background: var(--gray-cell); min-width: 10px; max-height: 26px; }
.heat-cell.future { background: transparent; border: 1px dashed var(--border); }
.heat-cell.l1 { background: #D7DCF6; } .heat-cell.l2 { background: #A9B3EC; }
.heat-cell.l3 { background: #6E7EDD; } .heat-cell.l4 { background: #2F44C2; }
.heat-cell.traded { box-shadow: inset 0 0 0 1.5px #9AA6E8; }
.heat-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 11px; color: var(--muted); margin-top: 10px; }
.heat-legend .heat-cell { width: 12px; min-width: 12px; }
.today-score { display: flex; align-items: center; gap: 14px; border-top: 1px solid var(--border); padding-top: 14px; margin-top: 12px; }
.today-score .big { font-size: 22px; font-weight: 700; }
.progress { height: 7px; background: var(--gray-cell); border-radius: 99px; overflow: hidden; flex: 1; max-width: 160px; }
.progress > div { height: 100%; background: var(--brand-line); border-radius: 99px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  border: 1px solid var(--border-strong); background: #fff; color: var(--text);
  padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 13px; cursor: pointer;
  transition: background .12s, border-color .12s; white-space: nowrap;
}
.btn:hover { background: #F6F7FC; border-color: #C5CBE0; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-hover); }
.btn.danger { color: var(--red-strong); border-color: #F2C4C6; }
.btn.danger:hover { background: var(--red-bg); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--gray-cell); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { background: none; border: 0; cursor: pointer; font-size: 22px; color: var(--muted); padding: 0 6px; border-radius: 6px; }
.icon-btn:hover { background: var(--gray-cell); color: var(--text); }

/* Tabs */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border); padding: 0 18px; }
.tabs button {
  background: none; border: 0; padding: 14px 0 12px; font-weight: 500; font-size: 14px;
  color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
.page-tabs { background: transparent; padding: 0; margin-bottom: 16px; }

/* Tables */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font-weight: 600; color: var(--text-2); background: #F7F8FC;
  padding: 11px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 12px;
}
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--brand); }
.tbl td { padding: 11px 12px; border-bottom: 1px solid #F0F2F7; white-space: nowrap; }
.tbl tbody tr:hover { background: #FAFBFE; }
.tbl tr.clickable { cursor: pointer; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.c, .tbl th.c { text-align: center; }
.status { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; letter-spacing: .03em; }
.status.win { background: var(--green-bg); color: var(--green-strong); }
.status.loss { background: var(--red-bg); color: var(--red-strong); }
.status.be { background: var(--gray-cell); color: var(--muted); }
.side { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
.side.long { background: #E8EEFF; color: #2846C4; }
.side.short { background: #FFF1E6; color: #B4560F; }
.tag { display: inline-block; font-size: 11px; background: var(--brand-soft); color: var(--brand); padding: 2px 8px; border-radius: 99px; margin-right: 4px; }
.empty-row td { text-align: center; color: var(--muted); padding: 30px; }

/* Calendar */
.cal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.cal-head .month { font-size: 17px; font-weight: 600; min-width: 130px; text-align: center; }
.cal-head .stats { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; background: var(--gray-cell); color: var(--text-2); }
.chip.pos { background: var(--green-bg); color: var(--green-strong); }
.chip.neg { background: var(--red-bg); color: var(--red-strong); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(0, 1.15fr); gap: 6px; padding: 14px; }
.cal .dow { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 8px 0; background: #F7F8FC; border-radius: 8px; }
.cal .cell {
  min-height: 92px; border-radius: 9px; background: #F7F8FB; border: 1px solid transparent;
  padding: 6px 8px; display: flex; flex-direction: column; align-items: flex-end; font-size: 11px; color: var(--muted);
  cursor: default; position: relative;
}
.cal .cell.out { background: transparent; border: 1px dashed #EDEFF5; }
.cal .cell .d { font-size: 11px; font-weight: 500; }
.cal .cell .amt { margin-top: auto; font-size: 15px; font-weight: 700; color: var(--text); align-self: center; }
.cal .cell .sub { align-self: center; font-size: 11px; color: var(--text-2); opacity: .8; line-height: 1.35; text-align: center; }
.cal .cell.win { background: var(--green-cell); border-color: #A6DDC1; cursor: pointer; }
.cal .cell.loss { background: var(--red-cell); border-color: #F0B0B2; cursor: pointer; }
.cal .cell.be { background: #ECEEF4; cursor: pointer; }
.cal .cell.win:hover, .cal .cell.loss:hover, .cal .cell.be:hover { filter: brightness(.97); }
.cal .cell.today { box-shadow: 0 0 0 2px var(--brand-line); }
.cal .cell .note-dot { position: absolute; left: 8px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--brand-line); }
.cal .week { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; display: flex; flex-direction: column; justify-content: center; gap: 3px; background: #fff; }
.cal .week .wk { font-size: 12px; color: var(--muted); }
.cal .week .amt { font-size: 17px; font-weight: 700; }
.cal .week .chip { align-self: flex-start; font-size: 11px; padding: 2px 8px; }

/* Runs on the calendar */
.cal .cell { padding-bottom: var(--run-pad, 6px); }
.run-lines { position: absolute; left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; }
.run-line {
  position: absolute; left: -4px; right: -4px; height: 4px; pointer-events: auto;
  background: var(--rc); border-radius: 0;
}
.run-line.st-eval { background: repeating-linear-gradient(90deg, var(--rc) 0 6px, transparent 6px 9px); }
.run-line.st-live { height: 5px; box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px var(--rc); }
.run-line.rs { left: 7px; border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
.run-line.re { right: 7px; border-top-right-radius: 3px; border-bottom-right-radius: 3px; }
.run-promo { position: absolute; left: 4px; top: 50%; width: 9px; height: 9px; background: var(--rc); border: 2px solid #fff; transform: translate(-50%, -50%) rotate(45deg); box-shadow: 0 0 0 1px var(--rc); }
.run-pay { position: absolute; right: 6px; bottom: 5px; font-style: normal; font-size: 9px; font-weight: 800; color: #fff; background: var(--rc); border: 1.5px solid #fff; width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 1px var(--rc); }
.run-x { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); font-style: normal; font-weight: 800; font-size: 12px; color: var(--red-strong); line-height: 1; }
.run-legend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 14px 14px; }
.run-legend.empty { justify-content: space-between; gap: 12px; }
.run-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: #fff; border-radius: 99px; padding: 5px 12px 5px 8px; font-size: 12px; color: var(--text); }
.run-chip:hover { border-color: var(--brand-line); background: #F8F9FE; }
.run-swatch { display: inline-block; width: 22px; height: 4px; border-radius: 2px; background: var(--rc); }
.run-swatch.st-eval { background: repeating-linear-gradient(90deg, var(--rc) 0 5px, transparent 5px 8px); }
.run-key { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.run-key .run-swatch { margin-left: 6px; }
.run-key i.static { position: static; transform: none; display: inline-grid; margin-left: 6px; --rc: #6B7290; }
.run-key .run-promo.static { transform: rotate(45deg); width: 8px; height: 8px; }

/* Runs page */
.run-card { margin-bottom: 16px; scroll-margin-top: 90px; }
.run-card .card-head { flex-wrap: wrap; }
.run-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--rc); flex-shrink: 0; }
.run-title { font-size: 16px; font-weight: 600; }
.run-dates { font-size: 12px; color: var(--muted); }
.stages { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
.stage {
  min-width: 190px; flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: #FBFCFE;
  border-top: 4px solid var(--rc);
}
.stage.st-eval { border-top-style: dashed; }
.stage .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.stage .acct { font-weight: 600; margin: 4px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage .meta { font-size: 12px; color: var(--text-2); line-height: 1.6; }
.stage-arrow { display: grid; place-items: center; padding: 0 8px; color: var(--faint); font-size: 18px; flex-shrink: 0; }
.run-kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.run-kpis .k { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.run-kpis .v { font-size: 17px; font-weight: 600; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border-strong); cursor: pointer; background: var(--rc); }
.swatches button.on { box-shadow: 0 0 0 2px var(--text); }
.stage-edit { display: grid; grid-template-columns: 1.4fr .8fr 1fr 1fr .9fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
.stage-edit .field-label { font-size: 11px; margin-bottom: 3px; }
@media (max-width: 900px) {
  .run-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stage-edit { grid-template-columns: 1fr 1fr; }
  .run-line { height: 3px; }
  .run-pay { width: 12px; height: 12px; font-size: 7px; right: 2px; }
}

/* Mini calendar */
.mini-cal { padding: 14px; }
.mini-cal .mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
.mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.mini-grid .dw { font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0; }
.mini-grid .md { text-align: center; padding: 7px 0; font-size: 12px; border-radius: 7px; background: #F5F6FA; color: var(--text-2); }
.mini-grid .md.win { background: var(--green-cell); color: var(--green-strong); font-weight: 600; cursor: pointer; }
.mini-grid .md.loss { background: var(--red-cell); color: var(--red-strong); font-weight: 600; cursor: pointer; }
.mini-grid .md.be { background: #E6E8F0; cursor: pointer; }
.mini-grid .md.blank { background: transparent; }

/* Journal */
.journal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.journal-side { position: sticky; top: 88px; display: flex; flex-direction: column; gap: 16px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.day-card { margin-bottom: 14px; scroll-margin-top: 90px; }
.day-head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; flex-wrap: wrap; }

.day-head .date { font-weight: 600; font-size: 16px; }

.day-head .right { margin-left: auto; display: flex; gap: 8px; }
.day-body { display: none; border-top: 1px solid var(--border); padding: 16px 18px; }

.day-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: center; }
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 14px; }
.stat-grid .s .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.stat-grid .s .v { font-size: 16px; font-weight: 600; }
.day-notes { margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
textarea.notes {
  width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--border-strong); border-radius: 10px;
  padding: 10px 12px; line-height: 1.5; background: #FBFCFE;
}
textarea.notes:focus, input.inp:focus, select.inp:focus { outline: 2px solid #C9D0F4; border-color: var(--brand-line); }
.field-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; display: block; }
.checklist label { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; font-size: 13px; cursor: pointer; }
.checklist input { margin-top: 2px; accent-color: var(--brand); width: 15px; height: 15px; }
.saved-hint { font-size: 11px; color: var(--green); margin-left: 8px; opacity: 0; transition: opacity .2s; }
.saved-hint.show { opacity: 1; }

.inp {

.help code, .code { background: #F1F3F9; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

.dropzone {

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--navy-800); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 500;

.toast.err { background: var(--red-strong); }

.metric-bar { display: flex; gap: 8px; align-items: center; padding: 14px 18px 0; flex-wrap: wrap; }
.metric-bar select { border: 1px solid var(--border-strong); border-radius: 9px; padding: 7px 10px; background: #fff; }

.year-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 16px; }

.empty {

.empty .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

  <script>
/* Small helpers shared by every view. */
const U = (() => {
  const pad = n => String(n).padStart(2, '0');
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  return {
    pad, MONTHS, DOW,
    $: (sel, el = document) => el.querySelector(sel),
    $$: (sel, el = document) => [...el.querySelectorAll(sel)],
    h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; },
    esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },

    money(v, dec = 2) {
      if (v == null || !isFinite(v)) return '—';
      const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
      return (v < 0 ? '-$' : '$') + s;
    },
    moneyShort(v) {
      if (v == null || !isFinite(v)) return '—';
      const a = Math.abs(v); let s;
      if (a >= 1e6) s = (a / 1e6).toFixed(2) + 'M';
      else if (a >= 1e4) s = (a / 1e3).toFixed(1) + 'K';
      else if (a >= 1e3) s = (a / 1e3).toFixed(2) + 'K';
      else s = Number.isInteger(Math.round(a * 100) / 100) ? String(Math.round(a)) : a.toFixed(a >= 100 ? 0 : 2);
      return (v < 0 ? '-$' : '$') + s;
    },
    moneyAxis(v) {
      const a = Math.abs(v);
      const s = a >= 1000 ? (a / 1000).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'K' : a.toLocaleString('en-US', { maximumFractionDigits: 0 });
      return (v < 0 ? '-$' : '$') + s;
    },
    pct(v, d = 2) { return v != null && isFinite(v) ? (v * 100).toFixed(d) + '%' : '—'; },
    num(v, d = 2) { if (v === Infinity) return '∞'; return v != null && isFinite(v) ? v.toFixed(d) : '—'; },
    price(v) {
      if (v == null || !isFinite(v)) return '—';
      return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 5 });
    },
    cls(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'flat'; },

    /* Dates are stored as local, timezone-less strings: YYYY-MM-DDTHH:mm:ss */
    dayKey(iso) { return iso ? iso.slice(0, 10) : ''; },
    toLocal(iso) {
      const [d, t = '00:00:00'] = iso.split('T');
      const [y, m, dd] = d.split('-').map(Number);
      const [hh = 0, mi = 0, ss = 0] = t.split(':').map(Number);
      return new Date(y, m - 1, dd, hh, mi, ss);
    },
    keyOf(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; },
    isoOf(date) { return `${U.keyOf(date)}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`; },
    todayKey() { return U.keyOf(new Date()); },
    addDays(key, n) { const d = U.toLocal(key); d.setDate(d.getDate() + n); return U.keyOf(d); },
    fmtShort(key) { const [y, m, d] = key.split('-'); return `${m}/${d}/${y.slice(2)}`; },
    fmtDate(key) { const [y, m, d] = key.split('-'); return `${m}/${d}/${y}`; },
    fmtLong(key) {
      const d = U.toLocal(key);
      return `${DOW[d.getDay()]}, ${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}, ${d.getFullYear()}`;
    },
    fmtTime(iso) { return iso ? iso.slice(11, 16) : ''; },
    fmtDateTime(iso) { return iso ? `${U.fmtDate(iso.slice(0, 10))} ${iso.slice(11, 19)}` : '—'; },
    weekStart(key) { const d = U.toLocal(key); d.setDate(d.getDate() - d.getDay()); return U.keyOf(d); },
    secondsBetween(a, b) { return Math.max(0, (U.toLocal(b) - U.toLocal(a)) / 1000); },
    duration(sec) {
      if (!isFinite(sec)) return '—';
      sec = Math.round(sec);
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      if (h) return `${h}h ${m}m`;
      if (m) return `${m}m ${s}s`;
      return `${s}s`;
    },

    hash(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
    },
    uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
    debounce(fn, ms = 400) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
    download(name, text, type = 'text/plain') {
      const blob = new Blob([text], { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    },
    readFile(file) {
      return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); });
    },
  };
})();

  const S = {
    data: null,

    /* Each signed-in user gets their own local cache key. */
    useUser(userId) { KEY = LEGACY_KEY + ':' + userId; },
    legacyData() {
      try { const d = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null'); return d && Array.isArray(d.trades) ? d : null; } catch (e) { return null; }
    },
    retireLegacy() {
      try { const v = localStorage.getItem(LEGACY_KEY); if (v) { localStorage.setItem(LEGACY_KEY + ':migrated', v); localStorage.removeItem(LEGACY_KEY); } } catch (e) {}
    },

    normalize(parsed) {
      const d = defaults();
      if (parsed && typeof parsed === 'object') {
        Object.assign(d, parsed);
        d.settings = Object.assign(defaults().settings, parsed.settings || {});
        d.ui = Object.assign(defaults().ui, parsed.ui || {});
        if (!Array.isArray(d.trades)) d.trades = [];
        if (!Array.isArray(d.imports)) d.imports = [];
        if (!Array.isArray(d.runs)) d.runs = [];
      }
      return d;
    },

    load() {
      let parsed = null;
      try { parsed = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { parsed = null; }
      this.data = this.normalize(parsed);
      return this.data;
    },

    /* Replace in-memory + local copy without marking it as a new local edit (used when pulling from the cloud). */
    setFromRemote(obj, remoteAt) {
      this.data = this.normalize(obj);
      this.writeLocal();
      this.setMeta({ dirty: false, syncedAt: remoteAt, localAt: remoteAt });
    },

    meta() { try { return JSON.parse(localStorage.getItem(KEY + ':meta') || '{}'); } catch (e) { return {}; } },
    setMeta(patch) { try { localStorage.setItem(KEY + ':meta', JSON.stringify(Object.assign(this.meta(), patch))); } catch (e) {} },

    writeLocal() {
      try { localStorage.setItem(KEY, JSON.stringify(this.data)); return true; }
      catch (e) { return false; }
    },

    save() {
      const ok = this.writeLocal();
      this.setMeta({ dirty: true, localAt: new Date().toISOString() });
      if (typeof Cloud !== 'undefined' && Cloud.user) Cloud.queue();
      else if (!ok) App.toast('Could not save — browser storage is full. Export a backup.', 'err');
    },

    accounts() { return [...new Set(this.data.trades.map(t => t.account))].sort(); },
    roots() { return [...new Set(this.data.trades.map(t => t.root))].sort(); },
    setups() { return [...new Set(this.data.trades.map(t => t.setup).filter(Boolean))].sort(); },
    idSet() { return new Set(this.data.trades.map(t => t.id)); },

    commitImport(meta, trades) {
      this.data.trades.push(...trades);
      this.data.imports.unshift(meta);
      this.save();
    },
    undoImport(importId) {
      this.data.trades = this.data.trades.filter(t => t.importId !== importId);
      this.data.imports = this.data.imports.filter(i => i.id !== importId);
      this.save();
    },
    updateTrade(id, patch) {
      const t = this.data.trades.find(x => x.id === id);
      if (t) { Object.assign(t, patch); this.save(); }
      return t;
    },
    deleteTrades(ids) {
      const set = new Set(ids);
      this.data.trades = this.data.trades.filter(t => !set.has(t.id));
      this.save();
    },
    setNote(day, text) {
      if (text && text.trim()) this.data.notes[day] = text; else delete this.data.notes[day];
      this.save();
    },
    setChecks(day, ids) {
      if (ids.length) this.data.checks[day] = ids; else delete this.data.checks[day];
      this.save();
    },

    exportJSON() { return JSON.stringify(this.data, null, 2); },
    importJSON(obj) {
      if (!obj || !Array.isArray(obj.trades)) throw new Error('Not a Mubu Journal backup file.');
      this.data = this.normalize(obj);
      this.save();
    },
    clearAll() { this.data = defaults(); this.save(); },
    removeAccount(acct) {
      this.data.trades = this.data.trades.filter(t => t.account !== acct);
      this.data.imports = this.data.imports.filter(i => i.account !== acct);
      this.save();
    },
  };
  return S;
})();

  <script>
/* CSV parsing + format detection.
   Supported:
   1. Tradovate "Performance" export  (symbol, qty, buyPrice, sellPrice, pnl, boughtTimestamp, soldTimestamp …)
   2. Generic closed-trades CSV       (any file with a P&L column + symbol + date)
   3. Fills / Orders export           (B/S, qty, price, time, contract) → round trips built FIFO
*/
const Parser = (() => {
  const POINT_VALUES = {
    NQ: 20, MNQ: 2, ES: 50, MES: 5, YM: 5, MYM: 0.5, RTY: 50, M2K: 5,
    CL: 1000, MCL: 100, QM: 500, NG: 10000, GC: 100, MGC: 10, SI: 5000, SIL: 1000, HG: 25000, MHG: 2500,
    ZB: 1000, UB: 1000, ZN: 1000, ZF: 1000, ZT: 2000, '6E': 125000, '6J': 12500000, '6B': 62500, M6E: 12500,
  };

  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const rows = []; let row = [], field = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += c;
      } else if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some(v => v.trim() !== '')) rows.push(row);
        row = [];
      } else field += c;
    }
    row.push(field);
    if (row.some(v => v.trim() !== '')) rows.push(row);
    return rows;
  }

  const norm = h => String(h).toLowerCase().replace(/[^a-z0-9&/]/g, '');

  function finder(headers) {
    const n = headers.map(norm);
    return aliases => {
      for (const a of aliases) { const i = n.indexOf(norm(a)); if (i >= 0) return i; }
      return -1;
    };
  }

  function parseMoney(s) {
    if (s == null) return NaN;
    s = String(s).trim();
    if (!s) return NaN;
    const neg = /[(\-]/.test(s);
    const v = parseFloat(s.replace(/[^0-9.]/g, ''));
    if (!isFinite(v)) return NaN;
    return neg ? -v : v;
  }
  const parseNum = s => { const v = parseFloat(String(s ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(v) ? v : NaN; };

  function parseDate(s) {
    if (!s) return null;
    s = String(s).trim();
    // "Jun 10, 2026, 08:42" (TradingView)
    let t = s.match(/^([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{1,2}),?\s+(\d{4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
    if (t) {
      const mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(t[1].toLowerCase()) + 1;
      let hh = +t[4];
      if (t[7]) { const ap = t[7].toUpperCase(); if (ap === 'PM' && hh < 12) hh += 12; if (ap === 'AM' && hh === 12) hh = 0; }
      if (mo) return `${t[3]}-${U.pad(mo)}-${U.pad(t[2])}T${U.pad(hh)}:${t[5]}:${U.pad(t[6] || 0)}`;
    }
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?\s*(AM|PM)?)?/i);
    if (m) {
      let [, mo, d, y, hh = 0, mi = 0, ss = 0, ap] = m;
      y = +y; if (y < 100) y += 2000;
      hh = +hh;
      if (ap) { ap = ap.toUpperCase(); if (ap === 'PM' && hh < 12) hh += 12; if (ap === 'AM' && hh === 12) hh = 0; }
      return `${y}-${U.pad(mo)}-${U.pad(d)}T${U.pad(hh)}:${U.pad(mi)}:${U.pad(ss || 0)}`;
    }
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
    if (m) {
      const [, y, mo, d, hh = 0, mi = 0, ss = 0] = m;
      return `${y}-${U.pad(mo)}-${U.pad(d)}T${U.pad(hh)}:${U.pad(mi)}:${U.pad(ss)}`;
    }
    const d = new Date(s);
    return isNaN(d) ? null : U.isoOf(d);
  }

  function rootOf(symbol) {
    let s = String(symbol || '').toUpperCase().trim().replace(/^\//, '');
    if (s.includes(':')) s = s.split(':').pop();      // TradingView "CME_MINI:NQ1!"
    if (/\d+!$/.test(s)) return s.replace(/\d+!$/, '');  // continuous contract "NQ1!" → NQ
    s = s.split(/[\s.]/)[0];
    const m = s.match(/^([A-Z0-9]{1,4}?)[FGHJKMNQUVXZ]\d{1,4}$/);
    if (m) return m[1];
    return s.replace(/\d+$/, '') || s;
  }

  function pointValue(root, overrides = {}) {
    if (overrides[root] != null && overrides[root] !== '') return +overrides[root];
    return POINT_VALUES[root];
  }

  /* ---------- 1. Tradovate Performance ---------- */
  function fromTradovatePerformance(headers, rows) {
    const f = finder(headers);
    const ix = {
      sym: f(['symbol', 'contract']), qty: f(['qty', 'quantity']), buy: f(['buyPrice']), sell: f(['sellPrice']),
      pnl: f(['pnl', 'p&l']), bt: f(['boughtTimestamp']), st: f(['soldTimestamp']),
      bid: f(['buyFillId']), sid: f(['sellFillId']),
    };
    const groups = new Map(); const warnings = []; let skipped = 0;
    rows.forEach(r => {
      const sym = (r[ix.sym] || '').trim();
      const qty = Math.abs(parseNum(r[ix.qty]));
      const buy = parseNum(r[ix.buy]), sell = parseNum(r[ix.sell]);
      const pnl = parseMoney(r[ix.pnl]);
      const bt = parseDate(r[ix.bt]), st = parseDate(r[ix.st]);
      if (!sym || !isFinite(qty) || !qty || !bt || !st || !isFinite(pnl)) { skipped++; return; }
      const long = bt <= st;
      const side = long ? 'Long' : 'Short';
      const entryTime = long ? bt : st, exitTime = long ? st : bt;
      const entryPrice = long ? buy : sell, exitPrice = long ? sell : buy;
      const key = `${sym}|${side}|${entryTime}`;
      let g = groups.get(key);
      if (!g) {
        g = { symbol: sym, side, entryTime, exitTime, qty: 0, eN: 0, xN: 0, gross: 0, ids: [] };
        groups.set(key, g);
      }
      g.qty += qty; g.eN += entryPrice * qty; g.xN += exitPrice * qty; g.gross += pnl;
      if (exitTime > g.exitTime) g.exitTime = exitTime;
      const fid = [ix.bid >= 0 ? r[ix.bid] : '', ix.sid >= 0 ? r[ix.sid] : ''].join('/');
      g.ids.push(fid !== '/' ? fid : `${entryTime}|${exitTime}|${qty}|${pnl}`);
    });
    const trades = [...groups.values()].map(g => ({
      baseId: 'tv:' + U.hash(g.symbol + '|' + g.ids.sort().join(',')),
      symbol: g.symbol, root: rootOf(g.symbol), side: g.side, qty: g.qty,
      entryPrice: g.eN / g.qty, exitPrice: g.xN / g.qty,
      entryTime: g.entryTime, exitTime: g.exitTime,
      gross: round2(g.gross), fees: null,
    }));
    if (skipped) warnings.push(`${skipped} row(s) skipped because they were missing a symbol, time, quantity or P&L.`);
    return { format: 'Tradovate Performance', trades, warnings };
  }

  /* ---------- 2. Generic closed trades ---------- */
  function fromGenericTrades(headers, rows, opts) {
    const f = finder(headers);
    const ix = {
      sym: f(['symbol', 'contract', 'instrument', 'ticker', 'product', 'market']),
      side: f(['side', 'direction', 'type', 'longshort', 'position', 'action', 'b/s']),
      qty: f(['qty', 'quantity', 'size', 'contracts', 'volume', 'lots', 'shares']),
      entry: f(['entryprice', 'entry', 'avgentry', 'avgentryprice', 'openprice', 'priceopen', 'entry price']),
      exit: f(['exitprice', 'exit', 'avgexit', 'avgexitprice', 'closeprice', 'priceclose']),
      et: f(['entrytime', 'entrydate', 'entrydatetime', 'opentime', 'opendate', 'opened', 'starttime', 'date', 'datetime', 'time', 'tradedate']),
      xt: f(['exittime', 'exitdate', 'exitdatetime', 'closetime', 'closedate', 'closed', 'endtime']),
      pnl: f(['grosspnl', 'gross p&l', 'grossprofit', 'pnl', 'p&l', 'netpnl', 'net p&l', 'profit', 'profitloss', 'profit/loss', 'realizedpnl', 'realized p&l', 'result']),
      net: f(['netpnl', 'net p&l', 'netprofit']),
      fees: f(['fees', 'fee', 'commission', 'commissions', 'comm', 'totalfees']),
      acct: f(['account', 'accountname', 'accountid', 'acct']),
      setup: f(['setup', 'strategy', 'playbook', 'tag', 'tags']),
      notes: f(['notes', 'note', 'comment', 'comments']),
    };
    if (ix.et < 0 || ix.pnl < 0) throw new Error('Could not find a date/time column and a P&L column.');
    // If both gross and net columns exist and pnl==net, treat as net with fees already applied.
    const pnlIsNet = ix.pnl === ix.net;
    let skipped = 0; const trades = [];
    rows.forEach((r, i) => {
      const entryTime = parseDate(r[ix.et]);
      let pnl = parseMoney(r[ix.pnl]);
      if (!entryTime || !isFinite(pnl)) { skipped++; return; }
      const exitTime = parseDate(r[ix.xt]) || entryTime;
      const symbol = (ix.sym >= 0 ? r[ix.sym] : 'UNKNOWN').trim() || 'UNKNOWN';
      const qty = Math.abs(parseNum(ix.qty >= 0 ? r[ix.qty] : 1)) || 1;
      const entryPrice = parseNum(ix.entry >= 0 ? r[ix.entry] : NaN);
      const exitPrice = parseNum(ix.exit >= 0 ? r[ix.exit] : NaN);
      let fees = ix.fees >= 0 ? Math.abs(parseMoney(r[ix.fees])) : NaN;
      if (pnlIsNet) { fees = isFinite(fees) ? fees : 0; pnl = pnl + fees; } // store gross
      let side = 'Long';
      const sv = ix.side >= 0 ? String(r[ix.side]).trim().toLowerCase() : '';
      if (/^(s|short|sell|sld|sold)/.test(sv)) side = 'Short';
      else if (!sv && isFinite(entryPrice) && isFinite(exitPrice) && exitPrice !== entryPrice) {
        side = Math.sign(exitPrice - entryPrice) === Math.sign(pnl) ? 'Long' : 'Short';
      }
      trades.push({
        baseId: 'g:' + U.hash([symbol, side, entryTime, exitTime, qty, entryPrice, exitPrice, pnl].join('|')),
        symbol, root: rootOf(symbol), side, qty, entryPrice, exitPrice, entryTime, exitTime,
        gross: round2(pnl), fees: isFinite(fees) ? round2(fees) : null,
        account: ix.acct >= 0 ? String(r[ix.acct]).trim() : '',
        setup: ix.setup >= 0 ? String(r[ix.setup]).trim() : '',
        notes: ix.notes >= 0 ? String(r[ix.notes]).trim() : '',
      });
    });
    const warnings = [];
    if (skipped) warnings.push(`${skipped} row(s) skipped (missing date or P&L).`);
    if (ix.side < 0) warnings.push('No side column found — side was inferred from prices (or set to Long).');
    return { format: 'Closed trades CSV', trades, warnings };
  }

  /* ---------- 2b. TradingView trade history (one Entry row + one Exit row per trade) ---------- */
  function fromTradingView(headers, rows) {
    const f = finder(headers);
    const ix = {
      sym: f(['symbol']), num: f(['tradenumber', 'trade#', 'trade']), type: f(['type']), time: f(['dateandtime', 'date/time', 'datetime', 'time']),
      price: f(['price', 'priceusd']), qty: f(['sizeqty', 'qty', 'quantity', 'contracts']),
      pnl: f(['netpnlusd', 'netpnl', 'profitusd', 'profit', 'pnl']), comm: f(['commissionusd', 'commission']), oid: f(['orderid']),
    };
    const groups = new Map(); let skipped = 0;
    rows.forEach(r => {
      const sym = String(r[ix.sym] || '').trim(), num = String(r[ix.num] || '').trim(), type = String(r[ix.type] || '');
      const time = parseDate(r[ix.time]);
      if (!sym || !num || !time) { skipped++; return; }
      const k = sym + '|' + num;
      if (!groups.has(k)) groups.set(k, { sym, num });
      const g = groups.get(k);
      const row = { time, price: parseNum(r[ix.price]), qty: Math.abs(parseNum(r[ix.qty])), pnl: parseMoney(r[ix.pnl]),
        comm: ix.comm >= 0 ? Math.abs(parseMoney(r[ix.comm])) : NaN, oid: ix.oid >= 0 ? r[ix.oid] : '', short: /short/i.test(type) };
      if (/entry/i.test(type)) g.entry = row; else if (/exit/i.test(type)) g.exit = row;
    });
    const trades = []; let open = 0;
    groups.forEach(g => {
      if (!g.entry || !g.exit) { open++; return; }
      const net = isFinite(g.exit.pnl) ? g.exit.pnl : g.entry.pnl;
      if (!isFinite(net)) { skipped++; return; }
      const fees = isFinite(g.exit.comm) ? g.exit.comm : 0;
      trades.push({
        baseId: 'tvw:' + U.hash([g.sym, g.entry.oid, g.exit.oid, g.entry.time, g.exit.time].join('|')),
        symbol: g.sym, root: rootOf(g.sym), side: (g.entry.short || g.exit.short) ? 'Short' : 'Long',
        qty: g.entry.qty || g.exit.qty || 1, entryPrice: g.entry.price, exitPrice: g.exit.price,
        entryTime: g.entry.time, exitTime: g.exit.time, gross: round2(net + fees), fees: round2(fees),
      });
    });
    const warnings = [];
    if (skipped) warnings.push(`${skipped} row(s) skipped (incomplete).`);
    if (open) warnings.push(`${open} trade(s) without an exit row (still open) were not imported.`);
    return { format: 'TradingView trade history', trades, warnings };
  }

  /* ---------- 3. Fills / Orders → FIFO round trips ---------- */
  function fromFills(headers, rows, opts) {
    const f = finder(headers);
    const ix = {
      sym: f(['contract', 'symbol', 'instrument', 'product']),
      side: f(['b/s', 'bs', 'side', 'action', 'buysell', 'buy/sell']),
      qty: f(['filledqty', 'fillqty', 'filled', 'qty', 'quantity', 'size']),
      price: f(['avgprice', 'avgfillprice', 'fillprice', 'price', 'executionprice']),
      time: f(['filltime', 'fill time', 'closingtime', 'closing time', 'timestamp', 'time', 'datetime', 'date', 'executiontime']),
      status: f(['status']),
      fee: f(['fee', 'fees', 'commission', 'commissions']),
      id: f(['fillid', 'orderid', 'id', 'execid']),
      acct: f(['account', 'accountname']),
    };
    const fills = []; let skipped = 0;
    rows.forEach(r => {
      if (ix.status >= 0 && !/fill/i.test(r[ix.status] || '')) { skipped++; return; }
      const sideRaw = String(r[ix.side] || '').trim().toLowerCase();
      const dir = /^b/.test(sideRaw) ? 1 : /^s/.test(sideRaw) ? -1 : 0;
      const qty = Math.abs(parseNum(r[ix.qty])), price = parseNum(r[ix.price]), time = parseDate(r[ix.time]);
      const symbol = String(r[ix.sym] || '').trim();
      if (!dir || !qty || !isFinite(price) || !time || !symbol) { skipped++; return; }
      fills.push({ dir, qty, price, time, symbol, fee: ix.fee >= 0 ? Math.abs(parseMoney(r[ix.fee])) || 0 : null,
        id: ix.id >= 0 ? r[ix.id] : '', account: ix.acct >= 0 ? String(r[ix.acct]).trim() : '' });
    });
    fills.sort((a, b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0);

    const unknownRoots = new Set();
    const state = new Map(); const trades = [];
    const finalize = cur => {
      trades.push({
        baseId: 'f:' + U.hash(cur.symbol + '|' + cur.ids.join(',')),
        symbol: cur.symbol, root: cur.root, side: cur.dir > 0 ? 'Long' : 'Short', qty: cur.eQ,
        entryPrice: cur.eN / cur.eQ, exitPrice: cur.xN / cur.xQ, entryTime: cur.entryTime, exitTime: cur.exitTime,
        gross: round2(cur.gross), fees: cur.hasFees ? round2(cur.fees) : null, account: cur.account,
      });
    };
    fills.forEach(fl => {
      const root = rootOf(fl.symbol);
      let pv = pointValue(root, opts.pointValues);
      if (!pv) { unknownRoots.add(root); pv = 1; }
      const k = fl.account + '|' + fl.symbol;
      let st = state.get(k);
      if (!st) { st = { lots: [], cur: null }; state.set(k, st); }
      let remaining = fl.qty;
      const feePerC = fl.fee != null ? fl.fee / fl.qty : 0;
      const open = (qty) => {
        if (!st.cur) st.cur = { symbol: fl.symbol, root, dir: fl.dir, entryTime: fl.time, exitTime: fl.time, eQ: 0, eN: 0, xQ: 0, xN: 0, gross: 0, fees: 0, hasFees: fl.fee != null, ids: [], account: fl.account };
        st.lots.push({ qty, price: fl.price });
        st.cur.eQ += qty; st.cur.eN += qty * fl.price; st.cur.fees += feePerC * qty;
        st.cur.ids.push(fl.id || `${fl.time}:${fl.price}:${qty}`);
      };
      if (!st.cur || st.cur.dir === fl.dir) { open(remaining); return; }
      st.cur.ids.push(fl.id || `${fl.time}:${fl.price}:${remaining}`);
      while (remaining > 0 && st.lots.length) {
        const lot = st.lots[0];
        const m = Math.min(lot.qty, remaining);
        st.cur.gross += (fl.price - lot.price) * m * pv * st.cur.dir;
        st.cur.xQ += m; st.cur.xN += m * fl.price; st.cur.fees += feePerC * m;
        st.cur.exitTime = fl.time;
        lot.qty -= m; remaining -= m;
        if (lot.qty <= 0) st.lots.shift();
      }
      if (!st.lots.length) { finalize(st.cur); st.cur = null; if (remaining > 0) open(remaining); }
    });
    const openCount = [...state.values()].filter(s => s.cur).length;
    const warnings = [];
    if (skipped) warnings.push(`${skipped} row(s) skipped (not filled or incomplete).`);
    if (openCount) warnings.push(`${openCount} position(s) still open at the end of the file were not imported yet — they will import once the closing fill is in a later file.`);
    if (unknownRoots.size) warnings.push(`Unknown point value for ${[...unknownRoots].join(', ')} — P&L assumed $1/point. Set it in Settings → Point values, then re-import.`);
    return { format: 'Fills / Orders (FIFO matched)', trades, warnings };
  }

  function parse(text, opts = {}) {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error('The file has no data rows.');
    // Some exports have a title row before the header — find the first row with 3+ non-empty cells.
    let h = 0;
    while (h < rows.length - 1 && rows[h].filter(c => c.trim()).length < 3) h++;
    const headers = rows[h].map(x => x.trim());
    const body = rows.slice(h + 1);
    const f = finder(headers);
    const has = a => f(a) >= 0;

    if (has(['tradenumber', 'trade#']) && has(['type']) && has(['price']))
      return uniquify(fromTradingView(headers, body));
    if (has(['buyPrice']) && has(['sellPrice']) && has(['boughtTimestamp']) && has(['soldTimestamp']))

    if (has(['pnl', 'p&l', 'netpnl', 'net p&l', 'profit', 'profitloss', 'profit/loss', 'realizedpnl', 'grosspnl', 'gross p&l', 'result']))

  function uniquify(result) {

/* All performance math lives here. Net P&L = gross − fees. */
const M = (() => {
  function fees(t) {
    if (t.fees != null && isFinite(t.fees)) return t.fees;
    const s = Store.data.settings;
    const c = s.commissions[t.root];
    const per = (c !== undefined && c !== '' && c !== null) ? +c : (+s.defaultCommission || 0);
    return per * t.qty;
  }
  const net = t => t.gross - fees(t);
  const holdSec = t => U.secondsBetween(t.entryTime, t.exitTime);
  const byTime = (a, b) => (a.exitTime < b.exitTime ? -1 : a.exitTime > b.exitTime ? 1 : (a.entryTime < b.entryTime ? -1 : 1));

  function groupBy(trades, keyFn) {
    const map = new Map();
    trades.forEach(t => {
      const k = keyFn(t);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(t);
    });
    return map;
  }

  /* Day buckets keyed by the trade's entry date. Returns ascending array. */
  function days(trades) {
    const map = groupBy(trades, t => U.dayKey(t.entryTime));
    return [...map.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([key, list]) => {
      list.sort(byTime);
      let n = 0, g = 0, f = 0, w = 0, l = 0, vol = 0, gw = 0, gl = 0;
      list.forEach(t => {
        const v = net(t); n += v; g += t.gross; f += fees(t); vol += t.qty;
        if (v > 0) { w++; gw += v; } else if (v < 0) { l++; gl += -v; }
      });
      return { key, trades: list, net: n, gross: g, fees: f, wins: w, losses: l, volume: vol, gw, gl,
        winRate: w + l ? w / (w + l) : 0, pf: gl ? gw / gl : (gw ? Infinity : 0) };
    });
  }

  function summarize(trades) {
    const list = [...trades].sort(byTime);
    let total = 0, gw = 0, gl = 0, wins = 0, losses = 0, be = 0, feeSum = 0, grossSum = 0, vol = 0, hold = 0;
    let largestWin = 0, largestLoss = 0, eq = 0, peak = 0, maxDD = 0, cw = 0, cl = 0, maxCW = 0, maxCL = 0;
    let winHold = 0, lossHold = 0;
    list.forEach(t => {
      const v = net(t), f = fees(t);
      total += v; feeSum += f; grossSum += t.gross; vol += t.qty; const hs = holdSec(t); hold += hs;
      if (v > 0) { wins++; gw += v; largestWin = Math.max(largestWin, v); cw++; cl = 0; winHold += hs; }
      else if (v < 0) { losses++; gl += -v; largestLoss = Math.min(largestLoss, v); cl++; cw = 0; lossHold += hs; }
      else { be++; }
      maxCW = Math.max(maxCW, cw); maxCL = Math.max(maxCL, cl);
      eq += v; peak = Math.max(peak, eq); maxDD = Math.min(maxDD, eq - peak);
    });
    const d = days(list);
    const winDays = d.filter(x => x.net > 0).length, lossDays = d.filter(x => x.net < 0).length;
    const bestDay = d.reduce((a, x) => Math.max(a, x.net), 0);
    const worstDay = d.reduce((a, x) => Math.min(a, x.net), 0);
    const count = list.length;
    const winRate = wins + losses ? wins / (wins + losses) : 0;
    const avgWin = wins ? gw / wins : 0, avgLoss = losses ? gl / losses : 0;
    const ratio = avgLoss ? avgWin / avgLoss : (avgWin ? Infinity : 0);
    const pf = gl ? gw / gl : (gw ? Infinity : 0);
    const expectancy = winRate * avgWin - (1 - winRate) * avgLoss;
    const recovery = maxDD < 0 ? total / -maxDD : (total > 0 ? Infinity : 0);
    // Consistency: how much of total profit came from the best day (prop-firm style). 100 = evenly spread.
    const consistency = total > 0 && bestDay > 0 ? Math.max(0, Math.min(1, 1 - (bestDay / total - 0.2) / 0.8)) : 0;
    let dayDD = 0, deq = 0, dpeak = 0;
    d.forEach(x => { deq += x.net; dpeak = Math.max(dpeak, deq); dayDD = Math.min(dayDD, deq - dpeak); });

    return {
      count, total, gross: grossSum, fees: feeSum, gw, gl, wins, losses, be, winRate, avgWin, avgLoss, ratio, pf,
      expectancy, avgTrade: count ? total / count : 0, largestWin, largestLoss, maxDD, recovery, peak,
      maxConsecWins: maxCW, maxConsecLosses: maxCL, volume: vol, avgHold: count ? hold / count : NaN,
      avgWinHold: wins ? winHold / wins : NaN, avgLossHold: losses ? lossHold / losses : NaN,
      days: d, dayCount: d.length, winDays, lossDays, beDays: d.length - winDays - lossDays,
      dayWinRate: winDays + lossDays ? winDays / (winDays + lossDays) : 0,
      avgDay: d.length ? total / d.length : 0, bestDay, worstDay, consistency,
      avgDailyVolume: d.length ? vol / d.length : 0, maxDailyDD: dayDD,
      bestDayShare: total > 0 ? bestDay / total : NaN,
    };
  }

  /* Composite 0–100 score shown on the dashboard radar. */
  function score(s) {
    const cap = (v, max) => Math.max(0, Math.min(100, (isFinite(v) ? v : max) / max * 100));
    const parts = {
      'Win %': cap(s.winRate, 0.6),
      'Profit factor': cap(s.pf, 2.5),
      'Avg win/loss': cap(s.ratio, 2.5),
      'Recovery factor': cap(s.recovery, 3.5),
      'Max drawdown': s.peak > 0 ? Math.max(0, 100 - (-s.maxDD / s.peak) * 100) : 0,
      'Consistency': s.consistency * 100,
    };
    if (!s.count) Object.keys(parts).forEach(k => parts[k] = 0);
    const weights = { 'Win %': .15, 'Profit factor': .25, 'Avg win/loss': .2, 'Recovery factor': .1, 'Max drawdown': .2, 'Consistency': .1 };
    const total = Object.keys(parts).reduce((a, k) => a + parts[k] * weights[k], 0);
    return { parts, total };
  }

  /* Cumulative series by day. */
  function cumulative(dayList) {
    let c = 0, peak = 0;
    return dayList.map(d => { c += d.net; peak = Math.max(peak, c); return { key: d.key, cum: c, dd: c - peak, net: d.net }; });
  }

  return { fees, net, holdSec, days, summarize, score, cumulative, groupBy, byTime };
})();

  <script>
/* Runs: group several accounts (eval → funded → …) into one continuous progression.
   A run = ordered stages; each stage is one account with a type (Eval / Funded / Live)
   and a date window. Dates default to the account's first/last trade. */
const Runs = (() => {
  const PALETTE = ['#4F6BED', '#F59E0B', '#8B5CF6', '#06B6D4', '#EC4899', '#14B8A6', '#F97316', '#64748B'];
  const TYPES = ['Eval', 'Funded', 'Live'];
  const RESULTS = { '': 'In progress', passed: 'Passed', blown: 'Blown', payout: 'Paid out', closed: 'Closed' };

  const all = () => (Store.data.runs = Array.isArray(Store.data.runs) ? Store.data.runs : []);
  const get = id => all().find(r => r.id === id);
  const nextColor = () => {
    const used = new Set(all().map(r => r.color));
    return PALETTE.find(c => !used.has(c)) || PALETTE[all().length % PALETTE.length];
  };

  function accountRange(account) {
    let first = null, last = null;
    Store.data.trades.forEach(t => {
      if (t.account !== account) return;
      const k = U.dayKey(t.entryTime);
      if (!first || k < first) first = k;
      if (!last || k > last) last = k;
    });
    return { first, last };
  }

  /* Resolved date window for every stage of a run. */
  function stagesOf(run) {
    const today = U.todayKey();
    return run.stages.map((s, i) => {
      const r = accountRange(s.account);
      const from = s.start || r.first;
      let to = s.end || r.last;
      const isLast = i === run.stages.length - 1;
      if (isLast && run.status === 'active' && !s.end && from) to = today > (to || '') ? today : to;
      return { ...s, index: i, from, to: to || from };
    }).filter(s => s.from);
  }
  /* Same windows, but each stage's line runs up to the day before the next stage starts,
     so the progression on the calendar is continuous (no gap between passing and funded). */
  function displayStages(run) {
    const st = stagesOf(run);
    return st.map((s, i) => {
      const next = st[i + 1];
      let dispTo = s.to;
      if (next && next.from > s.to) dispTo = U.addDays(next.from, -1);
      return { ...s, dispTo };
    });
  }

  function span(run) {
    const st = stagesOf(run);
    if (!st.length) return null;
    return { from: st[0].from, to: st.reduce((a, s) => (s.to > a ? s.to : a), st[0].to) };
  }

  /* Trades belonging to a run: each stage's account inside that stage's window. */
  function tradesOf(run) {
    const st = stagesOf(run);
    return Store.data.trades.filter(t => {
      const k = U.dayKey(t.entryTime);
      return st.some(s => s.account === t.account && k >= s.from && k <= s.to);
    }).map(t => {
      const k = U.dayKey(t.entryTime);
      const s = st.find(x => x.account === t.account && k >= x.from && k <= x.to);
      return Object.assign(Object.create(t), { _stage: s.index });
    });
  }

  /* What runs are visible on a given day (for the calendar). */
  function onDay(key, visibleAccounts) {
    const out = [];
    all().forEach(run => {
      if (visibleAccounts && !run.stages.some(s => visibleAccounts.has(s.account))) return;
      const st = displayStages(run);
      const s = st.find(x => key >= x.from && key <= x.dispTo);
      if (!s) return;
      const sp = span(run);
      out.push({
        run, stage: s,
        runStart: key === sp.from, runEnd: key === sp.to,
        stageStart: key === s.from && s.index > 0,
        stageEnd: key === s.dispTo,
        payout: (run.payouts || []).find(p => p.date === key),
      });
    });
    return out;
  }

  function summary(run) {
    const trades = tradesOf(run);
    const s = M.summarize(trades);
    const st = stagesOf(run);
    const byStage = st.map(x => {
      const ts = trades.filter(t => t._stage === x.index);
      return { ...x, net: ts.reduce((a, t) => a + M.net(t), 0), trades: ts.length, days: new Set(ts.map(t => U.dayKey(t.entryTime))).size };
    });
    const sp = span(run);
    const payouts = (run.payouts || []).reduce((a, p) => a + (+p.amount || 0), 0);
    return { s, trades, stages: byStage, span: sp, calendarDays: sp ? Math.round((U.toLocal(sp.to) - U.toLocal(sp.from)) / 864e5) + 1 : 0, payouts };
  }

  function statusLabel(run) {
    const last = run.stages[run.stages.length - 1];
    if (run.status === 'blown') return { text: 'Blown', cls: 'r' };
    if (run.status === 'closed') return { text: 'Closed', cls: 'b' };
    if (!last) return { text: 'Empty', cls: 'b' };
    return { text: `${last.type} · active`, cls: last.type === 'Eval' ? 'b' : 'g' };
  }

  /* ---------- mutations ---------- */
  function create({ name, account, type = 'Eval', start = '' }) {
    const run = { id: 'run_' + U.uid(), name: name || `Run ${all().length + 1}`, color: nextColor(), status: 'active',
      stages: [{ id: 's_' + U.uid(), account, type, start, end: '', result: '' }], payouts: [], createdAt: U.isoOf(new Date()) };
    all().push(run); Store.save(); return run;
  }
  /* "I'm funded": close the current stage as passed, open the next one. */
  function promote(runId, { account, type = 'Funded', passDate, start = '' }) {
    const run = get(runId); if (!run) return;
    const cur = run.stages[run.stages.length - 1];
    if (cur) {
      cur.result = 'passed';
      if (!cur.end) cur.end = passDate || accountRange(cur.account).last || U.todayKey();
    }
    run.stages.push({ id: 's_' + U.uid(), account, type, start, end: '', result: '' });
    run.status = 'active';
    Store.save();
  }
  function setStatus(runId, status) {
    const run = get(runId); if (!run) return;
    run.status = status;
    const cur = run.stages[run.stages.length - 1];
    if (cur && status !== 'active') {
      cur.result = status === 'blown' ? 'blown' : cur.result || 'closed';
      if (!cur.end) cur.end = accountRange(cur.account).last || U.todayKey();
    }
    if (cur && status === 'active' && cur.result !== 'passed') { cur.result = ''; }
    Store.save();
  }
  function update(runId, patch) { const r = get(runId); if (r) { Object.assign(r, patch); Store.save(); } }
  function remove(runId) { Store.data.runs = all().filter(r => r.id !== runId); Store.save(); }
  function addPayout(runId, date, amount) {
    const r = get(runId); if (!r) return;
    (r.payouts = r.payouts || []).push({ id: 'p_' + U.uid(), date, amount: +amount || 0 });
    r.payouts.sort((a, b) => (a.date < b.date ? -1 : 1)); Store.save();
  }
  function removePayout(runId, pid) { const r = get(runId); if (r) { r.payouts = (r.payouts || []).filter(p => p.id !== pid); Store.save(); } }

  /* Accounts not used in any run yet (for suggestions). */
  function unassigned() {
    const used = new Set(all().flatMap(r => r.stages.map(s => s.account)));
    return Store.accounts().filter(a => !used.has(a));
  }

  return { PALETTE, TYPES, RESULTS, all, get, stagesOf, span, tradesOf, onDay, summary, statusLabel,
    create, promote, setStatus, update, remove, addPayout, removePayout, unassigned, accountRange };
})();
