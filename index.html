      const ds = this.all().map(e => e.date).sort(); from = ds[0] || today; to = ds.length && ds[ds.length - 1] > today ? ds[ds.length - 1] : today; label = 'All Time Performance';
    } else if (type === 'custom') {
      from = p.from || `${y}-01-01`; to = p.to || today; if (from > to) [from, to] = [to, from];
      label = `Custom: ${U.fmtDate(from)} to ${U.fmtDate(to)}`;
    } else { from = `${y}-01-01`; to = today; label = 'Year to Date Performance'; }
    const months = [];
    for (let d = U.toLocal(from.slice(0, 7) + '-01'); U.keyOf(d).slice(0, 7) <= to.slice(0, 7); d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) months.push(U.keyOf(d).slice(0, 7));
    const key = type === 'ytd' ? y : `${type}:${from}_${to}`;
    return { type, from, to, label, months, key, month, multiYear: from.slice(0, 4) !== to.slice(0, 4) };
  },
  setPeriod(patch) { const v = this.view(); Store.data.settings.ledgerView = Object.assign(Store.data.settings.ledgerView || {}, { period: Object.assign({}, (Store.data.settings.ledgerView || {}).period, patch) }); this.firm = null; this.showAll = false; Store.save(); App.render(); },
  mLabel(m, multi) { return U.MONTHS[+m.slice(5, 7) - 1].slice(0, 3) + (multi ? ` '${m.slice(2, 4)}` : ''); },

  /* ---------- categories & look ---------- */
  KINDS: { payout: 'Payouts', fee: 'Prop Firm Fees', tool: 'Tools & Data', live: 'Live Account', other: 'Other Income' },
  TOOL_RX: /tradingview|ninjatrader|tradovate|rithmic|sierra|bookmap|quantower|motivewave|edgeful|tradezella|tradesyncer|discord|\bdata\b|course|mentor/i,
  LOOK: { payout: '#12A06A', fee: '#E5484D', tool: '#F59E0B', live: '#8B5CF6', other: '#06B6D4', line: '#1F2E86', forecast: '#9AA1BA', dots: true, showForecast: true },
  hidden: new Set(),
  view() { const v = Store.data.settings.ledgerView || {}; return { showLive: v.showLive !== false, excluded: Array.isArray(v.excluded) ? v.excluded : [] }; },
  setView(patch) { Store.data.settings.ledgerView = Object.assign(this.view(), patch); Store.save(); App.render(); },
  look() { return Object.assign({}, this.LOOK, Store.data.settings.ledgerLook || {}); },
  isTool(firm) { const o = Store.data.settings.ledgerTools || {}; return firm in o ? !!o[firm] : this.TOOL_RX.test(firm); },
  kind(e) {
    if (e.type === 'Expense') return e.sub === 'data' ? 'tool' : e.sub && e.sub !== 'other' ? 'fee' : this.isTool(e.firm) ? 'tool' : 'fee';
    return e.type === 'Passed' ? 'pass' : e.type === 'Payout' ? 'payout' : e.type === 'Live P&L' ? 'live' : 'other';
  },
  subLabel(e) { if (e.type !== 'Expense' || !e.sub) return ''; if (e.sub === 'other') return e.subText || 'Other'; const s = this.SUBS.find(x => x[0] === e.sub); return s ? s[1] : ''; },

  /* What a prop-firm expense bought: an evaluation (packs count as several), a reset, an activation, an instant-funded account, or something else. */
  buy(e) {
    if (this.kind(e) !== 'fee') return null;
    const d = `${e.sub || ''} ${e.description || ''}`;
    const pack = d.match(/pack\s*(?:of\s*)?(\d+)/i);
    if (e.sub === 'eval' || e.sub === 'instant') return { kind: e.sub, n: +e.qty || (pack ? +pack[1] : 1) };
    if (e.sub) return { kind: e.sub, n: 1 };
    if (/reset/i.test(d)) return { kind: 'reset', n: 1 };
    if (/activation fee|^\s*activation\s*$/i.test(d)) return { kind: 'activation', n: 1 };
    if (/level ?up|upgrade/i.test(d)) return { kind: 'other', n: 1 };
    if (/instant/i.test(d)) return { kind: 'instant', n: pack ? +pack[1] : 1 };
    return { kind: 'eval', n: pack ? +pack[1] : 1 };
  },

  render(el) {
    const thisYear = String(new Date().getFullYear());
    this.year = thisYear;
    const P = this.per = this.period();
    const yearRows = this.all().filter(e => e.date >= P.from && e.date <= P.to);
    const V = this.view();
    const excl = new Set(V.excluded);
    const real = yearRows.filter(e => !excl.has(e.firm) && (V.showLive || this.kind(e) !== 'live'));
    const rows = this.sim ? real.map(e => ({ ...e, amount: Math.round(e.amount * this.sim * 100) / 100 })) : real;
    const hasLive = yearRows.some(e => this.kind(e) === 'live');
    const firmList = [...new Set(yearRows.filter(e => this.kind(e) !== 'live').map(e => e.firm))].sort();
    const offParts = [...(hasLive && !V.showLive ? ['live account'] : []), ...V.excluded.filter(f => firmList.includes(f))];

    if (!this.all().length) {
      el.innerHTML = `<div class="card"><div class="empty">
        <h3>See what you really take home</h3>
        <div style="max-width:540px;margin:0 auto">Log every eval, reset and data fee, and every payout. Your Ledger adds it all up: what you spent, what you got back, and what's actually left.</div>
        <div class="actions"><button class="btn primary" data-add>+ Add an entry</button><label class="btn">Import a file (.json or .csv)<input type="file" accept=".json,.csv" data-import hidden></label></div>
        <div class="help" style="margin-top:14px">CSV columns: <code>date, firm, type, description, amount</code> — type is Expense, Payout or Live P&amp;L.</div>
      </div></div>`;
      return this.bind(el);
    }

    const L = this.look();
    const s = this.sum(rows);
    const isYTD = P.type === 'ytd';
    const fc = isYTD ? this.forecast(rows) : null;
    const eq = [
      `<span class="pos">${U.money(s.paid)}</span> in Prop Firm Payouts`,
      `<span class="neg">${U.money(s.fees)}</span> Prop Firm Expenses`,
      s.tools ? `<span class="neg">${U.money(s.tools)}</span> Tools &amp; Data` : '',
      s.kinds.live ? `<span class="${U.cls(s.liveOnly)}">${U.money(s.liveOnly)}</span> Live Account` : '',
      s.kinds.other ? `<span class="${U.cls(s.otherOnly)}">${U.money(s.otherOnly)}</span> Other` : '',
    ].filter(Boolean);

    el.innerHTML = `
      <div class="lg-head">
        <div>
          <div class="lg-eyebrow">${U.esc(P.label)}${offParts.length ? ` <span class="lg-excl">· without ${U.esc(offParts.join(', '))}</span>` : ''}</div>
          <div class="lg-big ${U.cls(s.net)}">${U.money(s.net)}</div>
          <div class="lg-eq">${eq.join('<span class="op">·</span>')}</div>
        </div>
        <div class="lg-actions">
          <button class="btn ${this.sim ? 'sim-on' : ''}" data-sim>${this.sim ? 'Exit Simulation' : 'Simulate'}</button>
          <label class="btn">Import<input type="file" accept=".json,.csv" data-import hidden></label>
          <button class="btn primary" data-add>+ Add entry</button>
        </div>
      </div>
      ${this.sim ? `<div class="lg-sim">
        <div class="lg-sim-top"><b>Simulation</b><span>Every entry × ${this.sim}, as if you traded ${this.sim}× the size. Your real data is untouched.</span>
          <div class="seg sm" data-simx>${[2, 5, 10].map(x => `<button type="button" data-x="${x}" class="${this.sim === x ? 'on' : ''}">×${x}</button>`).join('')}</div></div>
        <div class="lg-sim-kpis">
          <div><span>Real Take-Home</span><b class="${U.cls(this.sum(real).net)}">${U.money(this.sum(real).net)}</b></div>
          <div><span>At ×${this.sim}</span><b class="${U.cls(s.net)}">${U.money(s.net)}</b></div>
          <div><span>If 50% Held Up</span><b class="${U.cls(s.net)}">${U.money(s.net * .5)}</b></div>
          <div><span>If 40% Held Up</span><b class="${U.cls(s.net)}">${U.money(s.net * .4)}</b></div>
        </div>
      </div>` : ''}

      <div class="lg-period">
        <div class="seg sm" data-period>${this.PERIODS.map(([k, t]) => `<button type="button" data-p="${k}" class="${P.type === k ? 'on' : ''}">${t}</button>`).join('')}</div>
        ${P.type === 'month' ? `<input class="inp sm" type="month" data-pmonth value="${P.month}">` : ''}
        ${P.type === 'custom' ? `<span class="lg-range"><input class="inp sm" type="date" data-pfrom value="${P.from}"><span class="help">to</span><input class="inp sm" type="date" data-pto value="${P.to}"></span>` : ''}
      </div>

      <div class="lg-filter">
        ${hasLive ? `<button class="lg-switch ${V.showLive ? 'on' : ''}" data-live><span class="knob"></span>Show live</button><span class="lg-sep"></span>` : ''}
        <span class="help">Firms</span>
        ${firmList.map(f => `<button class="lg-chip ${excl.has(f) ? 'off' : ''}" data-ex="${U.esc(f)}" title="${excl.has(f) ? 'Include' : 'Exclude'} ${U.esc(f)}">${excl.has(f) ? '' : '✓ '}${U.esc(f)}</button>`).join('')}
        ${offParts.length ? `<button class="btn sm ghost" data-reset>Show everything</button>` : ''}
      </div>

      <div class="lg-stats">
        <div><div class="k">Return on Prop Firms</div><div class="v ${U.cls(s.roi)}">${s.fees ? (s.roi > 0 ? '+' : '') + (s.roi * 100).toFixed(0) + '%' : '—'}</div><div class="sub">${s.fees ? `Every $1 Spent Came Back as $${s.per1.toFixed(2)}` : 'No Prop Firm Fees Yet'}</div></div>
        <div><div class="k">Prop Firm Expenses</div><div class="v">${U.money(s.fees)}</div><div class="sub">${s.feeCount} Evals, Resets &amp; Activations</div></div>
        <div><div class="k">Paid Out</div><div class="v pos">${U.money(s.paid)}</div><div class="sub">${s.payCount} Payout${s.payCount === 1 ? '' : 's'}${s.payCount ? ` · Avg ${U.moneyShort(s.paid / s.payCount)}` : ''}</div></div>
        <div><div class="k">Tools &amp; Data</div><div class="v">${U.money(s.tools)}</div><div class="sub">${s.toolCount} Charge${s.toolCount === 1 ? '' : 's'}</div></div>
      </div>

      ${isYTD ? this.goalCard(s, isYTD) : ''}

      <div class="card lg-chart-card">
        <div class="card-body">
          <div class="chart-top">
            <div class="mini-legend lg-legend">
              <span class="static"><i style="background:${L.line}"></i>Take-Home</span>
              ${Object.keys(this.KINDS).filter(k => s.kinds[k]).map(k => `<button type="button" data-kind="${k}" class="${this.hidden.has(k) ? 'off' : ''}"><i class="dot" style="background:${L[k]}"></i>${this.KINDS[k]}</button>`).join('')}
              ${fc && L.showForecast ? `<span class="static"><i class="dash" style="--c:${L.forecast}"></i>Forecast</span>` : ''}
            </div>
            <button class="btn sm ghost" data-look style="margin-left:auto">🎨 Customize</button>
          </div>
          <div class="chart-box lg"><canvas id="lgChart"></canvas></div>
        </div>
      </div>

      ${fc && L.showForecast ? `<div class="card lg-fc-card"><div class="card-body">
        <div class="lg-fc-top">
          <div>
            <div class="lg-eyebrow">Year-End Forecast</div>
            <div class="lg-fc-big ${U.cls(fc.end)}">${U.money(fc.end)}</div>
            <div class="help">Middle of ${fc.sims.toLocaleString()} Simulations</div>
          </div>
          <div class="seg sm" data-pace><button class="${this.pace === 'year' ? 'on' : ''}" data-p="year">Whole Year</button><button class="${this.pace === '90' ? 'on' : ''}" data-p="90">Last 90 Days</button></div>
        </div>
        <div class="lg-fc-facts">
          <div><div class="k">8 in 10 Ended Between</div><div class="v">${U.moneyShort(fc.lo)} – ${U.moneyShort(fc.hi)}</div></div>
          <div><div class="k">Half Ended Between</div><div class="v">${U.moneyShort(fc.p25)} – ${U.moneyShort(fc.p75)}</div></div>
          <div><div class="k">Ended Below Today</div><div class="v ${fc.worse > .3 ? 'neg' : ''}">${Math.round(fc.worse * 100)}%</div></div>
          <div><div class="k">Ended in the Red</div><div class="v ${fc.negative > .1 ? 'neg' : ''}">${Math.round(fc.negative * 100)}%</div></div>
        </div>
        <div class="lg-disclaimer">⚠ A simulation, not a promise. Past results don't predict future performance, payouts are never guaranteed, and most traders lose money. Not financial advice.</div>
      </div></div>` : ''}

      ${this.processHTML(rows)}

      <div class="grid g-2">
        <div class="card">
          <div class="card-head"><h3>By firm</h3>${this.firm ? `<button class="btn sm ghost right" data-clear>Show all</button>` : '<span class="help right">Tap a firm to filter</span>'}</div>
          <div class="table-wrap"><table class="tbl lg-tbl"><thead><tr><th>Firm</th><th class="num">Spent</th><th class="num">Got back</th><th class="num">Net</th><th class="num">Return</th></tr></thead><tbody>
            ${s.firms.map(f => `<tr class="clickable ${this.firm === f.firm ? 'sel' : ''}" data-firm="${U.esc(f.firm)}">
              <td><b>${U.esc(f.firm)}</b> ${f.spent ? `<button class="lg-kind ${f.tool ? 'tool' : ''}" data-tool="${U.esc(f.firm)}" title="Tap to switch between prop firm and tool">${f.tool ? 'tool' : 'prop firm'}</button>` : ''}</td>
              <td class="num">${f.spent ? U.money(f.spent) : '—'}</td><td class="num ${f.in ? U.cls(f.in) : ''}">${f.in ? U.money(f.in) : '—'}</td>
              <td class="num ${U.cls(f.net)}"><b>${U.money(f.net)}</b></td>
              <td class="num ${U.cls(f.net)}">${f.spent && !f.tool ? ((f.net / f.spent) * 100).toFixed(0) + '%' : '—'}</td></tr>`).join('')}
          </tbody></table></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>${P.months.length === 1 ? 'By week' : 'By month'}</h3></div>
          <div class="card-body"><div class="chart-box sm"><canvas id="lgMonths"></canvas></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>${this.firm ? U.esc(this.firm) : 'All entries'}</h3><span class="help">${this.list(rows).length} total</span>
          <div class="right"><button class="btn sm ghost" data-export>Export CSV</button></div></div>
        <div class="table-wrap"><table class="tbl"><tbody>${this.entryRows(rows)}</tbody></table></div>
        ${this.list(rows).length > 12 && !this.showAll ? `<div class="card-body" style="text-align:center"><button class="btn sm" data-more>Show all ${this.list(rows).length}</button></div>` : ''}
      </div>`;

    this.chart(U.$('#lgChart', el), rows, fc);
    this.monthChart(U.$('#lgMonths', el), rows);
    this.processCharts(el, rows);
    this.bind(el);
  },

  list(rows) { return rows.filter(e => !this.firm || e.firm === this.firm).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)); },

  entryRows(rows) {
    const L = this.look();
    const list = this.list(rows);
    const shown = this.showAll ? list : list.slice(0, 12);
    return shown.map(e => { const k = this.kind(e);
      if (k === 'pass') return `<tr class="clickable" data-edit="${e.id}"><td class="help" style="width:84px">${U.fmtShort(e.date)}</td>
        <td><i class="lg-dot" style="background:${L.line}"></i><b>${U.esc(e.firm)}</b> <span class="help">${U.esc(e.description || 'Passed evaluation')}</span></td>
        <td class="help">Passed eval</td><td class="num"><b>${(+e.qty || 1) > 1 ? '×' + e.qty : '✓'}</b></td></tr>`;
      return `<tr class="clickable" data-edit="${e.id}">
      <td class="help" style="width:84px">${U.fmtShort(e.date)}</td>
      <td><i class="lg-dot" style="background:${L[k]}"></i><b>${U.esc(e.firm)}</b> <span class="help">${U.esc(e.description || '')}</span></td>
      <td class="help">${U.esc(this.subLabel(e)) || this.KINDS[k].replace(/s$/, '')}</td>
      <td class="num ${U.cls(e.amount)}">${e.first ? '<span class="lg-first" title="First payout from this account">1st</span> ' : ''}<b>${U.money(e.amount)}</b></td></tr>`; }).join('') || '<tr class="empty-row"><td>No entries</td></tr>';
  },

  sum(rows) {
    let fees = 0, tools = 0, paid = 0, live = 0, other = 0, feeCount = 0, toolCount = 0, payCount = 0;
    const kinds = {}, by = new Map();
    rows.forEach(e => {
      const k = this.kind(e); if (k === 'pass') return; kinds[k] = (kinds[k] || 0) + 1;
      const f = by.get(e.firm) || { firm: e.firm, spent: 0, in: 0, net: 0, tool: this.isTool(e.firm) };
      if (k === 'fee') { fees += -e.amount; feeCount++; f.spent += -e.amount; }
      else if (k === 'tool') { tools += -e.amount; toolCount++; f.spent += -e.amount; }
      else if (k === 'payout') { paid += e.amount; payCount++; f.in += e.amount; }
      else if (k === 'live') { live += e.amount; f.in += e.amount; }
      else { other += e.amount; f.in += e.amount; }
      f.net += e.amount; by.set(e.firm, f);
    });
    const firms = [...by.values()].sort((a, b) => b.net - a.net);
    const net = paid + live + other - fees - tools;
    return { fees, tools, paid, live: live + other, liveOnly: live, otherOnly: other, net, feeCount, toolCount, payCount, firms, kinds,
      roi: fees ? (paid - fees) / fees : 0, per1: fees ? paid / fees : 0 };
  },

  /* Monte Carlo forecast: replay the rest of the year 2,000 times by drawing random days
     from your own history (with replacement), then read the spread of outcomes. */
  SIMS: 2000,
  forecast(rows) {
    const today = U.todayKey(), y = this.year;
    const start = `${y}-01-01`, end = `${y}-12-31`;
    const dayN = k => Math.round((U.toLocal(k) - U.toLocal(start)) / 864e5);
    const net = rows.filter(e => e.date <= today).reduce((a, e) => a + e.amount, 0);
    const todayN = dayN(today), endN = dayN(end), left = Math.max(0, endN - todayN);
    const from = this.pace === '90' ? U.addDays(today, -89) : start;
    const byDay = new Map();
    rows.forEach(e => { if (e.date >= from && e.date <= today) byDay.set(e.date, (byDay.get(e.date) || 0) + e.amount); });
    const pool = [];
    for (let k = from; k <= today; k = U.addDays(k, 1)) pool.push(byDay.get(k) || 0);
    if (!pool.length || !left) return null;
    // seeded RNG so the forecast doesn't jump around on every refresh
    let seed = 0; const sig = pool.join(','); for (let i = 0; i < sig.length; i++) seed = (seed * 31 + sig.charCodeAt(i)) >>> 0;
    seed = seed || 1;
    const rnd = () => { seed ^= seed << 13; seed >>>= 0; seed ^= seed >> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; };
    const N = this.SIMS, step = Math.max(1, Math.round(left / 40));
    const checkpoints = []; for (let d = step; d < left; d += step) checkpoints.push(d); checkpoints.push(left);
    const at = checkpoints.map(() => new Float64Array(N));
    const finals = new Float64Array(N);
    for (let s = 0; s < N; s++) {
      let v = net, c = 0;
      for (let d = 1; d <= left; d++) {
        v += pool[(rnd() * pool.length) | 0];
        if (d === checkpoints[c]) { at[c][s] = v; c++; }
      }
      finals[s] = v;
    }
    const pct = (arr, q) => { const a = Float64Array.from(arr).sort(); return a[Math.min(a.length - 1, Math.floor(q * (a.length - 1)))]; };
    const path = checkpoints.map((d, i) => ({ x: todayN + d, p10: pct(at[i], .1), p25: pct(at[i], .25), p50: pct(at[i], .5), p75: pct(at[i], .75), p90: pct(at[i], .9) }));
    let below = 0, neg = 0; finals.forEach(v => { if (v < net) below++; if (v < 0) neg++; });
    return { net, today, todayN, endN, left, sims: N, days: pool.length,
      end: pct(finals, .5), lo: pct(finals, .1), hi: pct(finals, .9), p25: pct(finals, .25), p75: pct(finals, .75),
      worse: below / N, negative: neg / N, path };
  },

  chart(cv, rows, fc) {
    if (!cv) return;
    const L = this.look();
    const P = this.per || this.period(), start = P.from;
    const dayN = k => Math.round((U.toLocal(k) - U.toLocal(start)) / 864e5);
    const sorted = rows.filter(e => this.kind(e) !== 'pass').sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    let cum = 0, lastDay = null, k = 0;
    const pts = sorted.map(e => {
      k = e.date === lastDay ? k + 1 : 0; lastDay = e.date;
      cum += e.amount;
      return { x: dayN(e.date) + Math.min(.8, k * .12), y: +cum.toFixed(2), e, kind: this.kind(e) };
    });
    const lastN = fc ? fc.endN : Math.max(dayN(P.to) + 1, pts.length ? Math.ceil(pts[pts.length - 1].x) + 1 : 1);
    const datasets = [{ label: 'Take-home', data: [{ x: 0, y: 0 }, ...pts.map(p => ({ x: p.x, y: p.y }))], borderColor: L.line, backgroundColor: L.line + '12',
      fill: 'origin', borderWidth: 2.2, stepped: 'after', pointRadius: 0, pointHoverRadius: 0, order: 3 }];
    if (L.dots) Object.keys(this.KINDS).forEach(kd => {
      if (this.hidden.has(kd)) return;
      const d = pts.filter(p => p.kind === kd);
      if (d.length) datasets.push({ label: this.KINDS[kd], _kind: kd, type: 'scatter', data: d, pointRadius: 4.5, pointHoverRadius: 7, pointBackgroundColor: L[kd],
        pointBorderColor: '#fff', pointBorderWidth: 1.5, order: 1 });
    });
    if (fc && L.showForecast) {
      const a = { x: fc.todayN, y: +fc.net.toFixed(2) };
      const ln = q => [a, ...fc.path.map(p => ({ x: p.x, y: +p[q].toFixed(2) }))];
      datasets.push({ label: '_p10', data: ln('p10'), borderColor: 'transparent', pointRadius: 0, fill: false, tension: .3, order: 5 });
      datasets.push({ label: '_p90', data: ln('p90'), borderColor: 'transparent', backgroundColor: L.forecast + '22', pointRadius: 0, fill: '-1', tension: .3, order: 5 });
      datasets.push({ label: '_p25', data: ln('p25'), borderColor: 'transparent', pointRadius: 0, fill: false, tension: .3, order: 4 });
      datasets.push({ label: '_p75', data: ln('p75'), borderColor: 'transparent', backgroundColor: L.forecast + '33', pointRadius: 0, fill: '-1', tension: .3, order: 4 });
      datasets.push({ label: 'Forecast', data: ln('p50'), borderColor: L.forecast, borderDash: [6, 5], borderWidth: 2, tension: .3,
        pointRadius: ctx => (ctx.dataIndex === fc.path.length ? 4 : 0), pointBackgroundColor: L.forecast, fill: false, order: 2 });
    }
    // short periods tick weekly with dates; longer ones tick at each month start
    const ticks = lastN <= 62
      ? Array.from({ length: Math.floor(lastN / 7) + 1 }, (_, i) => ({ v: i * 7, t: U.fmtShort(U.addDays(start, i * 7)).slice(0, 5) }))
      : P.months.map(m => ({ v: Math.max(0, dayN(m + '-01')), t: this.mLabel(m, P.multiYear) })).filter(t => t.v <= lastN);
    const monthStarts = ticks.map(t => t.v);
    Charts.make(cv, {
      type: 'line', data: { datasets },
      options: {
        parsing: true,
        interaction: { mode: 'nearest', intersect: true },
        plugins: { legend: { display: false }, tooltip: {
          filter: it => !it.dataset.label.startsWith('_') && it.dataset.label !== 'Take-home',
          callbacks: {
            title: it => { const r = it[0] && it[0].raw; return r && r.e ? U.fmtLong(r.e.date) : (it[0] && it[0].dataset.label === 'Forecast' ? 'Middle simulated outcome' : ''); },
            label: c => { const r = c.raw; if (r && r.e) return [`${r.e.firm}${r.e.description ? ' — ' + r.e.description : ''}`, `${U.money(r.e.amount)}  ·  Take-Home ${U.money(r.y)}`];
              return `${U.money(c.parsed.y)} — a simulation, not a guarantee`; },
          } } },
        scales: {
          x: { type: 'linear', min: 0, max: lastN, grid: { display: false }, border: { display: false },
            afterBuildTicks: ax => { ax.ticks = monthStarts.map(v => ({ value: v })); },
            ticks: { color: '#9AA1BA', maxRotation: 0, autoSkip: true, autoSkipPadding: 6, callback: v => { const i = monthStarts.indexOf(v); return i >= 0 ? ticks[i].t : ''; } } },
          y: { grid: { color: c => (c.tick && c.tick.value === 0 ? '#C9CEDD' : '#F1F3F8') }, border: { display: false }, ticks: { callback: v => U.moneyAxis(v), maxTicksLimit: 6, color: '#9AA1BA' } },
        },
      },
    });
  },

  monthChart(cv, rows) {
    if (!cv) return;
    if (!rows.length) { cv.parentElement.innerHTML = '<div class="no-data">Nothing to show with these filters</div>'; return; }
    const L = this.look();
    const P = this.per || this.period();
    // one month selected → split it into weeks; otherwise one bar per month
    const weekly = P.months.length === 1;
    const buckets = weekly ? [1, 8, 15, 22, 29].filter(d => d <= +P.to.slice(8, 10)).map(d => P.from.slice(0, 8) + U.pad(d)) : P.months;
    const labels = weekly ? buckets.map((b, i) => `${U.fmtShort(b).slice(0, 5)}–${U.fmtShort(i < buckets.length - 1 ? U.addDays(buckets[i + 1], -1) : P.to).slice(0, 5)}`) : P.months.map(m => this.mLabel(m, P.multiYear));
    const idx = e => weekly ? Math.min(4, Math.floor((+e.date.slice(8, 10) - 1) / 7)) : P.months.indexOf(e.date.slice(0, 7));
    const last = buckets.length;
    const order = ['payout', 'live', 'other', 'fee', 'tool'];
    const sums = Object.fromEntries(order.map(k => [k, Array(last).fill(0)]));
    rows.forEach(e => { const k = this.kind(e), i = idx(e); if (sums[k] && i >= 0 && i < last) sums[k][i] += e.amount; });
    const datasets = order.filter(k => sums[k].some(v => v) && !this.hidden.has(k)).map(k => ({ label: this.KINDS[k], data: sums[k].map(v => +v.toFixed(2)),
      backgroundColor: L[k], borderRadius: 3, maxBarThickness: 18, stack: 's' }));
    const net = Array.from({ length: last }, (_, i) => +order.reduce((a, k) => a + sums[k][i], 0).toFixed(2));
    datasets.push({ type: 'line', label: 'Net', data: net, borderColor: L.line, backgroundColor: L.line, borderWidth: 1.5, pointRadius: 3, tension: .3 });
    Charts.make(cv, {
      type: 'bar', data: { labels, datasets },
      options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${U.money(c.parsed.y)}` } } },
        scales: { x: { stacked: true, grid: { display: false }, border: { display: false }, ticks: { color: '#9AA1BA' } },
          y: { stacked: true, grid: { color: c => (c.tick && c.tick.value === 0 ? '#C9CEDD' : '#F1F3F8') }, border: { display: false }, ticks: { callback: v => U.moneyAxis(v), maxTicksLimit: 5, color: '#9AA1BA' } } } },
    });
  },

  bind(el) {
    U.$$('[data-add]', el).forEach(b => b.onclick = () => this.editModal(null));
    U.$$('[data-edit]', el).forEach(r => r.onclick = () => this.editModal(this.all().find(e => e.id === r.dataset.edit)));
    U.$$('[data-firm]', el).forEach(r => r.onclick = ev => { if (ev.target.closest('[data-tool]')) return; this.firm = this.firm === r.dataset.firm ? null : r.dataset.firm; this.showAll = false; App.render(); });

        { label: 'Remove goal', cls: 'left', onClick: c => { delete (Store.data.settings.ledgerGoals || {})[this.year]; Store.save(); c(); App.render(); } },
        { label: 'Cancel' },
        { label: 'Save', cls: 'primary', onClick: c => { const v = Math.round(+U.$('input', body).value || 0); if (!v) return; Store.data.settings.ledgerGoals = Object.assign(Store.data.settings.ledgerGoals || {}, { [this.year]: v }); Store.save(); c(); App.render(); } },

    U.$$('[data-ex]', el).forEach(b => b.onclick = () => {

  /* ---------- goal ---------- */
  goal() { return +((Store.data.settings.ledgerGoals || {})[this.year] || 0); },
  goalCard(s, isYTD) {
    const g = this.goal();
    if (!g) return `<div class="card lg-goal lg-goal-empty"><div class="card-body">
      <div><b>Set a Goal for ${this.year}</b><div class="help">How much do you want to take home this year? We'll show what's left and what you need each month.</div></div>
      <div class="lg-goal-set"><span>$</span><input class="inp" type="number" min="0" step="100" placeholder="10000" data-goal-in><button class="btn primary" data-goal-save>Set goal</button></div>
    </div></div>`;
    const y = +this.year, now = new Date();
    const start = new Date(y, 0, 1), end = new Date(y, 11, 31);
    const dayMs = 864e5;
    const elapsedDays = isYTD ? Math.max(1, Math.round((now - start) / dayMs) + 1) : 365;
    const leftDays = isYTD ? Math.max(0, Math.round((end - now) / dayMs)) : 0;
    const monthsLeft = isYTD ? Math.max(1, Math.ceil(leftDays / 30.44)) : 0;
    const still = Math.max(0, g - s.net);
    const pctv = Math.max(0, Math.min(100, s.net / g * 100));
    const avgMonth = s.net / (elapsedDays / 30.44);
    const need = monthsLeft ? still / monthsLeft : 0;
    const onTrack = still <= 0 || avgMonth >= need;
    return `<div class="card lg-goal"><div class="card-body">
      <div class="lg-goal-head">
        <div><div class="lg-eyebrow">${this.year} Goal</div><div class="lg-goal-title">${U.money(g)} Take-Home <button class="btn sm ghost" data-goal-edit>Edit</button></div></div>
        <div class="lg-goal-pct ${s.net >= g ? 'pos' : ''}">${pctv.toFixed(0)}%</div>
      </div>
      <div class="lg-track"><div style="width:${pctv}%"></div></div>
      <div class="lg-goal-meta three">
        <div><span>Needed to Complete Goal</span><b>${still ? U.money(still) : 'Goal Reached 🎉'}</b></div>
        <div><span>Needed per Month</span><b>${isYTD && still ? U.money(need) : '—'}</b></div>
        <div><span>Averaging per Month</span><b class="${U.cls(avgMonth)}">${U.money(avgMonth)}</b>${isYTD && still ? `<i class="${onTrack ? 'pos' : 'neg'}">${onTrack ? 'On Pace' : `${U.money(need - avgMonth)} Short a Month`}</i>` : ''}</div>
      </div>
    </div></div>`;
  },

  /* ---------- process metrics ---------- */
  process(rows) {
    const Per = this.per || this.period();
    const lastM = Per.months.length;
    const months = Per.months.map(() => ({ bought: 0, payouts: 0 }));
    let evals = 0, instant = 0, resets = 0, passes = 0;
    const firms = new Map();
    const F = f => firms.get(f) || (firms.set(f, { firm: f, evals: 0, instant: 0, payouts: 0 }), firms.get(f));
    rows.forEach(e => {
      const m = Per.months.indexOf(e.date.slice(0, 7)); if (m < 0) return;
      const b = this.buy(e);
      if (b) {
        if (b.kind === 'eval') { evals += b.n; months[m].bought += b.n; F(e.firm).evals += b.n; }
        else if (b.kind === 'instant') { instant += b.n; months[m].bought += b.n; F(e.firm).instant += b.n; }
        else if (b.kind === 'reset') resets++;
      }
      if (this.kind(e) === 'payout') F(e.firm).payouts++;
      if (this.kind(e) === 'pass') passes += +e.qty || 1;
      if (this.kind(e) === 'payout') months[m].payouts++;
    });
    const payouts = rows.filter(e => this.kind(e) === 'payout').sort((a, b) => (a.date < b.date ? -1 : 1));
    const flagged = payouts.filter(p => p.first).length;
    const anyFlag = payouts.some(p => p.first !== undefined);
    const funded = passes + instant;
    const gaps = payouts.slice(1).map((p, i) => Math.round((U.toLocal(p.date) - U.toLocal(payouts[i].date)) / 864e5));
    const firstM = payouts.length ? Per.months.indexOf(payouts[0].date.slice(0, 7)) + 1 : null;
    const saved = (Store.data.settings.ledgerFunnel || {})[Per.key] || {};
    const firmRows = [...firms.values()].filter(f => f.evals || f.instant || f.payouts).map(f => {
      const sv = saved[f.firm] || {};
      const passed = sv.passed === '' || sv.passed == null ? null : +sv.passed;
      const paid = sv.paid === '' || sv.paid == null ? null : +sv.paid;
      const fundedF = (passed || 0) + f.instant;
      return { ...f, passed, paid, funded: fundedF,
        passRate: passed != null && f.evals ? passed / f.evals : null,
        f2p: paid != null && fundedF ? Math.min(1, paid / fundedF) : null };
    }).sort((a, b) => (b.evals + b.instant) - (a.evals + a.instant));
    const tPassed = firmRows.some(r => r.passed != null) ? firmRows.reduce((a, r) => a + (r.passed || 0), 0) : null;
    const tPaid = firmRows.some(r => r.paid != null) ? firmRows.reduce((a, r) => a + (r.paid || 0), 0) : null;
    const tEvalsWithPass = firmRows.filter(r => r.passed != null).reduce((a, r) => a + r.evals, 0);
    const tFundedWithPaid = firmRows.filter(r => r.paid != null).reduce((a, r) => a + r.funded, 0);
    return { lastM, months, evals, instant, resets, passes, funded, payouts, flagged, anyFlag, gaps, firmRows,
      tPassed, tPaid, tFunded: (tPassed || 0) + instant,
      tPassRate: tPassed != null && tEvalsWithPass ? tPassed / tEvalsWithPass : null,
      tF2P: tPaid != null && tFundedWithPaid ? Math.min(1, firmRows.filter(r => r.paid != null).reduce((a, r) => a + r.paid, 0) / tFundedWithPaid) : null,
      bought: evals + instant,
      avgPerMonth: firstM ? payouts.length / (lastM - firstM + 1) : 0,
      avgPayout: payouts.length ? payouts.reduce((a, p) => a + p.amount, 0) / payouts.length : 0,
      evalsPerPayout: payouts.length ? (evals + instant) / payouts.length : null,
      passRate: evals && passes ? passes / evals : null,
      f2p: funded && flagged ? Math.min(1, flagged / funded) : null,
      avgGap: gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : null };
  },

    const max = Math.max(P.bought, 1);
    return `
      <div class="lg-section-title">Key Performance Indicators <span class="help">Prop Firms Only · Live Account Excluded</span></div>
      <div class="grid g-2">
        <div class="card"><div class="card-body">

          <div class="chart-box sm"><canvas id="pcYield"></canvas></div>
        </div></div>
      </div>
      <div class="grid g-2">
        <div class="card"><div class="card-body">
          <div class="lg-ch-head"><div><h3>From purchase to payout</h3><div class="help">Type how many passed and how many paid you out. The rest is automatic.</div></div></div>
          <div class="fl-steps">
            <div class="fl-step"><b>${P.bought}</b><span>accounts bought</span></div>
            <div class="fl-arrow"><b>${pct(P.tPassRate)}</b><span>pass rate</span></div>
            <div class="fl-step"><b>${P.tPassed == null && !P.instant ? '—' : P.tFunded}</b><span>got funded</span>${P.instant ? `<i>incl. ${P.instant} instant</i>` : ''}</div>
            <div class="fl-arrow"><b>${pct(P.tF2P)}</b><span>funded → payout</span></div>
            <div class="fl-step"><b>${P.tPaid == null ? '—' : P.tPaid}</b><span>paid out</span></div>
          </div>
          <div class="table-wrap"><table class="tbl fl-tbl"><thead><tr><th>Firm</th><th class="num">Bought</th><th class="num">Passed</th><th class="num">Paid out</th><th class="num">Pass rate</th><th class="num">Funded → payout</th></tr></thead><tbody>
            ${P.firmRows.map(r => `<tr>
              <td><b>${U.esc(r.firm)}</b></td>
              <td class="num">${r.evals ? r.evals : ''}${r.instant ? `<span class="help">${r.evals ? ' +' : ''}${r.instant} instant</span>` : ''}</td>
              <td class="num">${r.evals ? `<input class="fl-in" type="number" min="0" max="${r.evals}" data-fl="${U.esc(r.firm)}" data-f="passed" value="${r.passed ?? ''}" placeholder="?">` : '<span class="help">—</span>'}</td>
              <td class="num"><input class="fl-in" type="number" min="0" data-fl="${U.esc(r.firm)}" data-f="paid" value="${r.paid ?? ''}" placeholder="?"></td>
              <td class="num">${pct(r.passRate)}</td>
              <td class="num">${pct(r.f2p)}</td></tr>`).join('')}
          </tbody></table></div>
          <div class="help" style="margin-top:8px">${P.payouts.length} payout${P.payouts.length === 1 ? '' : 's'} from ${P.bought} accounts${P.payouts.length ? ` · one payout for every ${(P.bought / P.payouts.length).toFixed(1)} accounts bought` : ''}${P.resets ? ` · ${P.resets} reset${P.resets === 1 ? '' : 's'} not counted as new accounts` : ''}.</div>
        </div></div>
        <div class="card"><div class="card-body">
          <div class="lg-ch-head"><div><h3>Payout sizes</h3><div class="help">Every payout, in order. Dashed line is the average.</div></div>
            <div class="lg-kpi"><b>${U.moneyShort(P.avgPayout)}</b><span>average payout</span></div></div>
          <div class="chart-box sm"><canvas id="pcSizes"></canvas></div>
        </div></div>
      </div>
      <div class="card" style="margin-bottom:16px"><div class="card-body">
        <div class="lg-ch-head"><div><h3>Days between payouts</h3><div class="help">How long each payout took to arrive after the one before it.</div></div>
          <div class="lg-kpi"><b>${P.avgGap == null ? '—' : Math.round(P.avgGap) + 'd'}</b><span>average wait</span></div></div>
        ${P.gaps.length ? `<div class="chart-box sm"><canvas id="pcCycle"></canvas></div>
          <div class="lg-rates three"><div><span>First → second payout</span><b>${P.gaps[0]} days</b></div><div><span>Fastest</span><b>${Math.min(...P.gaps)} days</b></div><div><span>Latest wait</span><b>${P.gaps[P.gaps.length - 1]} days</b></div></div>`
        : `<div class="no-data">Needs at least two payouts. ${P.payouts.length} so far.</div>`}
      </div></div>`;
  },

  processCharts(el, rows) {
    const P = this.process(rows), L = this.look();
    const Per = this.per || this.period();
    const mLabels = Per.months.map(m => this.mLabel(m, Per.multiYear));
    const axisY = (money, extra = {}) => ({ grid: { color: '#F1F3F8' }, border: { display: false }, ticks: { color: '#9AA1BA', maxTicksLimit: 5, precision: 0, ...(money ? { callback: v => U.moneyAxis(v) } : {}) }, ...extra });
    const axisX = { grid: { display: false }, border: { display: false }, ticks: { color: '#9AA1BA', maxRotation: 0, autoSkip: true } };
    const cv1 = U.$('#pcPerMonth', el);
    if (cv1) {
      const firstIdx = P.months.findIndex(m => m.payouts);
      Charts.make(cv1, { type: 'bar', data: { labels: mLabels, datasets: [
        { label: 'Payouts', data: P.months.map(m => m.payouts), backgroundColor: L.payout, borderRadius: 4, maxBarThickness: 26, order: 2 },
        { type: 'line', label: 'Average', data: P.months.map((m, i) => (firstIdx >= 0 && i >= firstIdx ? +P.avgPerMonth.toFixed(2) : null)), borderColor: L.line, borderDash: [5, 4], borderWidth: 1.6, pointRadius: 0, order: 1 },
      ] }, options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.dataset.label === 'Average' ? `Average ${c.parsed.y.toFixed(1)} a month` : `${c.parsed.y} payout${c.parsed.y === 1 ? '' : 's'}` } } },
        scales: { x: axisX, y: axisY(false, { beginAtZero: true }) } } });
    }
    const cv2 = U.$('#pcYield', el);
    if (cv2) {
      let cb = 0, cp = 0;
      const ratio = P.months.map(m => (m.payouts ? +(m.bought / m.payouts).toFixed(2) : null));
      const run = P.months.map(m => { cb += m.bought; cp += m.payouts; return cp ? +(cb / cp).toFixed(2) : null; });
      const noPay = P.months.map(m => (!m.payouts && m.bought ? 0 : null));
      Charts.make(cv2, { type: 'bar', data: { labels: mLabels, datasets: [
        { label: 'Evals per payout', data: ratio, backgroundColor: L.fee + 'CC', borderRadius: 4, maxBarThickness: 26, order: 2 },
        { type: 'line', label: 'Running average', data: run, borderColor: L.line, borderWidth: 2, pointRadius: 2.5, pointBackgroundColor: L.line, tension: .3, spanGaps: true, order: 1 },
        { type: 'scatter', label: 'No payout', data: noPay, pointStyle: 'crossRot', pointRadius: 6, borderColor: '#C9CEDD', borderWidth: 2, order: 0 },
      ] }, options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => {
          const m = P.months[c.dataIndex];
          if (c.dataset.label === 'No payout') return `${m.bought} bought · no payout`;
          if (c.dataset.label === 'Running average') return `Running average ${c.parsed.y.toFixed(1)}`;
          return `${m.bought} bought ÷ ${m.payouts} payout${m.payouts === 1 ? '' : 's'} = ${c.parsed.y.toFixed(1)}`; } } } },
        scales: { x: axisX, y: axisY(false, { beginAtZero: true }) } } });
    }
    const cv3 = U.$('#pcSizes', el);
    if (cv3 && P.payouts.length) {
      Charts.make(cv3, { type: 'bar', data: { labels: P.payouts.map(p => U.fmtShort(p.date)), datasets: [
        { label: 'Payout', data: P.payouts.map(p => p.amount), backgroundColor: L.payout, borderRadius: 4, maxBarThickness: 30, order: 2 },
        { type: 'line', label: 'Average', data: P.payouts.map(() => +P.avgPayout.toFixed(2)), borderColor: L.line, borderDash: [5, 4], borderWidth: 1.6, pointRadius: 0, order: 1 },
      ] }, options: { plugins: { legend: { display: false }, tooltip: { callbacks: {
          title: it => { const p = P.payouts[it[0].dataIndex]; return `${p.firm} · ${U.fmtLong(p.date)}`; },
          label: c => (c.dataset.label === 'Average' ? `Average ${U.money(c.parsed.y)}` : U.money(c.parsed.y)) } } },
        scales: { x: { ...axisX, ticks: { ...axisX.ticks, maxTicksLimit: 6 } }, y: axisY(true, { beginAtZero: true }) } } });
    }
    const cv4 = U.$('#pcCycle', el);
    if (cv4 && P.gaps.length) {
      const ord = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
      Charts.make(cv4, { type: 'bar', data: { labels: P.gaps.map((g, i) => `${ord(i + 1)}→${ord(i + 2)}`), datasets: [
        { label: 'Days', data: P.gaps, backgroundColor: L.line + 'CC', borderRadius: 4, maxBarThickness: 30, order: 2 },
        { type: 'line', label: 'Average', data: P.gaps.map(() => +P.avgGap.toFixed(1)), borderColor: L.forecast, borderDash: [5, 4], borderWidth: 1.6, pointRadius: 0, order: 1 },
      ] }, options: { plugins: { legend: { display: false }, tooltip: { callbacks: {
          title: it => { const i = it[0].dataIndex; return `${U.fmtShort(P.payouts[i].date)} → ${U.fmtShort(P.payouts[i + 1].date)}`; },
          label: c => (c.dataset.label === 'Average' ? `Average ${Math.round(c.parsed.y)} days` : `${c.parsed.y} days (${P.payouts[c.dataIndex + 1].firm})`) } } },
        scales: { x: axisX, y: axisY(false, { beginAtZero: true, ticks: { color: '#9AA1BA', maxTicksLimit: 5, callback: v => v + 'd' } }) } } });
    }
  },

  lookModal() {
    const l = this.look();
    const saved = () => (Array.isArray(Store.data.settings.ledgerColors) ? Store.data.settings.ledgerColors : []);
    let added = [...saved()];
    const rows = [['payout', 'Payouts'], ['fee', 'Prop Firm Fees'], ['tool', 'Tools & Data'], ['live', 'Live Account'], ['line', 'Take-Home Line'], ['forecast', 'Forecast']];
    const next = { ...l };
    const sw = (key, c, isDef) => `<button type="button" class="lk-sw ${next[key].toLowerCase() === c.toLowerCase() ? 'on' : ''}" style="--rc:${c}" data-c="${c}" title="${isDef ? 'Default' : c}"></button>`;
    const rowHTML = key => `${sw(key, this.LOOK[key], true)}${added.filter(c => c.toLowerCase() !== this.LOOK[key].toLowerCase()).map(c => sw(key, c)).join('')}
      <label class="lk-add" title="Add a color">+<input type="color" value="${next[key]}" data-custom></label>`;
    const body = U.h(`<div>
      ${rows.map(([key, label]) => `<div class="lk-row"><span class="lk-lbl">${label}</span><div class="lk-sws" data-key="${key}"></div></div>`).join('')}
      <div class="tog-grid" style="margin-top:14px">
        <label class="tog"><input type="checkbox" data-t="dots" ${l.dots ? 'checked' : ''}> A Dot for Every Entry</label>
        <label class="tog"><input type="checkbox" data-t="showForecast" ${l.showForecast ? 'checked' : ''}> Show Year-End Forecast</label>
      </div></div>`);
    const paint = () => U.$$('.lk-sws', body).forEach(g => {
      const key = g.dataset.key; g.innerHTML = rowHTML(key);
      U.$$('.lk-sw', g).forEach(b => b.onclick = () => { next[key] = b.dataset.c; paint(); });
      U.$('[data-custom]', g).onchange = e => {
        const c = e.target.value; next[key] = c;
        if (c.toLowerCase() !== this.LOOK[key].toLowerCase() && !added.some(x => x.toLowerCase() === c.toLowerCase())) added.push(c);
        paint();
      };
    });
    paint();
    U.$$('[data-t]', body).forEach(i => i.onchange = () => { next[i.dataset.t] = i.checked; });
    UI.modal({ title: 'Customize Your Ledger', body, footer: [
      { label: 'Reset', cls: 'left', onClick: c => { delete Store.data.settings.ledgerLook; Store.save(); c(); App.render(); } },
      { label: 'Cancel' },
      { label: 'Save', cls: 'primary', onClick: c => { Store.data.settings.ledgerLook = next; Store.data.settings.ledgerColors = added.slice(-8); Store.save(); c(); App.toast('Ledger updated'); App.render(); } },
    ] });
  },

  editModal(e, presetType) {
    const isNew = !e;
    let type = e ? (this.TYPES.includes(e.type) ? e.type : e.type) : (presetType || 'Expense');
    const firmsOf = live => [...new Set(this.all().filter(x => (this.kind(x) === 'live') === live).map(x => x.firm))].sort();
    // existing entries without a saved choice get their best guess preselected
    let sub = e && e.type === 'Expense' ? (e.sub || (this.kind(e) === 'tool' ? 'data' : ((this.buy(e) || {}).kind || ''))) : '';
    let win = e ? e.amount >= 0 : true;
    const showTypes = this.TYPES.includes(type) ? this.TYPES : [...this.TYPES, type];
    const body = U.h(`<div class="le-form">
      <div class="seg le-type" id="leType">${showTypes.map(t => `<button type="button" data-t="${t}" class="${t === type ? 'on' : ''}">${this.TYPE_LABEL[t] || t}</button>`).join('')}</div>
      <div class="le-field"><label class="field-label" id="leFirmLbl"></label>
        <input class="inp" id="leFirm" list="leFirms" value="${U.esc(e ? e.firm : '')}"><datalist id="leFirms"></datalist></div>
      <div class="le-field"><label class="field-label">Amount ($)</label>
        <div class="le-amt"><input class="inp" id="leAmt" type="number" min="0" step="0.01" value="${e ? Math.abs(e.amount) : ''}" placeholder="e.g. 99">
          <div class="seg le-wl" data-show="live"><button type="button" data-w="1" class="${win ? 'on win' : ''}">Win</button><button type="button" data-w="0" class="${!win ? 'on loss' : ''}">Loss</button></div></div></div>
      <div class="le-field"><label class="field-label">Date</label><input class="inp" id="leDate" type="date" value="${e ? e.date : U.todayKey()}"></div>
      <div class="le-field" data-show="spent"><label class="field-label">What was it?</label>
        <div class="le-chips" id="leSub">${this.SUBS.map(([v, t]) => `<button type="button" data-v="${v}" class="${sub === v ? 'on' : ''}">${t}</button>`).join('')}</div>
        <input class="inp" id="leSubText" style="margin-top:8px;display:${sub === 'other' ? '' : 'none'}" value="${U.esc(e && e.subText || '')}" placeholder="What exactly was it? e.g. Course, platform fee"></div>
      <div class="le-field" data-show="spent"><label class="field-label">More details <span class="opt">(optional)</span></label>
        <input class="inp" id="leDescE" value="${U.esc(e && e.type === 'Expense' ? e.description || '' : '')}" placeholder="e.g. 50K eval, Pack of 5"></div>
      <div class="le-field" data-show="payout"><label class="field-label">What was it? <span class="opt">(optional)</span></label>
        <input class="inp" id="leDescP" value="${U.esc(e && e.type !== 'Expense' ? e.description || '' : '')}" placeholder="e.g. Growth, Instant funded, Flex"></div>
    </div>`);
    const showFor = () => {
      const live = type === 'Live P&L';
      U.$$('[data-show]', body).forEach(x => {
        const w = x.dataset.show;
        x.style.display = (w === 'spent' && type === 'Expense') || (w === 'payout' && (type === 'Payout' || type === 'Other income')) || (w === 'live' && live) ? '' : 'none';
      });
      U.$('#leFirmLbl', body).textContent = live ? 'Broker' : type === 'Expense' ? 'Prop firm or service' : 'Prop firm';
      U.$('#leFirm', body).placeholder = live ? 'e.g. AMP, NinjaTrader' : type === 'Expense' ? 'e.g. Tradeify, TradingView' : 'e.g. Tradeify';
      U.$('#leFirms', body).innerHTML = firmsOf(live).map(f => `<option value="${U.esc(f)}">`).join('');
    };
    U.$$('#leType button', body).forEach(b => b.onclick = () => {
      type = b.dataset.t; U.$$('#leType button', body).forEach(x => x.classList.toggle('on', x === b)); showFor();
    });
    U.$$('#leSub button', body).forEach(b => b.onclick = () => {
      sub = b.dataset.v; U.$$('#leSub button', body).forEach(x => x.classList.toggle('on', x === b));
      const t = U.$('#leSubText', body); t.style.display = sub === 'other' ? '' : 'none'; if (sub === 'other') t.focus();
    });
    U.$$('.le-wl button', body).forEach(b => b.onclick = () => {
      win = b.dataset.w === '1';
      U.$$('.le-wl button', body).forEach(x => { const on = x === b; x.classList.toggle('on', on); x.classList.toggle('win', on && win); x.classList.toggle('loss', on && !win); });
    });
    showFor();
    const footer = [];
    if (!isNew) footer.push({ label: 'Delete', cls: 'danger left', onClick: c => { Store.data.ledger = this.all().filter(x => x.id !== e.id); Store.save(); c(); App.toast('Entry deleted'); App.render(); } });
    footer.push({ label: 'Cancel' }, { label: isNew ? 'Add' : 'Save', cls: 'primary', onClick: c => {
      const amt = Math.abs(+U.$('#leAmt', body).value), firm = U.$('#leFirm', body).value.trim(), date = U.$('#leDate', body).value;
      if (!firm) { App.toast(type === 'Live P&L' ? 'Enter the broker' : 'Enter the prop firm or service', 'err'); return; }
      if (!amt) { App.toast('Enter an amount', 'err'); return; }
      if (!date) { App.toast('Pick a date', 'err'); return; }
      if (type === 'Expense' && !sub) { App.toast('Pick what it was', 'err'); return; }
      const subText = U.$('#leSubText', body).value.trim();
      if (type === 'Expense' && sub === 'other' && !subText) { App.toast('Write what it was', 'err'); U.$('#leSubText', body).focus(); return; }
      const sign = type === 'Expense' || (type === 'Live P&L' && !win) ? -1 : 1;
      const desc = type === 'Expense' ? U.$('#leDescE', body).value.trim() : type === 'Live P&L' ? '' : U.$('#leDescP', body).value.trim();
      const rec = { date, firm, type, description: desc, amount: Math.round(sign * amt * 100) / 100 };
      if (isNew) this.all().push({ id: 'l_' + U.uid(), ...rec }); else { Object.assign(e, rec); delete e.sub; delete e.subText; delete e.qty; delete e.first; }
      const target = isNew ? this.all()[this.all().length - 1] : e;
      if (type === 'Expense') { target.sub = sub; if (sub === 'other') target.subText = subText; }
      Store.save(); c(); App.toast(isNew ? 'Added to your ledger' : 'Saved'); App.render();
    } });
    UI.modal({ title: isNew ? 'Add to ledger' : 'Edit entry', body, footer });
    if (isNew) setTimeout(() => U.$('#leFirm', body).focus(), 50);
  },

  normType(t, amount) {
    t = String(t || '').trim().toLowerCase();
    if (/pass|funded account/.test(t)) return 'Passed';
    if (/payout|withdraw/.test(t)) return 'Payout';
    if (/live/.test(t)) return 'Live P&L';
    if (/expense|cost|fee|purchase|reset|eval|sub/.test(t)) return 'Expense';
    if (/income|other|refund/.test(t)) return 'Other income';
    return amount < 0 ? 'Expense' : 'Payout';
  },

  async importFile(file) {
    let raw;
    try {
      const text = await U.readFile(file);
      if (/\.json$/i.test(file.name) || text.trim().startsWith('[') || text.trim().startsWith('{')) {
        const j = JSON.parse(text); raw = Array.isArray(j) ? j : (j.ledger || j.entries || []);
      } else {
        const rows = Parser.parseCSV(text), h = rows[0].map(x => x.trim().toLowerCase());
        const ix = n => h.findIndex(x => n.includes(x));
        const c = { date: ix(['date']), firm: ix(['firm', 'company', 'vendor', 'service']), type: ix(['type', 'category', 'kind']), desc: ix(['description', 'desc', 'note', 'notes', 'item']), amt: ix(['amount', 'value', 'total', '$']) };
        if (c.date < 0 || c.amt < 0) throw new Error('The CSV needs at least a date and an amount column.');
        raw = rows.slice(1).map(r => ({ date: r[c.date], firm: c.firm >= 0 ? r[c.firm] : 'Unknown', type: c.type >= 0 ? r[c.type] : '', description: c.desc >= 0 ? r[c.desc] : '', amount: r[c.amt] }));
      }
    } catch (err) { App.toast('Could not read that file: ' + err.message, 'err'); return; }
    const sig = e => [e.date, e.firm, e.type, e.description, e.amount.toFixed(2)].join('|');
    const have = new Map();
    this.all().forEach(e => have.set(sig(e), (have.get(sig(e)) || 0) + 1));
    let added = 0, dup = 0, bad = 0;
    raw.forEach(r => {
      const iso = Parser.parseDate(r.date);
      let amount = typeof r.amount === 'number' ? r.amount : Parser.parseMoney(r.amount);
      const type0 = this.normType(r.type, amount || 0);
      if (type0 === 'Passed' && !isFinite(amount)) amount = 0;
      if (!iso || !isFinite(amount)) { bad++; return; }
      const type = this.normType(r.type, amount);
      if (type === 'Expense') amount = -Math.abs(amount);
      if (type === 'Payout') amount = Math.abs(amount);
      const rec = { date: iso.slice(0, 10), firm: String(r.firm || 'Unknown').trim(), type, description: String(r.description || '').trim(), amount: Math.round(amount * 100) / 100 };
      const k = sig(rec), n = have.get(k) || 0;
      if (n > 0) { have.set(k, n - 1); dup++; return; } // same entry already in the ledger
      this.all().push({ id: 'l_' + U.uid(), ...rec }); added++;
    });
    Store.save();
    this.year = null;
    App.toast(`Added ${added} entr${added === 1 ? 'y' : 'ies'}${dup ? ` · ${dup} already there` : ''}${bad ? ` · ${bad} skipped` : ''}`);
    App.render();
  },

  exportCSV() {
    const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
    const lines = ['date,firm,type,description,amount'].concat([...this.all()].sort((a, b) => (a.date < b.date ? -1 : 1)).map(e => [e.date, e.firm, e.type, e.description, e.amount].map(q).join(',')));
    U.download(`mubu-ledger-${U.todayKey()}.csv`, lines.join('\n'), 'text/csv');
  },
};

</script>
  <script>
window.Views = window.Views || {};

Views.import = {
  title: 'Import Trades',
  pending: null, // { files:[{name, result, error}] }

  render(el) {
    const accounts = Store.accounts().filter(a => !/^Demo\b/.test(a));
    const last = Store.data.imports.find(i => i.id !== 'demo' && !/^Demo\b/.test(i.account));
    const defaultAcct = last ? last.account : (accounts[0] || '');
    el.innerHTML = `
      <div class="grid g-2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
        <div class="card">
          <div class="card-head"><h3>Import CSV</h3></div>
          <div class="card-body">
            <div class="form-row">
              <div><label class="field-label">Account</label>
                <select class="inp" id="impAcct">
                  ${accounts.map(a => `<option ${a === defaultAcct ? 'selected' : ''}>${U.esc(a)}</option>`).join('')}
                  <option value="__new" ${!accounts.length ? 'selected' : ''}>+ New account…</option>
                </select></div>
              <div id="newAcctWrap" style="${accounts.length ? 'display:none' : ''}"><label class="field-label">New account name</label>
                <input class="inp" id="impNewAcct" placeholder="e.g. Tradeify 50K #1"></div>
            </div>
            <label class="dropzone" id="drop">
              <input type="file" id="impFile" accept=".csv,text/csv" multiple hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
              <div class="big">Drop your CSV here or click to browse</div>
              <div class="help">You can drop several files at once. Trades already in your journal are skipped automatically.</div>
            </label>
            <div id="impPreview"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Daily routine</h3></div>
          <div class="card-body">
            <ol class="steps">
              <li>In Tradovate, open <b>Account Reports → Performance</b>, pick today (or the whole week), and click <b>Download / Export CSV</b>.</li>
              <li>Come here, pick the account, and drop the file in.</li>
              <li>Exporting overlapping date ranges is fine — duplicates are detected and skipped.</li>
              <li>Open the <a href="#/journal">Daily Journal</a> and write your notes while the session is fresh.</li>
            </ol>
            <div class="help" style="margin-top:14px">
              <b>Formats recognised</b><br>
              • Tradovate <b>Performance</b> export (<code>buyPrice, sellPrice, pnl, boughtTimestamp, soldTimestamp</code>) — best option.<br>
              • TradingView <b>trade history</b> export (<code>Trade number, Type, Date and time, Price, Net PnL</code>).<br>
              • Any closed-trades CSV with a P&amp;L column (date, symbol, side, qty, entry, exit, pnl, fees) — see <code>sample-data/template-trades.csv</code>.<br>
              • Fills / Orders exports (<code>B/S, Contract, Qty, Price, Fill Time</code>) — fills are paired FIFO into round trips using contract point values.<br><br>
              Tradovate's Performance P&amp;L does <b>not</b> include commissions — set your per-contract round-turn cost in <a href="#/settings">Settings</a> and it's applied everywhere.
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Import history</h3><span class="help">Undo removes exactly the trades that import added.</span></div>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Imported</th><th>File</th><th>Account</th><th>Format</th><th class="num">Added</th><th class="num">Skipped (dupes)</th><th>Range</th><th></th></tr></thead>
        <tbody>${Store.data.imports.map(i => `<tr>
          <td>${U.fmtDateTime(i.at)}</td><td><b>${U.esc(i.file)}</b></td><td>${U.esc(i.account)}</td><td class="help">${U.esc(i.format)}</td>
          <td class="num">${i.added}</td><td class="num">${i.dupes}</td><td class="help">${i.from ? `${U.fmtDate(i.from)} → ${U.fmtDate(i.to)}` : '—'}</td>
          <td class="num"><button class="btn sm danger" data-undo="${i.id}">Undo</button></td></tr>`).join('') || '<tr class="empty-row"><td colspan="8">No imports yet</td></tr>'}</tbody></table></div>
      </div>`;

    const acctSel = U.$('#impAcct', el), newWrap = U.$('#newAcctWrap', el);
    acctSel.onchange = () => { newWrap.style.display = acctSel.value === '__new' ? '' : 'none'; if (this.pending) this.showPreview(el); };
    U.$('#impNewAcct', el).addEventListener('input', U.debounce(() => this.pending && this.showPreview(el), 300));
    const drop = U.$('#drop', el), input = U.$('#impFile', el);
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', e => this.handleFiles(el, [...e.dataTransfer.files]));
    input.onchange = () => { this.handleFiles(el, [...input.files]); input.value = ''; };
    U.$$('[data-undo]', el).forEach(b => b.onclick = async () => {
      const imp = Store.data.imports.find(i => i.id === b.dataset.undo);
      if (await UI.confirm('Undo import?', `Remove the ${imp.added} trade(s) added from <b>${U.esc(imp.file)}</b>?`, 'Remove trades')) {
        Store.undoImport(imp.id); App.toast('Import undone'); App.render();
      }
    });
    if (this.pending) this.showPreview(el);
  },

  account(el) {
    const v = U.$('#impAcct', el).value;
    return v === '__new' ? U.$('#impNewAcct', el).value.trim() : v;
  },

  async handleFiles(el, files) {
    files = files.filter(f => /\.csv$/i.test(f.name) || f.type.includes('csv') || f.type === 'text/plain');
    if (!files.length) { App.toast('Please choose a .csv file', 'err'); return; }
    const opts = { pointValues: Store.data.settings.pointValues };
    const parsed = [];
    for (const f of files) {
      try { parsed.push({ name: f.name, result: Parser.parse(await U.readFile(f), opts) }); }
      catch (e) { parsed.push({ name: f.name, error: e.message }); }
    }
    this.pending = { files: parsed };
    this.showPreview(el);
  },

  /* Build final trades for the chosen account and split new vs duplicate. */
  prepare(acct) {
    const existing = Store.idSet();
    const seen = new Set();
    return this.pending.files.map(f => {
      if (f.error) return { ...f };
      const fresh = [], dupes = [];
      f.result.trades.forEach(t => {
        const account = (t.account && t.account.trim()) || acct;
        const id = U.hash(account + '|' + t.baseId);
        const full = { ...t, id, account, setup: t.setup || '', notes: t.notes || '', tags: [], rating: 0 };
        delete full.baseId;
        if (existing.has(id) || seen.has(id)) dupes.push(full); else { seen.add(id); fresh.push(full); }
      });
      return { ...f, fresh, dupes };
    });
  },

  showPreview(el) {
    const box = U.$('#impPreview', el);
    const acct = this.account(el);
    const prep = this.prepare(acct || '(no account)');
    const totalNew = prep.reduce((a, f) => a + (f.fresh ? f.fresh.length : 0), 0);
    const needsAcct = prep.some(f => f.fresh && f.fresh.some(t => t.account === '(no account)'));
    box.innerHTML = prep.map(f => {
      if (f.error) return `<div class="result-box err"><b>${U.esc(f.name)}</b> — ${U.esc(f.error)}</div>`;
      const sample = f.fresh.slice(0, 6);
      const net = f.fresh.reduce((a, t) => a + M.net(t), 0);
      return `<div class="result-box ${f.fresh.length ? 'ok' : 'warn'}">
        <b>${U.esc(f.name)}</b> · ${U.esc(f.result.format)}<br>
        <b>${f.fresh.length}</b> new trade${f.fresh.length === 1 ? '' : 's'}${f.fresh.length ? ` (net ${U.money(net)})` : ''}, <b>${f.dupes.length}</b> already in your journal.
        ${f.result.warnings.map(w => `<br>⚠ ${U.esc(w)}`).join('')}
      </div>
      ${sample.length ? `<div class="table-wrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>Date</th><th>Symbol</th><th>Side</th><th class="num">Qty</th><th class="num">Entry</th><th class="num">Exit</th><th class="num">Net P&amp;L</th></tr></thead><tbody>
        ${sample.map(t => { const n = M.net(t); return `<tr><td>${U.fmtDateTime(t.entryTime)}</td><td>${U.esc(t.symbol)}</td><td><span class="side ${t.side.toLowerCase()}">${t.side}</span></td><td class="num">${t.qty}</td><td class="num">${U.price(t.entryPrice)}</td><td class="num">${U.price(t.exitPrice)}</td><td class="num ${U.cls(n)}">${U.money(n)}</td></tr>`; }).join('')}
        ${f.fresh.length > sample.length ? `<tr><td colspan="7" class="help">…and ${f.fresh.length - sample.length} more</td></tr>` : ''}
      </tbody></table></div>` : ''}`;
    }).join('') + `<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn" id="impCancel">Cancel</button>
        <button class="btn primary" id="impGo" ${!totalNew ? 'disabled' : ''}>Import ${totalNew} trade${totalNew === 1 ? '' : 's'}</button></div>`;

    U.$('#impCancel', box).onclick = () => { this.pending = null; box.innerHTML = ''; };
    U.$('#impGo', box).onclick = () => {
      if (needsAcct && !acct) { App.toast('Enter an account name first', 'err'); U.$('#impNewAcct', el).focus(); return; }
      let added = 0;
      prep.forEach(f => {
        if (!f.fresh || !f.fresh.length) return;
        const id = U.uid();
        const keys = f.fresh.map(t => U.dayKey(t.entryTime)).sort();
        f.fresh.forEach(t => { t.importId = id; });
        Store.commitImport({ id, at: U.isoOf(new Date()), file: f.name, account: f.fresh[0].account, format: f.result.format,
          added: f.fresh.length, dupes: f.dupes.length, from: keys[0], to: keys[keys.length - 1] }, f.fresh);
        added += f.fresh.length;
        App.calMonth = keys[keys.length - 1].slice(0, 7);
      });
      this.pending = null;
      App.toast(`Imported ${added} trade${added === 1 ? '' : 's'}`);
      App.refreshFilters();
      App.go('#/dashboard');
    };
  },
};

    U.$('#sDelAcct', el).onclick = () => {

        <label class="field-label">Type <b>DELETE</b> to confirm</label><input class="inp" id="delConfirm" autocomplete="off">
        <div class="result-box err" id="delErr" style="display:none"></div></div>`);
      UI.modal({ title: 'Delete account?', body, footer: [

        { label: 'Cancel' },

  <script>
/* Accounts + cloud sync through Supabase.
   Each user has one row in public.journals holding their whole journal (trades, notes, settings) as JSON.
   The browser keeps a cached copy so pages load instantly; every change is pushed to the cloud a moment later. */
const Cloud = (() => {
  const SUPABASE_URL = 'https://vfpjddkmdirhwekcaubn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_-u5S2qowcoOJz10EtW43aA_6eW7af8y'; // publishable key — safe in a public page

  let sb = null, timer = null, saving = false, again = false, status = 'idle';
  const C = { user: null };

  function client() {
    if (sb) return sb;
    if (!window.supabase || !window.supabase.createClient) throw new Error('Could not load the sign-in service. Check your internet connection and refresh.');
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' },
    });
    return sb;
  }
  const redirectUrl = () => location.origin + location.pathname;

  /* ---------- status indicator ---------- */
  function setStatus(s) {
    status = s;
    const el = document.getElementById('syncStatus');
    if (!el) return;
    const map = {
      idle: ['', 'Synced'], saved: ['ok', 'All changes saved'], pending: ['busy', 'Saving…'], saving: ['busy', 'Saving…'],
      error: ['err', 'Not saved — retrying'], offline: ['err', 'Offline — will sync when back'],
    };
    const [cls, txt] = map[s] || map.idle;
    el.className = 'sync ' + cls;
    el.textContent = txt;
  }

  /* ---------- sync ---------- */
  async function pull() {
    const { data, error } = await client().from('journals').select('data, updated_at').eq('user_id', C.user.id).maybeSingle();
    if (error) throw error;
    return data;
  }

  async function push() {
    if (!C.user) return;
    if (saving) { again = true; return; }
    if (!navigator.onLine) { setStatus('offline'); return; }
    saving = true; setStatus('saving');
    const now = new Date().toISOString();
    try {
      const { error } = await client().from('journals').upsert({ user_id: C.user.id, data: Store.data, updated_at: now });
      if (error) throw error;
      Store.setMeta({ dirty: false, syncedAt: now });
      setStatus('saved');
    } catch (e) {
      console.error('Sync failed', e);
      setStatus('error');
      clearTimeout(timer); timer = setTimeout(push, 15000);
    } finally {
      saving = false;
      if (again) { again = false; queue(); }
    }
  }

  function queue(delay = 1200) {
    clearTimeout(timer);
    setStatus('pending');
    timer = setTimeout(push, delay);
  }
  function flush() { if (Store.meta().dirty) { clearTimeout(timer); push(); } }

  /* Decide which copy wins when the app opens. */
  async function loadForUser(user) {
    C.user = user;
    Store.useUser(user.id);
    Store.load();
    const meta = Store.meta();
    let remote = null;
    try { remote = await pull(); }
    catch (e) {
      console.error(e);
      setStatus('offline');
      App.toast('Could not reach the server — showing the copy saved on this device.', 'err');
      return;
    }
    if (remote) {
      const localNewer = meta.dirty && meta.localAt && meta.localAt > remote.updated_at;
      if (localNewer) { push(); }
      else Store.setFromRemote(remote.data, remote.updated_at);
    } else {
      // First sign-in: bring over anything saved in this browser before accounts existed.
      const legacy = Store.legacyData();
      if (!Store.data.trades.length && legacy && (legacy.trades.length || Object.keys(legacy.notes || {}).length)) {
        Store.data = Store.normalize(legacy);
        Store.retireLegacy();
        setTimeout(() => App.toast(`Moved ${legacy.trades.length} trades from this browser into your account`), 600);
      }
      Store.save();
      await push();
    }
    setStatus('saved');
  }

  /* Pick up changes made on another device when this tab comes back into focus. */
  async function refreshIfStale() {
    if (!C.user || saving || Store.meta().dirty) return;
    try {
      const remote = await pull();
      const meta = Store.meta();
      if (remote && (!meta.syncedAt || remote.updated_at > meta.syncedAt)) {
        Store.setFromRemote(remote.data, remote.updated_at);
        App.loadFilters(); App.refreshFilters(); App.render();
        App.toast('Updated with changes from another device');
      }
    } catch (e) { /* ignore */ }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush(); else refreshIfStale();
  });
  window.addEventListener('online', () => { if (Store.meta && Store.meta().dirty) queue(200); });
  window.addEventListener('beforeunload', e => {
    if (C.user && (saving || Store.meta().dirty)) { flush(); e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------- auth ---------- */
  async function session() {
    const { data } = await client().auth.getSession();
    return data.session;
  }
  async function signIn(email, password) {
    const { data, error } = await client().auth.signInWithPassword({ email, password });
    if (error) throw error;
    return data.session;
  }
  async function signUp(email, password) {
    const { data, error } = await client().auth.signUp({ email, password, options: { emailRedirectTo: redirectUrl() } });
    if (error) throw error;
    return data; // data.session is null when email confirmation is required
  }
  async function resetPassword(email) {
    const { error } = await client().auth.resetPasswordForEmail(email, { redirectTo: redirectUrl() });
    if (error) throw error;
  }
  async function updatePassword(password) {
    const { error } = await client().auth.updateUser({ password });
    if (error) throw error;
  }
  async function signOut() {
    if (Store.meta().dirty) { clearTimeout(timer); await push(); }
    await client().auth.signOut();
    history.replaceState(null, '', redirectUrl());
    location.reload();
  }
  /* Permanently deletes the signed-in user's login and journal (server function delete_my_account). */
  async function deleteAccount() {
    clearTimeout(timer);
    const user = C.user;
    C.user = null; // stop any further syncing so nothing re-creates the row
    const { error } = await client().rpc('delete_my_account');
    if (error) { C.user = user; throw error; }
    try {
      Object.keys(localStorage).filter(k => k.startsWith('mubu-journal-v1:' + user.id)).forEach(k => localStorage.removeItem(k));
    } catch (e) {}
    try { await client().auth.signOut({ scope: 'local' }); } catch (e) {}
    history.replaceState(null, '', redirectUrl());
    location.reload();
  }
  function onAuth(cb) { client().auth.onAuthStateChange((event, s) => cb(event, s)); }

  return Object.assign(C, { client, queue, flush, loadForUser, session, signIn, signUp, resetPassword, updatePassword, signOut, deleteAccount, onAuth, setStatus });
})();

</script>
  <script>
/* Sign in / create account / reset password screen. */
const Auth = (() => {
  let mode = 'signin'; // signin | signup | forgot | recover
  let booted = false;

  const screen = () => document.getElementById('auth');

  function show(m, msg = '', kind = '') {
    mode = m;
    document.getElementById('app').style.display = 'none';
    const el = screen();
    el.hidden = false;
    const titles = { signin: 'Sign in to your journal', signup: 'Create your account', forgot: 'Reset your password', recover: 'Choose a new password' };
    const btn = { signin: 'Sign in', signup: 'Create account', forgot: 'Send reset link', recover: 'Save new password' };
    el.innerHTML = `
      <div class="auth-card">
        <div class="auth-brand"><div class="logo"><svg viewBox="0 0 32 32"><path d="M7 23V9l9 9 9-9v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span>MUBU JOURNAL</span></div>
        <h2>${titles[m]}</h2>
        ${msg ? `<div class="result-box ${kind || 'warn'}" style="margin:0 0 14px">${msg}</div>` : ''}
        <form id="authForm" novalidate>
          ${m !== 'recover' ? `<label class="field-label" for="aEmail">Email</label>
            <input class="inp" id="aEmail" type="email" autocomplete="email" required>` : ''}
          ${m === 'signin' || m === 'signup' || m === 'recover' ? `<label class="field-label" for="aPass" style="margin-top:12px">${m === 'recover' ? 'New password' : 'Password'}</label>
            <input class="inp" id="aPass" type="password" autocomplete="${m === 'signin' ? 'current-password' : 'new-password'}" minlength="8" required>` : ''}
          ${m === 'signup' || m === 'recover' ? `<div class="help" style="margin-top:6px">At least 8 characters.</div>` : ''}
          <button class="btn primary auth-submit" type="submit">${btn[m]}</button>
        </form>
        <div class="auth-links">
          ${m === 'signin' ? `<a href="#" data-m="forgot">Forgot password?</a><span>New here? <a href="#" data-m="signup">Create an account</a></span>` : ''}
          ${m === 'signup' ? `<span>Already have an account? <a href="#" data-m="signin">Sign in</a></span>` : ''}
          ${m === 'forgot' ? `<a href="#" data-m="signin">Back to sign in</a>` : ''}
        </div>
      </div>`;
    el.querySelectorAll('[data-m]').forEach(a => a.onclick = e => { e.preventDefault(); show(a.dataset.m); });
    const f = document.getElementById('authForm');
    f.onsubmit = e => { e.preventDefault(); submit(f); };
    const first = f.querySelector('input'); if (first) first.focus();
  }

  async function submit(f) {
    const btn = f.querySelector('button'); const label = btn.textContent;
    const email = (f.querySelector('#aEmail')?.value || '').trim();
    const pass = f.querySelector('#aPass')?.value || '';
    if (mode !== 'recover' && !/^\S+@\S+\.\S+$/.test(email)) return show(mode, 'Enter a valid email address.', 'err');
    if ((mode === 'signup' || mode === 'recover') && pass.length < 8) return show(mode, 'Password must be at least 8 characters.', 'err');
    btn.disabled = true; btn.textContent = 'Please wait…';
    try {
      if (mode === 'signin') {
        const s = await Cloud.signIn(email, pass);
        await enter(s.user);
      } else if (mode === 'signup') {
        const r = await Cloud.signUp(email, pass);
        if (r.session) await enter(r.session.user);
        else show('signin', `Almost done — we sent a confirmation link to <b>${U.esc(email)}</b>. Click it, then sign in here.`, 'ok');
      } else if (mode === 'forgot') {
        await Cloud.resetPassword(email);
        show('signin', `If an account exists for <b>${U.esc(email)}</b>, a reset link is on its way.`, 'ok');
      } else if (mode === 'recover') {
        await Cloud.updatePassword(pass);
        const s = await Cloud.session();
        App.toast('Password updated');
        if (s) await enter(s.user); else show('signin', 'Password updated — sign in with your new password.', 'ok');
      }
    } catch (err) {
      btn.disabled = false; btn.textContent = label;
      let m = err.message || 'Something went wrong.';
      if (/invalid login/i.test(m)) m = 'Wrong email or password.';
      if (/email not confirmed/i.test(m)) m = 'Please confirm your email first — check your inbox for the link.';
      if (/already registered/i.test(m)) m = 'An account with this email already exists. Sign in instead.';
      show(mode, U.esc(m), 'err');
    }
  }

  async function enter(user) {
    screen().hidden = true;
    screen().innerHTML = '';
    document.getElementById('app').style.display = '';
    document.getElementById('view').innerHTML = '<div class="empty">Loading your journal…</div>';
    await Cloud.loadForUser(user);
    if (!booted) { booted = true; App.boot(); } else { App.loadFilters(); App.refreshFilters(); App.render(); }
    const who = document.getElementById('userEmail'); if (who) who.textContent = user.email;
  }

  async function start() {
    let s = null;
    try {
      Cloud.onAuth((event, sess) => {
        if (event === 'PASSWORD_RECOVERY') show('recover');
      });
      s = await Cloud.session();
    } catch (e) {
      screen().hidden = false;
      document.getElementById('app').style.display = 'none';
      screen().innerHTML = `<div class="auth-card"><h2>Can't connect</h2><div class="result-box err">${U.esc(e.message)}</div><button class="btn primary auth-submit" onclick="location.reload()">Try again</button></div>`;
      return;
    }
    // Clean the ?code=… left in the address bar after email links.
    if (/[?&]code=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
    if (mode === 'recover') return;
    if (s) await enter(s.user); else show('signin');
  }

  return { start, show };
})();
