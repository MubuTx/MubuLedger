    const legend = lanes.length ? `<div class="run-legend">
        ${lanes.map(r => {
          const sm = Runs.summary(r); const stl = Runs.statusLabel(r);
          const lastType = (r.stages[r.stages.length - 1] || {}).type || 'Eval';
          return `<a class="run-chip" href="#/runs?id=${r.id}" title="Open run"><span class="run-swatch st-${lastType.toLowerCase()}" style="--rc:${r.color}"></span><b>${U.esc(r.name)}</b><span class="pill ${stl.cls}">${stl.text}</span>${(() => { const cs = sm.stages[sm.stages.length - 1]; return cs ? `<span class="${U.cls(cs.net)}" title="${cs.type} P&L">${cs.type} ${U.moneyShort(cs.net)}</span>` : ''; })()}</a>`;
        }).join('')}
        <span class="run-key"><span class="run-swatch st-eval" style="--rc:#6B7290"></span>Eval <span class="run-swatch st-funded" style="--rc:#6B7290"></span>Funded <i class="run-promo static"></i>Promoted <i class="run-pay static">$</i>Payout</span>
      </div>` : `<div class="run-legend empty"><span class="help">Group an eval and the funded account it became into one <b>run</b> to see your whole progression here.</span><a class="btn sm" href="#/runs">Set up runs</a></div>`;
    container.innerHTML = `
      <div class="cal-head">
        <button class="btn sm ghost" data-nav="-1">‹</button>
        <div class="month">${U.MONTHS[m - 1]} ${y}</div>
        <button class="btn sm ghost" data-nav="1">›</button>
        <button class="btn sm" data-nav="0">This month</button>
        <div class="stats">Monthly stats: <span class="chip ${U.cls(monthNet)}">${U.moneyShort(monthNet)}</span><span class="chip">${monthDays} day${monthDays === 1 ? '' : 's'}</span></div>
      </div>
      <div class="cal" style="--run-pad:${lanes.length ? 8 + lanes.length * 7 : 6}px">${html}</div>
      ${legend}`;
    U.$$('[data-nav]', container).forEach(b => b.onclick = () => {
      const n = +b.dataset.nav;
      let key;
      if (n === 0) key = U.todayKey().slice(0, 7);
      else { const d = new Date(y, m - 1 + n, 1); key = `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}`; }
      onNav && onNav(key);
    });
    U.$$('[data-day]', container).forEach(c => c.onclick = () => onDay && onDay(c.dataset.day));
  }

  /* ---------- Rule-checklist heatmap (last 12 weeks) ---------- */
  function heatmap(tradedDays) {
    const rules = Store.data.settings.rules;
    const today = U.todayKey();
    const endSat = U.addDays(U.weekStart(today), 6);
    const start = U.addDays(endSat, -12 * 7 + 1);
    let grid = '', lastMonth = '';
    for (let w = 0; w < 12; w++) {
      const colStart = U.addDays(start, w * 7);
      const mo = U.MONTHS[+colStart.slice(5, 7) - 1].slice(0, 3);
      grid += `<div class="m">${mo !== lastMonth ? mo : ''}</div>`; lastMonth = mo;
      for (let d = 0; d < 7; d++) {
        const key = U.addDays(colStart, d);
        if (key > today) { grid += '<div class="heat-cell future"></div>'; continue; }
        const done = (Store.data.checks[key] || []).filter(id => rules.some(r => r.id === id)).length;
        const frac = rules.length ? done / rules.length : 0;
        const lvl = frac === 0 ? 0 : frac <= .25 ? 1 : frac <= .5 ? 2 : frac < 1 ? 3 : 4;
        grid += `<div class="heat-cell l${lvl} ${tradedDays.has(key) ? 'traded' : ''}" title="${U.fmtLong(key)} — ${done}/${rules.length} rules${tradedDays.has(key) ? ' · traded' : ''}"></div>`;
      }
    }
    return `<div class="heat"><div class="heat-days"><span></span>${U.DOW.map(d => `<span>${d}</span>`).join('')}</div><div class="heat-grid">${grid}</div></div>
      <div class="heat-legend">Less <span class="heat-cell"></span><span class="heat-cell l1"></span><span class="heat-cell l2"></span><span class="heat-cell l3"></span><span class="heat-cell l4"></span> More</div>`;
  }

  /* ---------- Modal ---------- */
  function modal({ title, body, footer = [], wide = false, onClose }) {
    const root = U.$('#modalRoot');
    root.innerHTML = `<div class="modal-backdrop"><div class="modal ${wide ? 'wide' : ''}">
      <div class="modal-head"><h3>${U.esc(title)}</h3><button class="icon-btn" data-close>×</button></div>
      <div class="modal-body"></div><div class="modal-foot"></div></div></div>`;
    const bodyEl = U.$('.modal-body', root), footEl = U.$('.modal-foot', root);
    if (typeof body === 'string') bodyEl.innerHTML = body; else bodyEl.appendChild(body);
    const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', esc); onClose && onClose(); };
    const esc = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', esc);
    footer.forEach(b => {
      const btn = U.h(`<button class="btn ${b.cls || ''}">${U.esc(b.label)}</button>`);
      btn.onclick = () => b.onClick ? b.onClick(close, bodyEl) : close();
      footEl.appendChild(btn);
    });
    if (!footer.length) footEl.remove();
    U.$('[data-close]', root).onclick = close;
    U.$('.modal-backdrop', root).addEventListener('mousedown', e => { if (e.target.classList.contains('modal-backdrop')) close(); });
    return { close, bodyEl };
  }

  function confirm(title, msg, label = 'Confirm', danger = true) {
    return new Promise(res => {
      modal({ title, body: `<p style="margin:0;line-height:1.6">${msg}</p>`, footer: [
        { label: 'Cancel', onClick: c => { res(false); c(); } },
        { label, cls: danger ? 'danger' : 'primary', onClick: c => { res(true); c(); } },
      ], onClose: () => res(false) });
    });
  }

  /* ---------- Trade detail / edit ---------- */
  function tradeModal(id, onChange) {
    const t = Store.data.trades.find(x => x.id === id);
    if (!t) return;
    const n = M.net(t);
    let rating = t.rating || 0;
    const setups = Store.setups();
    const body = U.h(`<div>
      <div class="detail-grid">
        <div><div class="k">Symbol</div><div class="v">${U.esc(t.symbol)}</div></div>
        <div><div class="k">Side</div><div class="v"><span class="side ${t.side.toLowerCase()}">${t.side}</span></div></div>
        <div><div class="k">Account</div><div class="v">${U.esc(t.account)}</div></div>
        <div><div class="k">Opened</div><div class="v">${U.fmtDateTime(t.entryTime)}</div></div>
        <div><div class="k">Closed</div><div class="v">${U.fmtDateTime(t.exitTime)}</div></div>
        <div><div class="k">Duration</div><div class="v">${U.duration(M.holdSec(t))}</div></div>
        <div><div class="k">Qty</div><div class="v">${t.qty}</div></div>
        <div><div class="k">Entry</div><div class="v">${U.price(t.entryPrice)}</div></div>
        <div><div class="k">Exit</div><div class="v">${U.price(t.exitPrice)}</div></div>
        <div><div class="k">Gross P&amp;L</div><div class="v ${U.cls(t.gross)}">${U.money(t.gross)}</div></div>
        <div><div class="k">Commissions</div><div class="v">${U.money(M.fees(t))}</div></div>
        <div><div class="k">Net P&amp;L</div><div class="v ${U.cls(n)}">${U.money(n)}</div></div>
      </div>
      <div class="form-row">
        <div><label class="field-label">Setup / playbook</label>
          <input class="inp" id="tmSetup" list="tmSetups" value="${U.esc(t.setup || '')}" placeholder="e.g. Opening drive, Liquidity sweep">
          <datalist id="tmSetups">${setups.map(s => `<option value="${U.esc(s)}">`).join('')}</datalist></div>
        <div><label class="field-label">Tags (comma separated)</label>
          <input class="inp" id="tmTags" value="${U.esc((t.tags || []).join(', '))}" placeholder="A+, FOMO, early exit"></div>
      </div>
      <div style="margin-bottom:14px"><label class="field-label">Execution rating</label>
        <div class="stars" id="tmStars">${[1, 2, 3, 4, 5].map(i => `<button data-v="${i}" class="${i <= rating ? 'on' : ''}">★</button>`).join('')}</div></div>
      <label class="field-label">Trade notes</label>
      <textarea class="notes" id="tmNotes" placeholder="Why did you take it? What did you see? What would you do differently?">${U.esc(t.notes || '')}</textarea>
    </div>`);
    U.$$('#tmStars button', body).forEach(b => b.onclick = () => {
      rating = +b.dataset.v === rating ? 0 : +b.dataset.v;
      U.$$('#tmStars button', body).forEach(x => x.classList.toggle('on', +x.dataset.v <= rating));
    });
    modal({
      title: `${t.symbol} · ${U.fmtLong(U.dayKey(t.entryTime))}`, body, wide: true,
      footer: [
        { label: 'Delete trade', cls: 'danger left', onClick: async c => {
          c();
          if (await confirm('Delete trade?', 'This removes the trade from your journal. Re-importing the same CSV would bring it back.', 'Delete')) {
            Store.deleteTrades([t.id]); App.toast('Trade deleted'); onChange && onChange();
          }
        } },
        { label: 'Cancel' },
        { label: 'Save', cls: 'primary', onClick: c => {
          Store.updateTrade(t.id, {
            setup: U.$('#tmSetup', body).value.trim(),
            tags: U.$('#tmTags', body).value.split(',').map(s => s.trim()).filter(Boolean),
            notes: U.$('#tmNotes', body).value, rating,
          });
          c(); App.toast('Trade saved'); onChange && onChange();
        } },
      ],
    });
  }

  function checklistHTML(day) {
    const done = new Set(Store.data.checks[day] || []);
    const rules = Store.data.settings.rules;
    if (!rules.length) return '<div class="help">No rules yet — add your trading rules in Settings.</div>';
    return `<div class="checklist" data-day="${day}">${rules.map(r => `<label><input type="checkbox" value="${r.id}" ${done.has(r.id) ? 'checked' : ''}> <span>${U.esc(r.text)}</span></label>`).join('')}</div>`;
  }
  function bindChecklist(el, onChange) {
    U.$$('.checklist', el).forEach(list => {
      list.addEventListener('change', () => {
        const ids = U.$$('input:checked', list).map(i => i.value);
        Store.setChecks(list.dataset.day, ids);
        onChange && onChange();
      });
    });
  }

  function checklistModal(day, onChange) {
    const body = U.h(`<div><div class="help" style="margin-bottom:10px">${U.fmtLong(day)}</div>${checklistHTML(day)}</div>`);
    bindChecklist(body);
    modal({ title: 'Daily checklist', body, footer: [{ label: 'Done', cls: 'primary', onClick: c => { c(); onChange && onChange(); } }] });
  }

  function emptyState(title = 'No trades yet', msg = 'Import your Tradovate CSV to start building your journal.') {
    return `<div class="card"><div class="empty">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#5867D6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg>
      <h3>${title}</h3><div>${msg}</div>
      <div class="actions"><a class="btn primary" href="#/import">Import CSV</a><button class="btn" data-demo>Load demo data</button></div>
    </div></div>`;
  }

  return { info, kpiRow, calendar, heatmap, modal, confirm, tradeModal, checklistHTML, bindChecklist, checklistModal, emptyState };
})();

</script>
  <script>
window.Views = window.Views || {};

Views.dashboard = {
  title: 'Dashboard',
  render(el) {
    const trades = App.filtered();
    if (!Store.data.trades.length) { el.innerHTML = UI.emptyState(); return; }
    const s = M.summarize(trades);
    const cum = M.cumulative(s.days);
    const labels = cum.map(c => U.fmtShort(c.key));
    const sc = M.score(s);
    const today = U.todayKey();
    const rules = Store.data.settings.rules;
    const todayDone = (Store.data.checks[today] || []).filter(id => rules.some(r => r.id === id)).length;
    const tradedDays = new Set(s.days.map(d => d.key));

    el.innerHTML = `
      ${UI.kpiRow(s)}
      <div class="grid g-3">
        <div class="card"><div class="card-head"><h3>Mubu score</h3>${UI.info('Composite of win %, profit factor, avg win/loss, recovery factor, max drawdown and consistency (share of profit from your best day).')}</div>
          <div class="card-body score-wrap">
            <div class="chart-box" style="height:250px"><canvas id="cRadar"></canvas></div>
            <div class="score-foot">
              <div><div class="sublabel">Your Mubu score</div><div class="big">${sc.total.toFixed(2)}</div></div>
              <div class="score-scale"><div class="score-track"><div class="marker" style="left:${sc.total}%"></div></div>
                <div class="score-ticks"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span></div></div>
            </div>
          </div></div>
        <div class="card"><div class="card-head"><h3>Progress tracker</h3>${UI.info('Daily rule checklist completion over the last 12 weeks. Outlined squares = days you traded.')}
          <div class="right"><a href="#/settings" class="btn sm ghost">Edit rules</a></div></div>
          <div class="card-body">
            ${UI.heatmap(tradedDays)}
            <div class="today-score">
              <div><div class="help">Today's score</div><div class="big">${todayDone}/${rules.length}</div></div>
              <div class="progress"><div style="width:${rules.length ? todayDone / rules.length * 100 : 0}%"></div></div>
              <button class="btn sm" id="btnChecklist" style="margin-left:auto">Daily checklist</button>
            </div>
          </div></div>
        <div class="card"><div class="card-head"><h3>Daily net cumulative P&amp;L</h3>${UI.info('Running total of net P&L by trading day.')}</div>
          <div class="card-body"><div class="chart-box" style="height:330px">${cum.length ? '<canvas id="cCum"></canvas>' : '<div class="no-data">No trades in this range</div>'}</div></div></div>
      </div>

      <div class="grid g-3">
        <div class="card"><div class="card-head"><h3>Net daily P&amp;L</h3>${UI.info('Net P&L per trading day.')}</div>
          <div class="card-body"><div class="chart-box">${cum.length ? '<canvas id="cDaily"></canvas>' : '<div class="no-data">No data</div>'}</div></div></div>
        <div class="card"><div class="tabs" id="rtTabs"><button class="active" data-t="recent">Recent trades</button><button data-t="best">Best / worst</button></div>
          <div class="table-wrap" id="rtBody" style="max-height:300px;overflow-y:auto"></div></div>
        <div class="card"><div class="card-head"><h3>Account balance</h3>${UI.info('Starting balance (Settings) + cumulative net P&L for the selected account(s).')}</div>
          <div class="card-body"><div class="chart-box" id="balBox"></div></div></div>
      </div>

      <div class="grid g-cal">
        <div class="card" id="calWrap"></div>
        <div class="stack">
          <div class="card"><div class="card-head"><h3>Drawdown</h3>${UI.info('Distance below the running equity peak, by day.')}</div>
            <div class="card-body"><div class="chart-box sm">${cum.length ? '<canvas id="cDD"></canvas>' : '<div class="no-data">No data</div>'}</div></div></div>
          <div class="card"><div class="card-head"><h3>Trade time performance</h3>${UI.info('Each dot is a trade: entry time of day vs net P&L.')}</div>
            <div class="card-body"><div class="chart-box sm">${trades.length ? '<canvas id="cTime"></canvas>' : '<div class="no-data">No data</div>'}</div></div></div>
        </div>
      </div>`;

    Charts.radar(U.$('#cRadar', el), Object.keys(sc.parts), Object.values(sc.parts));
    if (cum.length) {
      Charts.area(U.$('#cCum', el), labels, cum.map(c => +c.cum.toFixed(2)));
      Charts.bars(U.$('#cDaily', el), labels, cum.map(c => +c.net.toFixed(2)));
      Charts.drawdown(U.$('#cDD', el), labels, cum.map(c => +c.dd.toFixed(2)));
    }
    if (trades.length) Charts.timeScatter(U.$('#cTime', el), trades);

    // Balance
    const accts = App.filters.account === 'all' ? [...new Set(trades.map(t => t.account))] : [App.filters.account];
    const bals = Store.data.settings.startingBalances;
    const known = accts.filter(a => bals[a] !== undefined && bals[a] !== '');
    const balBox = U.$('#balBox', el);
    if (!known.length || !cum.length) {
      balBox.innerHTML = `<div class="no-data"><div>No account balance data to show here.<br>Add a starting balance in <a href="#/settings">Settings</a>.</div></div>`;
    } else {
      const start = known.reduce((a, k) => a + (+bals[k] || 0), 0);
      const tradesK = trades.filter(t => known.includes(t.account));
      const ck = M.cumulative(M.days(tradesK));
      balBox.innerHTML = '<canvas></canvas>';
      Charts.lineSeries(U.$('canvas', balBox), ck.map(c => U.fmtShort(c.key)), ck.map(c => +(start + c.cum).toFixed(2)), { color: Charts.C.navy });
    }

    // Recent / best-worst
    const rtBody = U.$('#rtBody', el);
    const renderRT = mode => {
      let list;
      if (mode === 'recent') list = [...trades].sort(M.byTime).reverse().slice(0, 12);
      else { const sorted = [...trades].sort((a, b) => M.net(b) - M.net(a)); list = [...sorted.slice(0, 6), ...sorted.slice(-6).reverse()].filter((v, i, a) => a.indexOf(v) === i); }
      rtBody.innerHTML = `<table class="tbl"><thead><tr><th>Close date</th><th>Symbol</th><th>Side</th><th class="num">Net P&amp;L</th></tr></thead><tbody>
        ${list.map(t => { const n = M.net(t); return `<tr class="clickable" data-id="${t.id}"><td>${U.fmtDate(U.dayKey(t.exitTime))}</td><td><b>${U.esc(t.symbol)}</b></td><td><span class="side ${t.side.toLowerCase()}">${t.side}</span></td><td class="num ${U.cls(n)}">${U.money(n)}</td></tr>`; }).join('') || '<tr class="empty-row"><td colspan="4">No trades</td></tr>'}
        </tbody></table>`;
      U.$$('tr[data-id]', rtBody).forEach(r => r.onclick = () => UI.tradeModal(r.dataset.id, () => App.render()));
    };
    renderRT('recent');
    U.$$('#rtTabs button', el).forEach(b => b.onclick = () => {
      U.$$('#rtTabs button', el).forEach(x => x.classList.toggle('active', x === b)); renderRT(b.dataset.t);
    });

    // Calendar
    if (!App.calMonth) App.calMonth = (s.days.length ? s.days[s.days.length - 1].key : today).slice(0, 7);
    const drawCal = () => UI.calendar(U.$('#calWrap', el), trades, App.calMonth, {
      onNav: k => { App.calMonth = k; drawCal(); },
      onDay: d => { location.hash = `#/journal?day=${d}`; },
    });
    drawCal();

    U.$('#btnChecklist', el).onclick = () => UI.checklistModal(today, () => App.render());
  },
};

</script>
  <script>
window.Views = window.Views || {};

Views.journal = {
  title: 'Daily Journal',
  pageSize: 10,
  shown: 10,
  open: new Set(),
  miniMonth: null,

  render(el, params) {
    const trades = App.filtered();
    if (!Store.data.trades.length) { el.innerHTML = UI.emptyState(); return; }
    const days = M.days(trades).reverse();
    const target = params.day;
    if (target) {
      const idx = days.findIndex(d => d.key === target);
      if (idx >= 0) { this.shown = Math.max(this.shown, Math.ceil((idx + 1) / this.pageSize) * this.pageSize); this.open.add(target); }
      this.miniMonth = target.slice(0, 7);
    }
    if (!this.open.size && days.length) days.slice(0, 3).forEach(d => this.open.add(d.key));
    if (!this.miniMonth) this.miniMonth = (days[0] ? days[0].key : U.todayKey()).slice(0, 7);

    // Days with notes but no trades still deserve a card (e.g. a "no trade" day)
    const noteOnly = Object.keys(Store.data.notes).filter(k => !days.some(d => d.key === k) && App.inRange(k)).map(k => ({ key: k, trades: [], net: 0, noteOnly: true }));
    const all = [...days, ...noteOnly].sort((a, b) => a.key < b.key ? 1 : -1);
    const visible = all.slice(0, this.shown);

    el.innerHTML = `
      <div class="journal-layout">
        <div>
          <div class="toolbar">
            <button class="btn sm" id="jCollapse">Collapse all</button>
            <button class="btn sm" id="jExpand">Expand all</button>
            <div class="right">
              <input type="date" class="inp" id="jNoteDay" value="${U.todayKey()}" style="width:auto">
              <button class="btn sm primary" id="jStart">Start my day</button>
            </div>
          </div>
          <div id="jDays">${visible.length ? visible.map(d => this.dayCard(d)).join('') : '<div class="card"><div class="empty">No trading days in this date range.</div></div>'}</div>
          ${all.length > this.shown ? `<div style="text-align:center;margin-top:8px"><button class="btn" id="jMore">Load more days (${all.length - this.shown} left)</button></div>` : ''}
        </div>
        <div class="journal-side">
          <div class="card mini-cal" id="jMini"></div>
          <div class="card"><div class="card-head"><h3>Period summary</h3></div><div class="card-body list-rows" id="jSum"></div></div>
        </div>
      </div>`;

    const s = M.summarize(trades);
    U.$('#jSum', el).innerHTML = [
      ['Trading days', s.dayCount], ['Net P&L', `<span class="${U.cls(s.total)}">${U.money(s.total)}</span>`],
      ['Avg day', `<span class="${U.cls(s.avgDay)}">${U.money(s.avgDay)}</span>`], ['Best day', `<span class="pos">${U.money(s.bestDay)}</span>`],
      ['Worst day', `<span class="neg">${U.money(s.worstDay)}</span>`], ['Day win %', U.pct(s.dayWinRate)],
    ].map(([k, v]) => `<div class="row"><span class="help" style="flex:1">${k}</span><b>${v}</b></div>`).join('');

    this.drawMini(el, days);
    visible.forEach(d => { if (this.open.has(d.key)) this.fillBody(el, d); });

    U.$$('.day-head', el).forEach(h => h.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      const card = h.parentElement, key = card.dataset.day;
      const d = all.find(x => x.key === key);
      if (card.classList.toggle('open')) { this.open.add(key); this.fillBody(el, d); }
      else { this.open.delete(key); Charts.destroyIn(card); }
    }));
    U.$$('[data-addnote]', el).forEach(b => b.onclick = () => {
      const card = b.closest('.day-card'); const key = card.dataset.day;
      if (!card.classList.contains('open')) { card.classList.add('open'); this.open.add(key); this.fillBody(el, all.find(x => x.key === key)); }
      setTimeout(() => U.$('textarea', card)?.focus(), 50);
    });
    U.$('#jCollapse', el).onclick = () => { this.open.clear(); App.render(); };
    U.$('#jExpand', el).onclick = () => { visible.forEach(d => this.open.add(d.key)); App.render(); };
    const more = U.$('#jMore', el); if (more) more.onclick = () => { this.shown += this.pageSize; App.render(); };
    U.$('#jStart', el).onclick = () => {
      const key = U.$('#jNoteDay', el).value || U.todayKey();
      this.open.add(key);
      if (!Store.data.notes[key]) Store.setNote(key, `Pre-market plan (${U.fmtLong(key)})\n- Bias:\n- Key levels:\n- News/events:\n- Max loss today:\n\nPost-session review\n- `);
      App.go(`#/journal?day=${key}`);
    };
    if (target) setTimeout(() => document.getElementById('day-' + target)?.scrollIntoView({ behavior: 'smooth' }), 60);
  },

  dayCard(d) {
    const open = this.open.has(d.key);
    return `<div class="card day-card ${open ? 'open' : ''}" id="day-${d.key}" data-day="${d.key}">
      <div class="day-head">
        <span class="chev"><svg width="12" height="12" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
        <span class="date">${U.fmtLong(d.key)}</span><span class="dot"></span>
        ${d.noteOnly ? '<span class="help">No trades — notes only</span>' : `<span class="net ${U.cls(d.net)}">Net P&amp;L ${U.money(d.net)}</span>`}
        ${Store.data.notes[d.key] ? '<span class="tag">Note</span>' : ''}
        <div class="right"><button class="btn sm" data-addnote>✎ ${Store.data.notes[d.key] ? 'Edit note' : 'Add note'}</button></div>
      </div>
      <div class="day-body"></div>
    </div>`;
  },

  fillBody(el, d) {
    const card = document.getElementById('day-' + d.key);
    if (!card) return;
    const body = U.$('.day-body', card);
    Charts.destroyIn(card);
    const list = d.trades;
    const fees = list.reduce((a, t) => a + M.fees(t), 0);
    const pf = d.gl ? d.gw / d.gl : (d.gw ? Infinity : 0);
    body.innerHTML = `
      ${list.length ? `<div class="day-top">
        <div class="chart-box sm"><canvas></canvas></div>
        <div class="stat-grid">
          <div class="s"><div class="k">Total trades</div><div class="v">${list.length}</div></div>
          <div class="s"><div class="k">Winners</div><div class="v">${d.wins}</div></div>
          <div class="s"><div class="k">Gross P&amp;L</div><div class="v ${U.cls(d.gross)}">${U.money(d.gross)}</div></div>
          <div class="s"><div class="k">Commissions</div><div class="v">${U.money(fees)}</div></div>
          <div class="s"><div class="k">Winrate</div><div class="v">${U.pct(d.winRate, 0)}</div></div>
          <div class="s"><div class="k">Losers</div><div class="v">${d.losses}</div></div>
          <div class="s"><div class="k">Volume</div><div class="v">${d.volume}</div></div>
          <div class="s"><div class="k">Profit factor</div><div class="v">${U.num(pf)}</div></div>
        </div>
      </div>
      <div class="table-wrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th class="num">Qty</th><th class="num">Entry</th><th class="num">Exit</th><th>Duration</th><th>Setup</th><th class="num">Net P&amp;L</th></tr></thead><tbody>
        ${list.map(t => { const n = M.net(t); return `<tr class="clickable" data-id="${t.id}"><td>${U.fmtTime(t.entryTime)}</td><td><b>${U.esc(t.symbol)}</b></td><td><span class="side ${t.side.toLowerCase()}">${t.side}</span></td><td class="num">${t.qty}</td><td class="num">${U.price(t.entryPrice)}</td><td class="num">${U.price(t.exitPrice)}</td><td>${U.duration(M.holdSec(t))}</td><td>${t.setup ? `<span class="tag">${U.esc(t.setup)}</span>` : ''}</td><td class="num ${U.cls(n)}"><b>${U.money(n)}</b></td></tr>`; }).join('')}
      </tbody></table></div>` : ''}
      <div class="day-notes">
        <div><label class="field-label">Journal notes <span class="saved-hint">Saved</span></label>
          <textarea class="notes" placeholder="Plan, mindset, what went right, what to fix tomorrow…">${U.esc(Store.data.notes[d.key] || '')}</textarea></div>
        <div><label class="field-label">Rules checklist</label>${UI.checklistHTML(d.key)}</div>
      </div>`;

    if (list.length) {
      let c = 0;
      const pts = [{ t: 'Start', v: 0 }, ...list.map(t => { c += M.net(t); return { t: U.fmtTime(t.exitTime), v: +c.toFixed(2) }; })];
      Charts.area(U.$('canvas', body), pts.map(p => p.t), pts.map(p => p.v));
    }
    const ta = U.$('textarea', body), hint = U.$('.saved-hint', body);
    const save = U.debounce(() => { Store.setNote(d.key, ta.value); hint.classList.add('show'); setTimeout(() => hint.classList.remove('show'), 1200); }, 500);
    ta.addEventListener('input', save);
    UI.bindChecklist(body);
    U.$$('tr[data-id]', body).forEach(r => r.onclick = () => UI.tradeModal(r.dataset.id, () => App.render()));
  },

  drawMini(el, days) {
    const box = U.$('#jMini', el);
    const [y, m] = this.miniMonth.split('-').map(Number);
    const first = new Date(y, m - 1, 1).getDay(), n = new Date(y, m, 0).getDate();
    const map = new Map(days.map(d => [d.key, d]));
    let cells = U.DOW.map(d => `<div class="dw">${d.slice(0, 2)}</div>`).join('');
    for (let i = 0; i < first; i++) cells += '<div class="md blank"></div>';
    for (let dn = 1; dn <= n; dn++) {
      const key = `${y}-${U.pad(m)}-${U.pad(dn)}`, d = map.get(key);
      const c = d ? (d.net > 0 ? 'win' : d.net < 0 ? 'loss' : 'be') : '';
      cells += `<div class="md ${c}" ${d ? `data-day="${key}" title="${U.money(d.net)}"` : ''}>${dn}</div>`;
    }
    box.innerHTML = `<div class="mh"><button class="btn sm ghost" data-m="-1">‹</button><span>${U.MONTHS[m - 1]} ${y}</span><button class="btn sm ghost" data-m="1">›</button></div><div class="mini-grid">${cells}</div>`;
    U.$$('[data-m]', box).forEach(b => b.onclick = () => {
      const d = new Date(y, m - 1 + +b.dataset.m, 1);
      this.miniMonth = `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}`; this.drawMini(el, days);
    });
    U.$$('[data-day]', box).forEach(c => c.onclick = () => App.go(`#/journal?day=${c.dataset.day}`));
  },
};

</script>
  <script>
window.Views = window.Views || {};

Views.trades = {
  title: 'Trade Log',
  sort: { key: 'entryTime', dir: -1 },
  page: 0,
  perPage: 50,
  search: '',
  result: 'all',
  side: 'all',
  selected: new Set(),

  cols: [
    { key: 'entryTime', label: 'Open date', val: t => t.entryTime },
    { key: 'symbol', label: 'Symbol', val: t => t.symbol },
    { key: 'status', label: 'Status', val: t => M.net(t) },
    { key: 'side', label: 'Side', val: t => t.side },
    { key: 'exitTime', label: 'Close date', val: t => t.exitTime },
    { key: 'qty', label: 'Qty', val: t => t.qty, num: true },
    { key: 'entryPrice', label: 'Entry price', val: t => t.entryPrice, num: true },
    { key: 'exitPrice', label: 'Exit price', val: t => t.exitPrice, num: true },
    { key: 'net', label: 'Net P&L', val: t => M.net(t), num: true },
    { key: 'dur', label: 'Duration', val: t => M.holdSec(t), num: true },
    { key: 'setup', label: 'Setup', val: t => t.setup || '' },
    { key: 'account', label: 'Account', val: t => t.account },
  ],

  rows() {
    let list = App.filtered();
    const q = this.search.trim().toLowerCase();
    if (q) list = list.filter(t => [t.symbol, t.setup, t.account, t.notes, (t.tags || []).join(' '), U.fmtDate(U.dayKey(t.entryTime))].join(' ').toLowerCase().includes(q));
    if (this.result !== 'all') list = list.filter(t => { const n = M.net(t); return this.result === 'win' ? n > 0 : this.result === 'loss' ? n < 0 : n === 0; });
    if (this.side !== 'all') list = list.filter(t => t.side === this.side);
    const col = this.cols.find(c => c.key === this.sort.key) || this.cols[0];
    const dir = this.sort.dir;
    return [...list].sort((a, b) => { const x = col.val(a), y = col.val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  },

  render(el) {
    if (!Store.data.trades.length) { el.innerHTML = UI.emptyState(); return; }
    const s = M.summarize(App.filtered());
    el.innerHTML = `
      ${UI.kpiRow(s, { compact: true })}
      <div class="card">
        <div class="card-head" style="flex-wrap:wrap">
          <input class="inp" id="tlSearch" placeholder="Search symbol, setup, tag, note, date…" value="${U.esc(this.search)}" style="max-width:300px">
          <select class="inp" id="tlResult" style="width:auto">
            <option value="all">All results</option><option value="win">Winners</option><option value="loss">Losers</option><option value="be">Break-even</option></select>
          <select class="inp" id="tlSide" style="width:auto"><option value="all">Long &amp; short</option><option value="Long">Long</option><option value="Short">Short</option></select>
          <div class="right">
            <span class="help" id="tlSelInfo"></span>
            <button class="btn sm danger" id="tlDelete" disabled>Delete selected</button>
            <button class="btn sm" id="tlExport">Export CSV</button>
          </div>
        </div>
        <div class="table-wrap" id="tlTable"></div>
        <div class="card-body" id="tlPager" style="display:flex;gap:8px;align-items:center;justify-content:flex-end"></div>
      </div>`;
    U.$('#tlResult', el).value = this.result;
    U.$('#tlSide', el).value = this.side;
    U.$('#tlSearch', el).addEventListener('input', U.debounce(e => { this.search = e.target.value; this.page = 0; this.drawTable(el); }, 200));
    U.$('#tlResult', el).onchange = e => { this.result = e.target.value; this.page = 0; this.drawTable(el); };
    U.$('#tlSide', el).onchange = e => { this.side = e.target.value; this.page = 0; this.drawTable(el); };
    U.$('#tlDelete', el).onclick = async () => {
      const n = this.selected.size;
      if (await UI.confirm(`Delete ${n} trade${n > 1 ? 's' : ''}?`, 'They will be removed from the journal. Re-importing the same CSV would bring them back.', 'Delete')) {
        Store.deleteTrades([...this.selected]); this.selected.clear(); App.toast(`${n} trade(s) deleted`); App.render();
      }
    };
    U.$('#tlExport', el).onclick = () => this.exportCSV(this.rows());
    this.drawTable(el);
  },

  drawTable(el) {
    const rows = this.rows();
    const pages = Math.max(1, Math.ceil(rows.length / this.perPage));
    this.page = Math.min(this.page, pages - 1);
    const slice = rows.slice(this.page * this.perPage, (this.page + 1) * this.perPage);
    const arrow = k => this.sort.key === k ? (this.sort.dir > 0 ? ' ▲' : ' ▼') : '';
    const allChecked = slice.length && slice.every(t => this.selected.has(t.id));
    U.$('#tlTable', el).innerHTML = `<table class="tbl"><thead><tr>
      <th class="c"><input type="checkbox" id="tlAll" ${allChecked ? 'checked' : ''}></th>
      ${this.cols.map(c => `<th class="sortable ${c.num ? 'num' : ''}" data-k="${c.key}">${c.label}${arrow(c.key)}</th>`).join('')}
      </tr></thead><tbody>
      ${slice.map(t => {
        const n = M.net(t);
        const st = n > 0 ? 'win' : n < 0 ? 'loss' : 'be';
        return `<tr class="clickable" data-id="${t.id}">
          <td class="c"><input type="checkbox" class="tlChk" value="${t.id}" ${this.selected.has(t.id) ? 'checked' : ''}></td>
          <td>${U.fmtDate(U.dayKey(t.entryTime))} <span class="help">${U.fmtTime(t.entryTime)}</span></td>
          <td><b>${U.esc(t.symbol)}</b></td>
          <td><span class="status ${st}">${st === 'be' ? 'BE' : st.toUpperCase()}</span></td>
          <td><span class="side ${t.side.toLowerCase()}">${t.side}</span></td>
          <td>${U.fmtDate(U.dayKey(t.exitTime))} <span class="help">${U.fmtTime(t.exitTime)}</span></td>
          <td class="num">${t.qty}</td>
          <td class="num">${U.price(t.entryPrice)}</td>
          <td class="num">${U.price(t.exitPrice)}</td>
          <td class="num ${U.cls(n)}"><b>${U.money(n)}</b></td>
          <td class="num">${U.duration(M.holdSec(t))}</td>
          <td>${t.setup ? `<span class="tag">${U.esc(t.setup)}</span>` : ''}${(t.tags || []).slice(0, 2).map(x => `<span class="tag" style="background:#F1F3F9;color:#3A4260">${U.esc(x)}</span>`).join('')}${t.notes ? ' 📝' : ''}</td>
          <td class="help">${U.esc(t.account)}</td>
        </tr>`;
      }).join('') || `<tr class="empty-row"><td colspan="${this.cols.length + 1}">No trades match.</td></tr>`}
      </tbody></table>`;
    U.$('#tlPager', el).innerHTML = `<span class="help">${rows.length} trade${rows.length === 1 ? '' : 's'} · page ${this.page + 1} of ${pages}</span>
      <button class="btn sm" data-p="-1" ${this.page === 0 ? 'disabled' : ''}>‹ Prev</button><button class="btn sm" data-p="1" ${this.page >= pages - 1 ? 'disabled' : ''}>Next ›</button>`;

    U.$$('th[data-k]', el).forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      this.sort = { key: k, dir: this.sort.key === k ? -this.sort.dir : -1 }; this.drawTable(el);
    });
    U.$$('[data-p]', el).forEach(b => b.onclick = () => { this.page += +b.dataset.p; this.drawTable(el); });
    U.$$('tr[data-id]', el).forEach(r => r.addEventListener('click', e => {
      if (e.target.closest('input')) return;
      UI.tradeModal(r.dataset.id, () => App.render());
    }));
    const updateSel = () => {
      U.$('#tlDelete', el).disabled = !this.selected.size;
      U.$('#tlSelInfo', el).textContent = this.selected.size ? `${this.selected.size} selected` : '';
    };
    U.$$('.tlChk', el).forEach(c => c.onchange = () => { c.checked ? this.selected.add(c.value) : this.selected.delete(c.value); updateSel(); });
    U.$('#tlAll', el).onchange = e => { slice.forEach(t => e.target.checked ? this.selected.add(t.id) : this.selected.delete(t.id)); this.drawTable(el); };
    updateSel();
  },

  exportCSV(list) {
    const head = ['Account', 'Symbol', 'Side', 'Qty', 'Entry Time', 'Exit Time', 'Entry Price', 'Exit Price', 'Gross P&L', 'Fees', 'Net P&L', 'Setup', 'Tags', 'Rating', 'Notes'];
    const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
    const lines = [head.join(',')].concat(list.map(t => [t.account, t.symbol, t.side, t.qty, t.entryTime.replace('T', ' '), t.exitTime.replace('T', ' '),
      t.entryPrice, t.exitPrice, t.gross, M.fees(t).toFixed(2), M.net(t).toFixed(2), t.setup || '', (t.tags || []).join('; '), t.rating || '', t.notes || ''].map(q).join(',')));
    U.download(`mubu-trades-${U.todayKey()}.csv`, lines.join('\n'), 'text/csv');
  },
};

</script>
  <script>
window.Views = window.Views || {};

Views.reports = {
  title: 'Reports',
  tab: 'performance',
  left: { metric: 'cum', group: 'day' },
  right: { metric: 'winrate', group: 'week' },
  breakdown: 'dow',
  year: null,

  METRICS: {
    cum: { label: 'Net P&L — cumulative', type: 'area', money: true },
    net: { label: 'Net P&L', type: 'bar', money: true },
    winrate: { label: 'Trade win %', type: 'line', pct: true },
    pf: { label: 'Profit factor', type: 'line' },
    avgwl: { label: 'Avg win/loss ratio', type: 'line' },
    expectancy: { label: 'Trade expectancy', type: 'bar', money: true },
    trades: { label: 'Number of trades', type: 'bar' },
    volume: { label: 'Contracts traded', type: 'bar' },
    fees: { label: 'Commissions', type: 'bar', money: true },
  },

  BREAKDOWNS: {
    dow: { label: 'Day of week', key: t => U.toLocal(t.entryTime).getDay(), name: k => U.DOW[k], order: (a, b) => a - b },
    hour: { label: 'Hour of day (entry)', key: t => U.toLocal(t.entryTime).getHours(), name: k => `${U.pad(k)}:00`, order: (a, b) => a - b },
    symbol: { label: 'Symbol', key: t => t.root, name: k => k },
    side: { label: 'Long vs short', key: t => t.side, name: k => k },
    setup: { label: 'Setup / playbook', key: t => t.setup || '(no setup)', name: k => k },
    account: { label: 'Account', key: t => t.account, name: k => k },
    duration: { label: 'Hold time', key: t => { const s = M.holdSec(t); return s < 60 ? 0 : s < 300 ? 1 : s < 900 ? 2 : s < 1800 ? 3 : s < 3600 ? 4 : 5; },
      name: k => ['< 1 min', '1–5 min', '5–15 min', '15–30 min', '30–60 min', '1 hr +'][k], order: (a, b) => a - b },
    month: { label: 'Month', key: t => t.entryTime.slice(0, 7), name: k => `${U.MONTHS[+k.slice(5, 7) - 1].slice(0, 3)} ${k.slice(0, 4)}`, order: (a, b) => a < b ? -1 : 1 },
    rating: { label: 'Execution rating', key: t => t.rating || 0, name: k => k ? '★'.repeat(k) : 'Unrated', order: (a, b) => a - b },
  },

  render(el) {
    if (!Store.data.trades.length) { el.innerHTML = UI.emptyState(); return; }
    el.innerHTML = `
      <div class="tabs page-tabs" id="rTabs">
        <button data-t="performance">Performance</button>
        <button data-t="breakdown">Breakdowns</button>
        <button data-t="calendar">Year calendar</button>
        <div style="margin-left:auto;display:flex;align-items:center"><button class="btn sm" onclick="window.print()">⇩ Export PDF</button></div>
      </div>
      <div id="rBody"></div>`;
    U.$$('#rTabs [data-t]', el).forEach(b => {
      b.classList.toggle('active', b.dataset.t === this.tab);
      b.onclick = () => { this.tab = b.dataset.t; App.render(); };
    });
    const body = U.$('#rBody', el);
    if (this.tab === 'performance') this.performance(body);
    else if (this.tab === 'breakdown') this.breakdownView(body);
    else this.yearView(body);
  },

  groupKey(key, group) {
    if (group === 'week') return U.weekStart(key);
    if (group === 'month') return key.slice(0, 7);
    return key;
  },

  series(trades, cfg) {
    const g = M.groupBy(trades, t => this.groupKey(U.dayKey(t.entryTime), cfg.group));
    const keys = [...g.keys()].sort();
    let running = 0;
    const vals = keys.map(k => {
      const s = M.summarize(g.get(k));
      switch (cfg.metric) {
        case 'cum': running += s.total; return running;
        case 'net': return s.total;
        case 'winrate': return s.winRate * 100;
        case 'pf': return isFinite(s.pf) ? s.pf : null;
        case 'avgwl': return isFinite(s.ratio) ? s.ratio : null;
        case 'expectancy': return s.expectancy;
        case 'trades': return s.count;
        case 'volume': return s.volume;
        case 'fees': return s.fees;
      }
    });
    const labels = keys.map(k => cfg.group === 'month' ? `${U.MONTHS[+k.slice(5, 7) - 1].slice(0, 3)} ${k.slice(2, 4)}` : U.fmtShort(k));
    return { labels, vals: vals.map(v => v == null ? null : +(+v).toFixed(2)) };
  },

  chartPanel(id, cfg) {
    const opts = Object.entries(this.METRICS).map(([k, m]) => `<option value="${k}" ${k === cfg.metric ? 'selected' : ''}>${m.label}</option>`).join('');
    return `<div class="card">
      <div class="metric-bar">
        <select data-panel="${id}" data-f="metric">${opts}</select>
        <select data-panel="${id}" data-f="group" style="margin-left:auto">
          ${['day', 'week', 'month'].map(g => `<option value="${g}" ${g === cfg.group ? 'selected' : ''}>${g[0].toUpperCase() + g.slice(1)}</option>`).join('')}
        </select>
      </div>
      <div class="card-body"><div class="chart-box lg"><canvas id="${id}"></canvas></div></div></div>`;
  },

  drawPanel(el, id, cfg) {
    const trades = App.filtered();
    const box = U.$('#' + id, el).parentElement;
    Charts.destroyIn(box);
    box.innerHTML = `<canvas id="${id}"></canvas>`;
    const cv = U.$('canvas', box);
    const { labels, vals } = this.series(trades, cfg);
    const m = this.METRICS[cfg.metric];
    if (!labels.length) { box.innerHTML = '<div class="no-data">No data in range</div>'; return; }
    if (m.type === 'area') Charts.area(cv, labels, vals);
    else if (m.type === 'bar') Charts.bars(cv, labels, vals, { money: !!m.money, colors: m.money ? null : vals.map(() => '#5867D6') });
    else Charts.lineSeries(cv, labels, vals, { money: !!m.money, pct: !!m.pct, fill: false });
  },

  performance(body) {
    const s = M.summarize(App.filtered());
    const stat = (k, v, cls = '', tip = '') => `<div class="s"><div class="k">${k} ${tip ? UI.info(tip) : ''}</div><div class="v ${cls}">${v}</div></div>`;
    body.innerHTML = `
      <div class="grid g-2">${this.chartPanel('rcLeft', this.left)}${this.chartPanel('rcRight', this.right)}</div>
      <div class="card"><div class="tabs"><button class="active">Summary</button></div>
        <div class="summary-grid">
          ${stat('Net P&L', U.money(s.total), U.cls(s.total))}
          ${stat('Trade expectancy', U.money(s.expectancy), U.cls(s.expectancy), 'Win% × avg win − loss% × avg loss')}
          ${stat('Avg net trade P&L', U.money(s.avgTrade), U.cls(s.avgTrade))}
          ${stat('Avg daily volume', U.num(s.avgDailyVolume))}
          ${stat('Win %', U.pct(s.winRate))}
          ${stat('Avg daily net P&L', U.money(s.avgDay), U.cls(s.avgDay))}
          ${stat('Profit factor', U.num(s.pf))}
          ${stat('Logged days', s.dayCount)}
          ${stat('Avg daily win %', U.pct(s.dayWinRate))}
          ${stat('Avg trade win/loss', U.num(s.ratio))}
          ${stat('Avg winning trade', U.money(s.avgWin), 'pos')}
          ${stat('Avg losing trade', U.money(-s.avgLoss), 'neg')}
          ${stat('Largest winning trade', U.money(s.largestWin), 'pos')}
          ${stat('Largest losing trade', U.money(s.largestLoss), 'neg')}
          ${stat('Best day', U.money(s.bestDay), 'pos')}
          ${stat('Worst day', U.money(s.worstDay), 'neg')}
          ${stat('Max drawdown (trade)', U.money(s.maxDD), 'neg', 'Largest peak-to-trough drop in cumulative net P&L, trade by trade.')}
          ${stat('Max daily net drawdown', U.money(s.maxDailyDD), 'neg', 'Largest peak-to-trough drop using end-of-day equity.')}
          ${stat('Recovery factor', U.num(s.recovery), '', 'Net P&L ÷ max drawdown')}
          ${stat('Best day % of profit', isFinite(s.bestDayShare) ? U.pct(s.bestDayShare, 1) : '—', '', 'Prop-firm consistency check: how much of total profit came from your single best day.')}
          ${stat('Max consecutive wins', s.maxConsecWins)}
          ${stat('Max consecutive losses', s.maxConsecLosses)}
          ${stat('Avg hold time', U.duration(s.avgHold))}
          ${stat('Avg hold — winners / losers', `${U.duration(s.avgWinHold)} / ${U.duration(s.avgLossHold)}`)}
          ${stat('Total trades', s.count)}
          ${stat('Winners / losers / BE', `${s.wins} / ${s.losses} / ${s.be}`)}
          ${stat('Gross P&L', U.money(s.gross), U.cls(s.gross))}
          ${stat('Total commissions', U.money(s.fees))}
        </div></div>`;
    this.drawPanel(body, 'rcLeft', this.left);
    this.drawPanel(body, 'rcRight', this.right);
    U.$$('select[data-panel]', body).forEach(sel => sel.onchange = () => {
      const cfg = sel.dataset.panel === 'rcLeft' ? this.left : this.right;
      cfg[sel.dataset.f] = sel.value;
      this.drawPanel(body, sel.dataset.panel, cfg);
    });
  },

  breakdownView(body) {
    const trades = App.filtered();
    const b = this.BREAKDOWNS[this.breakdown];
    const g = M.groupBy(trades, b.key);
    let keys = [...g.keys()];
    keys.sort(b.order || ((x, y) => M.summarize(g.get(y)).total - M.summarize(g.get(x)).total));
    const rows = keys.map(k => ({ k, name: b.name(k), s: M.summarize(g.get(k)) }));
    body.innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <div class="metric-bar" style="padding-bottom:14px">
          ${Object.entries(this.BREAKDOWNS).map(([k, v]) => `<button class="btn sm ${k === this.breakdown ? 'primary' : ''}" data-b="${k}">${v.label}</button>`).join('')}
        </div></div>
      <div class="grid g-2">
        <div class="card"><div class="card-head"><h3>Net P&amp;L by ${b.label.toLowerCase()}</h3></div><div class="card-body"><div class="chart-box"><canvas id="bk1"></canvas></div></div></div>
        <div class="card"><div class="card-head"><h3>Win % by ${b.label.toLowerCase()}</h3></div><div class="card-body"><div class="chart-box"><canvas id="bk2"></canvas></div></div></div>
      </div>
      <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr>
        <th>${b.label}</th><th class="num">Trades</th><th class="num">Win %</th><th class="num">Net P&amp;L</th><th class="num">Avg trade</th><th class="num">Avg win</th><th class="num">Avg loss</th><th class="num">Profit factor</th><th class="num">Volume</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td><b>${U.esc(r.name)}</b></td><td class="num">${r.s.count}</td><td class="num">${U.pct(r.s.winRate, 1)}</td>
          <td class="num ${U.cls(r.s.total)}"><b>${U.money(r.s.total)}</b></td><td class="num ${U.cls(r.s.avgTrade)}">${U.money(r.s.avgTrade)}</td>
          <td class="num pos">${U.money(r.s.avgWin)}</td><td class="num neg">${U.money(-r.s.avgLoss)}</td><td class="num">${U.num(r.s.pf)}</td><td class="num">${r.s.volume}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="9">No data</td></tr>'}
        </tbody></table></div></div>`;
    U.$$('[data-b]', body).forEach(x => x.onclick = () => { this.breakdown = x.dataset.b; App.render(); });
    if (rows.length) {
      const horiz = rows.length > 8;
      Charts.bars(U.$('#bk1', body), rows.map(r => r.name), rows.map(r => +r.s.total.toFixed(2)), { horizontal: horiz });
      Charts.bars(U.$('#bk2', body), rows.map(r => r.name), rows.map(r => +(r.s.winRate * 100).toFixed(1)), { money: false, pct: true, horizontal: horiz, colors: rows.map(() => '#5867D6') });
    }
  },

  yearView(body) {
    const trades = App.filtered();
    const days = M.days(trades);
    const years = [...new Set(days.map(d => d.key.slice(0, 4)))].sort();
    if (!this.year || !years.includes(this.year)) this.year = years[years.length - 1] || String(new Date().getFullYear());
    const map = new Map(days.map(d => [d.key, d]));
    const y = +this.year;
    let yearNet = 0;
    const months = U.MONTHS.map((name, mi) => {
      const first = new Date(y, mi, 1).getDay(), n = new Date(y, mi + 1, 0).getDate();
      let cells = U.DOW.map(d => `<div class="dw">${d[0]}</div>`).join(''), mNet = 0;
      for (let i = 0; i < first; i++) cells += '<div class="md blank"></div>';
      for (let dn = 1; dn <= n; dn++) {
        const key = `${y}-${U.pad(mi + 1)}-${U.pad(dn)}`, d = map.get(key);
        if (d) mNet += d.net;
        cells += `<div class="md ${d ? (d.net > 0 ? 'win' : d.net < 0 ? 'loss' : 'be') : ''}" ${d ? `data-day="${key}" title="${U.money(d.net)} · ${d.trades.length} trades"` : ''}>${dn}</div>`;
      }
      yearNet += mNet;
      return `<div class="card year-month" style="padding:12px"><h4><span>${name}</span><span class="${U.cls(mNet)}">${mNet ? U.moneyShort(mNet) : ''}</span></h4><div class="mini-grid">${cells}</div></div>`;
    }).join('');
    body.innerHTML = `<div class="card"><div class="cal-head">
        <select class="inp" id="ySel" style="width:auto">${(years.length ? years : [this.year]).map(x => `<option ${x === this.year ? 'selected' : ''}>${x}</option>`).join('')}</select>
        <div class="stats">Year net: <span class="chip ${U.cls(yearNet)}">${U.money(yearNet)}</span></div></div>
        <div class="year-grid">${months}</div></div>`;
    U.$('#ySel', body).onchange = e => { this.year = e.target.value; App.render(); };
    U.$$('[data-day]', body).forEach(c => c.onclick = () => App.go(`#/journal?day=${c.dataset.day}`));
  },
};

</script>
  <script>
window.Views = window.Views || {};

Views.runs = {
  title: 'Runs',

  sel: null,
  STAGE_COLORS: { Eval: '#F59E0B', Funded: '#4F6BED', Live: '#8B5CF6' },
  REALITY_COLOR: '#E5484D',
  LOOK_DEFAULT: { eval: '#F59E0B', funded: '#4F6BED', reality: '#E5484D', smooth: true, fill: true, showReality: true, showGrid: false, thickness: 2.5 },
  look() { return Object.assign({}, this.LOOK_DEFAULT, Store.data.settings.runLook || {}); },
  applyLook() { const l = this.look(); this.STAGE_COLORS = { Eval: l.eval, Funded: l.funded, Live: l.funded }; this.REALITY_COLOR = l.reality; return l; },

  render(el, params) {
    const runs = Runs.all();
    const order = r => (r.status === 'active' ? 0 : 1);
    const sorted = [...runs].sort((a, b) => order(a) - order(b) || ((Runs.span(b) || {}).from || '').localeCompare((Runs.span(a) || {}).from || ''));
    if (params.id && Runs.get(params.id)) this.sel = params.id;
    if (!this.sel || !Runs.get(this.sel)) this.sel = sorted[0] ? sorted[0].id : null;
    const free = Runs.unassigned();
    const quick = free.length ? `<div class="quick-start">
        <span class="help">${runs.length ? 'Not in a run yet:' : 'Start a run from one of your accounts:'}</span>
        ${free.slice(0, 6).map(a => `<button class="chip-btn" data-start="${U.esc(a)}">+ ${U.esc(a)}</button>`).join('')}
        ${free.length > 6 ? `<span class="help">+${free.length - 6} more</span>` : ''}
      </div>` : '';

    if (!sorted.length) {
      el.innerHTML = `<div class="card"><div class="empty">
        <h3>Track a run from eval to funded</h3>
        <div style="max-width:520px;margin:0 auto">One click starts a run from an account. When you pass, hit <b>I'm funded</b> and pick the funded account — your progress carries over instead of resetting to zero.</div>
        ${quick ? `<div style="margin-top:18px">${quick}</div>` : `<div class="actions">${Store.accounts().length ? '' : '<a class="btn primary" href="#/import">Import trades first</a>'}<button class="btn" data-demo>Load demo data</button></div>`}
      </div></div>`;
      this.bind(el); return;
    }

    el.innerHTML = `
      <div class="run-tabs">
        ${sorted.map(r => { const sm = Runs.summary(r); const stl = Runs.statusLabel(r);
          return `<button class="run-tab ${r.id === this.sel ? 'on' : ''}" data-sel="${r.id}" style="--rc:${r.color}">
            <span class="run-dot"></span><span class="nm">${U.esc(r.name)}</span><span class="pill ${stl.cls}">${stl.text.replace(' · active', '')}</span>${(() => { const cs = sm.stages[sm.stages.length - 1]; return cs ? `<span class="${U.cls(cs.net)}">${U.moneyShort(cs.net)}</span>` : ''; })()}</button>`; }).join('')}
        <button class="run-tab add" id="rNew" title="New run">+ New run</button>
      </div>
      ${quick}
      <div id="rDetail"></div>`;
    this.detail(U.$('#rDetail', el), Runs.get(this.sel));
    this.bind(el);
  },

  bind(el) {
    U.$$('[data-sel]', el).forEach(b => b.onclick = () => { this.sel = b.dataset.sel; App.go(`#/runs?id=${b.dataset.sel}`); });
    U.$$('[data-start]', el).forEach(b => b.onclick = () => {
      const r = Runs.create({ account: b.dataset.start, type: /funded|\bpa\b|\bfunded\b/i.test(b.dataset.start) ? 'Funded' : 'Eval' });
      this.sel = r.id; App.toast(`Run started for ${b.dataset.start}`); App.go(`#/runs?id=${r.id}`);
    });
    const nb = U.$('#rNew', el); if (nb) nb.onclick = () => this.newModal();
  },

  detail(box, r) {
    const sm = Runs.summary(r);
    const stl = Runs.statusLabel(r);
    const last = r.stages[r.stages.length - 1];
    const canPromote = r.status === 'active' && last && last.type === 'Eval';
    const sp = sm.span;
    const rs = sm.reality;
    const primary = canPromote ? `<button class="btn primary" data-act="promote">🎉 I'm funded</button>`
      : (r.status === 'active' && sm.hasFunded ? `<button class="btn" data-act="payout">+ Log payout</button>` : '');
    const path = sm.stages.map((s, i) => {
      const done = s.result === 'passed' ? ' ✓' : s.result === 'blown' ? ' ✗' : '';
      const active = r.status === 'active' && i === sm.stages.length - 1;
      return `<span class="crumb ${active ? 'on' : ''}" style="--sc:${this.STAGE_COLORS[s.type]}" title="${U.esc(s.account)} · ${U.fmtShort(s.from)} → ${U.fmtShort(s.to)} · ${U.money(s.net)}">${s.type}${done}</span>`;
    }).join('<span class="crumb-arrow">→</span>');

    box.innerHTML = `<div class="card run-detail" style="--rc:${r.color}">
      <div class="card-head">
        <div style="min-width:0">
          <div class="run-title">${U.esc(r.name)} <span class="pill ${stl.cls}">${stl.text}</span></div>
          <div class="run-dates">${sp ? `${U.fmtDate(sp.from)} → ${r.status === 'active' ? 'today' : U.fmtDate(sp.to)} · ${sm.s.dayCount} trading days` : 'No trades in this account yet — import its CSV and it shows up here.'}</div>
        </div>
        <div class="right">${primary}
          <div class="menu-wrap"><button class="btn ghost" data-menu aria-label="More">⋯</button>
            <div class="menu" hidden>
              ${r.status === 'active' ? '<button data-act="blown">Mark as blown</button>' : '<button data-act="reopen">Reopen run</button>'}
              ${sm.hasFunded ? '<button data-act="payout">Log a payout</button>' : ''}
              <button data-act="reality">Reality settings</button>
              <button data-act="edit">Edit run</button>
              <button data-act="delete" class="danger">Delete run</button>
            </div></div>
        </div>
      </div>
      <div class="card-body">
        <div class="crumbs">${path}</div>
        <div class="run-kpis four">
          <div><div class="k">Evaluation</div><div class="v ${U.cls(sm.evalNet)}">${U.money(sm.evalNet)}</div><div class="sub">${sm.stages.some(x => x.type === 'Eval' && x.result === 'passed') ? 'passed — this money isn\'t yours' : sm.stages.some(x => x.type === 'Eval' && x.result === 'blown') ? 'blown' : 'in progress — not withdrawable'}</div></div>
          <div><div class="k">Funded</div><div class="v ${sm.hasFunded ? U.cls(sm.fundedNet) : ''}">${sm.hasFunded ? U.money(sm.fundedNet) : '—'}</div><div class="sub">${sm.hasFunded ? 'started from $0' : 'not funded yet'}</div></div>
          <div class="reality-kpi"><div class="k">What you'd actually keep</div><div class="v">${sm.hasFunded ? U.money(sm.realKeep) : '$0.00'}</div><div class="sub">${sm.hasFunded ? `after the ${rs.withdrawPct}% withdrawal cap and ${rs.splitPct}% split` : 'eval profit pays $0'}</div></div>
          <div><div class="k">Paid out so far</div><div class="v ${sm.payouts ? 'pos' : ''}">${U.money(sm.payouts)}</div><div class="sub">${(r.payouts || []).length} payout${(r.payouts || []).length === 1 ? '' : 's'}</div></div>
        </div>
        <div class="chart-top">
          <div class="mini-legend"><span><i style="background:${this.look().eval}"></i>Evaluation</span><span><i style="background:${this.look().funded}"></i>Funded</span>${sm.hasFunded && this.look().showReality ? `<span><i class="dash" style="--c:${this.look().reality}"></i>What you'd keep</span>` : ''}</div>
          <button class="btn sm ghost" data-act="look">🎨 Customize</button>
        </div>
        <div class="chart-box lg"><canvas id="rcMain"></canvas></div>
        ${sm.hasFunded ? `<div class="reality-strip">
          <span><b>Reality check:</b> funded profit <b>${U.money(Math.max(0, sm.fundedNet))}</b></span><span class="arr">→</span>
          <span>${rs.withdrawPct}% you can withdraw <b>${U.money(Math.max(0, sm.fundedNet) * rs.withdrawPct / 100)}</b></span><span class="arr">→</span>
          <span>your ${rs.splitPct}% split <b class="neg">${U.money(sm.realKeep)}</b></span>
          <button class="btn sm ghost" data-act="reality">Adjust</button>
        </div>` : ''}
        ${(r.payouts || []).length ? `<details class="pay-list"><summary>${(r.payouts || []).length} payout${r.payouts.length === 1 ? '' : 's'} · ${U.money(sm.payouts)}</summary>
          ${r.payouts.map(p => `<div class="row"><span>💰 ${U.fmtLong(p.date)}</span><b class="pos" style="margin-left:auto">${U.money(p.amount)}</b><button class="btn sm ghost" data-act="delpay" data-pid="${p.id}" title="Remove">✕</button></div>`).join('')}</details>` : ''}
      </div></div>`;

    this.chart(U.$('#rcMain', box), r, sm);
    const menu = U.$('.menu', box), mb = U.$('[data-menu]', box);
    mb.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; };
    document.addEventListener('click', () => { menu.hidden = true; }, { once: true });
    U.$$('[data-act]', box).forEach(b => b.onclick = () => { menu.hidden = true; this.action(b.dataset.act, r.id, b.dataset.pid); });
  },

  /* Each stage is a different account, so each one starts at $0. The chart shows that honestly:
     the eval curve, a dotted drop back to $0 at promotion, then the funded curve from $0,
     with the reality (take-home) line under the funded part only. */
  chart(cv, r, sm) {
    if (!cv) return;
    const L = this.applyLook();
    const days = M.days(sm.trades);
    if (!days.length) { cv.parentElement.innerHTML = '<div class="no-data">No trades in this run yet</div>'; return; }
    const stInfo = Runs.stagesOf(r);
    const typeOf = idx => (stInfo.find(s => s.index === idx) || {}).type || 'Eval';
    const rs = sm.reality;
    const pts = []; // {label, key, stage, type, y, real, start}
    let cur = null, cum = 0;
    days.forEach(d => {
      const stage = Math.min(...d.trades.map(t => t._stage));
      if (stage !== cur) {
        cur = stage; cum = 0;
        // synthetic $0 starting point for every stage
        pts.push({ label: 'Start', key: d.key, stage, type: typeOf(stage), y: 0, real: typeOf(stage) === 'Eval' ? null : 0, start: true });
      }
      cum += d.net;
      const type = typeOf(stage);
      pts.push({ label: U.fmtShort(d.key), key: d.key, stage, type, y: +cum.toFixed(2), real: type === 'Eval' ? null : +Runs.takeHome(cum, rs).toFixed(2) });
    });
    const stages = [...new Set(pts.map(p => p.stage))];
    const datasets = [];
    stages.forEach(si => {
      const type = typeOf(si);
      datasets.push({
        label: type === 'Eval' ? 'Evaluation' : type, _stage: si, data: pts.map(p => (p.stage === si ? p.y : null)),
        borderColor: this.STAGE_COLORS[type], backgroundColor: this.STAGE_COLORS[type] + (type === 'Eval' ? '18' : '22'), fill: 'origin',
        borderWidth: L.thickness, tension: L.smooth ? .35 : 0, fill: L.fill ? 'origin' : false, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: this.STAGE_COLORS[type], spanGaps: false,
      });
    });
    // dotted "balance resets" drop between stages
    const resetData = pts.map(() => null);
    pts.forEach((p, i) => { if (p.start && i > 0) { resetData[i - 1] = pts[i - 1].y; resetData[i] = 0; } });
    if (resetData.some(v => v != null)) datasets.push({ label: 'New account starts at $0', data: resetData, borderColor: '#C9CEDD', borderDash: [2, 4], borderWidth: 1.2, pointRadius: 0, fill: false, spanGaps: false, tension: 0 });
    if (sm.hasFunded && L.showReality) datasets.push({ label: 'Reality (take-home)', data: pts.map(p => p.real), borderColor: this.REALITY_COLOR, backgroundColor: 'transparent', fill: false,
      borderWidth: Math.max(1.5, L.thickness - .5), borderDash: [5, 5], tension: L.smooth ? .35 : 0, pointRadius: 0, pointHoverRadius: 4, spanGaps: false });
    const payKeys = new Map((r.payouts || []).map(p => [p.date, p]));
    if (payKeys.size) datasets.push({ label: 'Payout', data: pts.map(p => (!p.start && p.type !== 'Eval' && payKeys.has(p.key) ? p.y : null)), showLine: false, pointRadius: 6, pointHoverRadius: 8,
      pointStyle: 'rectRot', pointBackgroundColor: '#12A06A', pointBorderColor: '#fff', pointBorderWidth: 2 });

    // Background bands + labels for each stage
    const STAGE_COLORS = this.STAGE_COLORS;
    const bands = stages.map(si => {
      const idx = pts.map((p, i) => (p.stage === si ? i : -1)).filter(i => i >= 0);
      const st = stInfo.find(x => x.index === si) || {};
      const result = st.result === 'passed' ? ' · passed' : st.result === 'blown' ? ' · blown' : '';
      return { from: idx[0], to: idx[idx.length - 1], type: typeOf(si), text: (typeOf(si) === 'Eval' ? 'Evaluation' : typeOf(si)) + result };
    });
    const bandPlugin = {
      id: 'stageBands',
      beforeDatasetsDraw(chart) {
        const { ctx, chartArea: a, scales: { x } } = chart;
        ctx.save();
        bands.forEach((b, i) => {
          const half = (x.getPixelForValue(1) - x.getPixelForValue(0)) / 2 || 0;
          const x0 = i === 0 ? a.left : x.getPixelForValue(b.from) - half;
          const x1 = i === bands.length - 1 ? a.right : x.getPixelForValue(b.to) + half;
          ctx.fillStyle = STAGE_COLORS[b.type] + '0A';
          ctx.fillRect(x0, a.top, x1 - x0, a.bottom - a.top);
          if (i > 0) { ctx.strokeStyle = '#D5DAE8'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(x0, a.top); ctx.lineTo(x0, a.bottom); ctx.stroke(); ctx.setLineDash([]); }
          ctx.fillStyle = STAGE_COLORS[b.type];
          ctx.font = '500 11px Inter, system-ui, sans-serif';
          ctx.textBaseline = 'top';
          ctx.fillText(b.text, x0 + 8, a.top + 6);
        });
        ctx.restore();
      },
    };
    const stageLabels = new Set(['Evaluation', 'Funded', 'Live']);
    Charts.make(cv, {
      type: 'line', data: { labels: pts.map(p => (p.start ? (p.type === 'Eval' ? 'Start' : `${p.type} start`) : p.label)), datasets },
      plugins: [bandPlugin],
      options: {
        interaction: { mode: 'index', intersect: false },
        layout: { padding: { top: 18 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            filter: it => it.dataset.label !== 'New account starts at $0',
            callbacks: {
              title: items => { if (!items.length) return ''; const p = pts[items[0].dataIndex]; return p.start ? `${p.type === 'Eval' ? 'Evaluation' : p.type} account opened — starts at $0` : U.fmtLong(p.key); },
              label: ctx => {
                const p = pts[ctx.dataIndex];
                if (ctx.dataset.label === 'Payout') return `💰 Payout ${U.money(payKeys.get(p.key).amount)}`;
                if (ctx.dataset.label.startsWith('Reality')) return `You'd actually keep ${U.money(ctx.parsed.y)}`;
                return `${p.type === 'Eval' ? 'Eval' : p.type} P&L ${U.money(ctx.parsed.y)}`;
              },
            },
          },
        },
        scales: { x: { grid: { display: false }, border: { display: false }, ticks: { maxTicksLimit: 5, maxRotation: 0, autoSkip: true, color: '#9AA1BA' } },
          y: { grid: { display: L.showGrid, color: '#F1F3F8' }, border: { display: false }, ticks: { callback: v => U.moneyAxis(v), maxTicksLimit: 4, color: '#9AA1BA' } } },
      },
    });
  },

  action(act, id, pid) {
    const r = Runs.get(id);
    if (!r) return;
    if (act === 'edit') return this.editModal(r);
    if (act === 'promote') return this.promoteModal(r);
    if (act === 'payout') return this.payoutModal(r);
    if (act === 'reality') return this.realityModal(r);
    if (act === 'look') return this.lookModal();
    if (act === 'delpay') { Runs.removePayout(id, pid); App.toast('Payout removed'); return App.render(); }
    if (act === 'reopen') { Runs.setStatus(id, 'active'); App.toast('Run reopened'); return App.render(); }
    if (act === 'delete') {
      return UI.confirm('Delete run?', `Removes the <b>${U.esc(r.name)}</b> grouping and its payouts. Your trades stay.`, 'Delete run').then(ok => {
        if (ok) { Runs.remove(id); this.sel = null; App.toast('Run deleted'); App.go('#/runs'); }
      });
    }
    if (act === 'blown') {
      UI.confirm('Mark run as blown?', `This ends <b>${U.esc(r.name)}</b>. Its history is kept.`, 'Mark blown').then(ok => {
        if (ok) { Runs.setStatus(id, 'blown'); App.toast('Run marked as blown — onto the next one'); App.render(); }
      });
    }
  },

  /* Minimal "new run": just pick the account. */
  newModal() {
    const free = Runs.unassigned();
    const body = U.h(`<div>
      <label class="field-label">Which account is this run starting on?</label>
      <select class="inp" id="nrAcct">${this.accountOptions(free[0] || '', true)}</select>
      <input class="inp" id="nrNew" placeholder="Account name as you'll import it" style="margin-top:8px;display:none">
      <div class="seg" id="nrType" style="margin-top:12px"><button type="button" class="on" data-t="Eval">Evaluation</button><button type="button" data-t="Funded">Already funded</button></div>
    </div>`);
    const sel = U.$('#nrAcct', body), inp = U.$('#nrNew', body);
    let type = 'Eval';
    if (!free.length) { sel.value = '__new'; inp.style.display = ''; }
    sel.onchange = () => { inp.style.display = sel.value === '__new' ? '' : 'none'; };
    U.$$('#nrType button', body).forEach(b => b.onclick = () => { type = b.dataset.t; U.$$('#nrType button', body).forEach(x => x.classList.toggle('on', x === b)); });
    UI.modal({ title: 'New run', body, footer: [{ label: 'Cancel' }, { label: 'Start run', cls: 'primary', onClick: c => {
      const account = sel.value === '__new' ? inp.value.trim() : sel.value;
      if (!account) { inp.style.display = ''; inp.focus(); return; }
      const run = Runs.create({ account, type });
      this.sel = run.id; c(); App.toast('Run started'); App.go(`#/runs?id=${run.id}`);
    } }] });
  },

  lookModal() {
    const l = this.look();
    const SW = ['#F59E0B', '#4F6BED', '#12A06A', '#8B5CF6', '#06B6D4', '#EC4899', '#0E1530', '#E5484D', '#64748B', '#F97316'];
    const row = (key, label) => `<div style="margin-bottom:14px"><label class="field-label">${label}</label><div class="swatches" data-key="${key}">${SW.map(c => `<button type="button" style="--rc:${c}" data-c="${c}" class="${c === l[key] ? 'on' : ''}"></button>`).join('')}<input type="color" value="${l[key]}" data-custom title="Pick any color" style="width:30px;height:28px;border:0;background:none;padding:0;cursor:pointer"></div></div>`;
    const tog = (key, label) => `<label class="tog"><input type="checkbox" data-t="${key}" ${l[key] ? 'checked' : ''}> ${label}</label>`;
    const body = U.h(`<div>
      ${row('eval', 'Evaluation color')}${row('funded', 'Funded color')}${row('reality', "\"What you'd keep\" color")}
      <label class="field-label">Line thickness</label>
      <div class="seg" id="lkTh" style="margin-bottom:14px">${[[1.5, 'Thin'], [2.5, 'Regular'], [3.5, 'Bold']].map(([v, t]) => `<button type="button" data-v="${v}" class="${+l.thickness === v ? 'on' : ''}">${t}</button>`).join('')}</div>
      <div class="tog-grid">${tog('smooth', 'Smooth curves')}${tog('fill', 'Shade under the line')}${tog('showReality', "Show what you'd keep")}${tog('showGrid', 'Grid lines')}</div>
    </div>`);
    const next = { ...l };
    U.$$('.swatches', body).forEach(g => {
      const key = g.dataset.key;
      U.$$('button', g).forEach(b => b.onclick = () => { next[key] = b.dataset.c; U.$$('button', g).forEach(x => x.classList.toggle('on', x === b)); });
      U.$('[data-custom]', g).oninput = e => { next[key] = e.target.value; U.$$('button', g).forEach(x => x.classList.remove('on')); };
    });
    U.$$('#lkTh button', body).forEach(b => b.onclick = () => { next.thickness = +b.dataset.v; U.$$('#lkTh button', body).forEach(x => x.classList.toggle('on', x === b)); });
    U.$$('[data-t]', body).forEach(i => i.onchange = () => { next[i.dataset.t] = i.checked; });
    UI.modal({ title: 'Customize your chart', body, footer: [
      { label: 'Reset', cls: 'left', onClick: c => { delete Store.data.settings.runLook; Store.save(); c(); App.render(); } },
      { label: 'Cancel' },
      { label: 'Save', cls: 'primary', onClick: c => { Store.data.settings.runLook = next; Store.save(); c(); App.toast('Chart updated'); App.render(); } },
    ] });
  },

  realityModal(r) {
    const rs = Runs.realityOf(r);
    const body = U.h(`<div>
      <p class="help" style="margin-top:0">Funded profit isn't money in your pocket. Most firms only let you withdraw part of your profit, then keep a share of what you withdraw. Set the numbers for this firm.</p>
      <div class="form-row">
        <div><label class="field-label">Withdrawable % of profit</label><input class="inp" type="number" min="0" max="100" step="1" id="rlW" value="${rs.withdrawPct}"></div>
        <div><label class="field-label">Your profit split %</label><input class="inp" type="number" min="0" max="100" step="1" id="rlS" value="${rs.splitPct}"></div>
      </div>
      <div class="help" id="rlEx"></div>
      <label class="checklist" style="display:block;margin-top:10px"><label><input type="checkbox" id="rlAll" ${rs.custom ? '' : 'checked'}> Use these numbers for all runs (default)</label></label>
    </div>`);
    const ex = () => { const w = +U.$('#rlW', body).value || 0, sp = +U.$('#rlS', body).value || 0; U.$('#rlEx', body).innerHTML = `Example: <b>$3,000</b> funded profit → ${w}% withdrawable = <b>${U.money(3000 * w / 100)}</b> → your ${sp}% = <b>${U.money(3000 * w / 100 * sp / 100)}</b> take-home.`; };
    U.$$('input[type=number]', body).forEach(i => i.oninput = ex); ex();
    UI.modal({ title: 'Reality settings', body, footer: [{ label: 'Cancel' }, { label: 'Save', cls: 'primary', onClick: c => {
      const w = Math.min(100, Math.max(0, +U.$('#rlW', body).value || 0)), sp = Math.min(100, Math.max(0, +U.$('#rlS', body).value || 0));
      if (U.$('#rlAll', body).checked) { Store.data.settings.reality = { withdrawPct: w, splitPct: sp }; Runs.update(r.id, { reality: null }); delete r.reality; Store.save(); }
      else Runs.update(r.id, { reality: { withdrawPct: w, splitPct: sp } });
      c(); App.toast('Reality settings saved'); App.render();
    } }] });
  },

  accountOptions(selected, preferFree = true) {
    const free = Runs.unassigned();
    const all = Store.accounts();
    const ordered = preferFree ? [...free, ...all.filter(a => !free.includes(a))] : all;
    return ordered.map(a => `<option ${a === selected ? 'selected' : ''}>${U.esc(a)}</option>`).join('') + '<option value="__new">+ Account not imported yet…</option>';
  },

  promoteModal(r) {
    const cur = r.stages[r.stages.length - 1];
    const lastDay = Runs.accountRange(cur.account).last || U.todayKey();
    const body = U.h(`<div>
      <p style="margin-top:0;line-height:1.6">Nice work 🎉 Which account did <b>${U.esc(cur.account)}</b> turn into?</p>
      <select class="inp" id="pmAcct">${this.accountOptions('', true)}</select>
      <input class="inp" id="pmNew" placeholder="Funded account name, as you'll import it" style="margin-top:8px;display:none">
      <div class="help" style="margin-top:10px">Passed on <input type="date" id="pmPass" value="${lastDay}" class="inline-date"> · not imported yet? Choose “Account not imported yet” and type its name.</div>
    </div>`);
    const sel = U.$('#pmAcct', body), inp = U.$('#pmNew', body);
    const free = Runs.unassigned().filter(a => a !== cur.account);
    if (!free.length) { sel.value = '__new'; inp.style.display = ''; }
    else sel.value = free[0];
    sel.onchange = () => { inp.style.display = sel.value === '__new' ? '' : 'none'; };
    UI.modal({ title: "I'm funded", body, footer: [{ label: 'Cancel' }, { label: 'Continue the run', cls: 'primary', onClick: c => {
      const account = sel.value === '__new' ? inp.value.trim() : sel.value;
      if (!account) { inp.focus(); return; }
      const pass = U.$('#pmPass', body).value || lastDay;
      Runs.promote(r.id, { account, type: 'Funded', passDate: pass, start: sel.value === '__new' ? U.addDays(pass, 1) : '' });
      c(); App.toast(`${r.name} continues on ${account}`); App.render();
    } }] });
  },

  payoutModal(r) {
    const body = U.h(`<div class="form-row">
      <div><label class="field-label">Date</label><input class="inp" type="date" id="poDate" value="${U.todayKey()}"></div>
      <div><label class="field-label">Amount received ($)</label><input class="inp" type="number" min="0" step="1" id="poAmt" placeholder="e.g. 1500"></div></div>`);
    UI.modal({ title: `Log a payout · ${r.name}`, body, footer: [{ label: 'Cancel' }, { label: 'Save payout', cls: 'primary', onClick: c => {
      const amt = +U.$('#poAmt', body).value;
      if (!amt) { U.$('#poAmt', body).focus(); return; }
      Runs.addPayout(r.id, U.$('#poDate', body).value || U.todayKey(), amt);
      c(); App.toast('Payout logged 💰'); App.render();
    } }] });
  },

  editModal(r) {
    const isNew = !r;
    let color = r ? r.color : Runs.PALETTE.find(c => !Runs.all().some(x => x.color === c)) || Runs.PALETTE[0];
    const stages = r ? r.stages.map(s => ({ ...s })) : [{ id: 's_' + U.uid(), account: Runs.unassigned()[0] || Store.accounts()[0] || '', type: 'Eval', start: '', end: '', result: '' }];
    const body = U.h(`<div>
      <div class="form-row">
        <div><label class="field-label">Run name</label><input class="inp" id="reName" value="${U.esc(r ? r.name : `Run ${Runs.all().length + 1}`)}" placeholder="e.g. Tradeify 50K · Run 2"></div>
        <div><label class="field-label">Line color</label><div class="swatches" id="reColors">${Runs.PALETTE.map(c => `<button type="button" style="--rc:${c}" data-c="${c}" class="${c === color ? 'on' : ''}" aria-label="Color ${c}"></button>`).join('')}</div></div>
      </div>
      <label class="field-label">Stages <span class="help">(in order — e.g. Eval, then Funded)</span></label>
      <div id="reStages"></div>
      <button class="btn sm" id="reAdd" type="button">+ Add stage</button>
      <div class="help" style="margin-top:10px">Leave dates blank to use the account's first and last trade.</div>
    </div>`);
    const accts = Store.accounts();
    const drawStages = () => {
      U.$('#reStages', body).innerHTML = stages.map((s, i) => `<div class="stage-edit" data-i="${i}">
        <div><label class="field-label">Account</label><input class="inp" list="reAccts" data-f="account" value="${U.esc(s.account)}"></div>
        <div><label class="field-label">Type</label><select class="inp" data-f="type">${Runs.TYPES.map(t => `<option ${t === s.type ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label class="field-label">Start</label><input class="inp" type="date" data-f="start" value="${s.start || ''}"></div>
        <div><label class="field-label">End</label><input class="inp" type="date" data-f="end" value="${s.end || ''}"></div>
        <div><label class="field-label">Result</label><select class="inp" data-f="result">${Object.entries(Runs.RESULTS).map(([k, v]) => `<option value="${k}" ${k === (s.result || '') ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <button class="btn sm ghost" type="button" data-del="${i}" title="Remove stage" ${stages.length < 2 ? 'disabled' : ''}>✕</button>
      </div>`).join('') + `<datalist id="reAccts">${accts.map(a => `<option value="${U.esc(a)}">`).join('')}</datalist>`;
      U.$$('[data-f]', body).forEach(inp => inp.oninput = inp.onchange = () => { stages[+inp.closest('[data-i]').dataset.i][inp.dataset.f] = inp.value; });
      U.$$('[data-del]', body).forEach(b => b.onclick = () => { stages.splice(+b.dataset.del, 1); drawStages(); });
    };
    drawStages();
    U.$('#reAdd', body).onclick = () => { stages.push({ id: 's_' + U.uid(), account: '', type: 'Funded', start: '', end: '', result: '' }); drawStages(); };
    U.$$('#reColors button', body).forEach(b => b.onclick = () => { color = b.dataset.c; U.$$('#reColors button', body).forEach(x => x.classList.toggle('on', x === b)); });

    const footer = [];
    if (!isNew) footer.push({ label: 'Delete run', cls: 'danger left', onClick: async c => {
      c();
      if (await UI.confirm('Delete run?', `Removes the <b>${U.esc(r.name)}</b> grouping and its payouts. Your trades are not deleted.`, 'Delete run')) { Runs.remove(r.id); App.toast('Run deleted'); App.render(); }
    } });
    footer.push({ label: 'Cancel' }, { label: isNew ? 'Create run' : 'Save', cls: 'primary', onClick: c => {
      const clean = stages.map(s => ({ ...s, account: (s.account || '').trim() })).filter(s => s.account);
      if (!clean.length) { App.toast('Add at least one account', 'err'); return; }
      const name = U.$('#reName', body).value.trim() || 'Untitled run';
      if (isNew) {
        const run = Runs.create({ name, account: clean[0].account, type: clean[0].type, start: clean[0].start });
        Runs.update(run.id, { color, stages: clean.map((s, i) => ({ ...run.stages[0], ...s, id: i ? 's_' + U.uid() : run.stages[0].id })) });
      } else {
        Runs.update(r.id, { name, color, stages: clean });
      }
      c(); App.toast(isNew ? 'Run created' : 'Run saved'); App.render();
    } });
    UI.modal({ title: isNew ? 'New run' : 'Edit run', body, wide: true, footer });
  },
};

</script>
  <script>
window.Views = window.Views || {};

/* Ledger: every dollar in and out of prop trading — eval fees, resets, data, payouts —
   so the trader sees real take-home and return on what they spent. */
Views.ledger = {
  title: 'Ledger',
  year: null,
  firm: null,
  showAll: false,
  pace: 'year',
  sim: 0, // display-only multiplier for what-if mode; never saved
  TYPES: ['Expense', 'Payout', 'Live P&L'],
  TYPE_LABEL: { Expense: 'Expenses', Payout: 'Payout', 'Live P&L': 'Live P&L' },
  SUBS: [['eval', 'Evaluation'], ['reset', 'Reset'], ['activation', 'Activation fee'], ['instant', 'Instant funded'], ['data', 'Data subscription'], ['other', 'Other']],

  all() { return (Store.data.ledger = Array.isArray(Store.data.ledger) ? Store.data.ledger : []); },
  years() { return [...new Set(this.all().map(e => e.date.slice(0, 4)))].sort(); },

  /* ---------- time period ---------- */
  PERIODS: [['ytd', 'Year to Date'], ['month', 'Monthly'], ['3m', 'Last 3 Months'], ['all', 'All Time'], ['custom', 'Custom']],
  period() {
    const p = (Store.data.settings.ledgerView || {}).period || {};
    const today = U.todayKey(), y = today.slice(0, 4);
    const type = this.PERIODS.some(x => x[0] === p.p) ? p.p : 'ytd';
    const month = p.month || today.slice(0, 7);
    const mName = m => `${U.MONTHS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}`;
    let from, to, label;
    if (type === 'month') {
      from = month + '-01'; const d = U.toLocal(from); to = U.keyOf(new Date(d.getFullYear(), d.getMonth() + 1, 0)); label = `${mName(month)} Performance`;
    } else if (type === '3m') {
      const d = U.toLocal(today); from = U.keyOf(new Date(d.getFullYear(), d.getMonth() - 2, 1)); to = today; label = 'Last 3 Months Performance';
    } else if (type === 'all') {
