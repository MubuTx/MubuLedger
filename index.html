    account: { label: 'Account', key: t => t.account, name: k => k },
    duration: { label: 'Hold time', key: t => { const s = M.holdSec(t); return s < 60 ? 0 : s < 300 ? 1 : s < 900 ? 2 : s < 1800 ? 3 : s < 3600 ? 4 : 5; },
      name: k => ['< 1 min', '1–5 min', '5–15 min', '15–30 min', '30–60 min', '1 hr +'][k], order: (a, b) => a - b },
    month: { label: 'Month', key: t => t.entryTime.slice(0, 7), name: k => `${U.MONTHS[+k.slice(5, 7) - 1].slice(0, 3)} ${k.slice(0, 4)}`, order: (a, b) => a < b ? -1 : 1 },
    rating: { label: 'Execution rating', key: t => t.rating || 0, name: k => k ? '★'.repeat(k) : 'Unrated', order: (a, b) => a - b },
  },

  render(el) {
    if (!Store.data.trades.length) { el.innerHTML = UI.emptyState(); return; }
    el.innerHTML = `
      <div class="tabs page-tabs" id="rTabs">
        <button data-t="performance">Performance</button>
        <button data-t="breakdown">Breakdowns</button>
        <button data-t="calendar">Year calendar</button>
        <div style="margin-left:auto;display:flex;align-items:center"><button class="btn sm" onclick="window.print()">⇩ Export PDF</button></div>
      </div>
      <div id="rBody"></div>`;
    U.$$('#rTabs [data-t]', el).forEach(b => {
      b.classList.toggle('active', b.dataset.t === this.tab);
      b.onclick = () => { this.tab = b.dataset.t; App.render(); };
    });
    const body = U.$('#rBody', el);
    if (this.tab === 'performance') this.performance(body);
    else if (this.tab === 'breakdown') this.breakdownView(body);
    else this.yearView(body);
  },

  groupKey(key, group) {
    if (group === 'week') return U.weekStart(key);
    if (group === 'month') return key.slice(0, 7);
    return key;
  },

  series(trades, cfg) {
    const g = M.groupBy(trades, t => this.groupKey(U.dayKey(t.entryTime), cfg.group));
    const keys = [...g.keys()].sort();
    let running = 0;
    const vals = keys.map(k => {
      const s = M.summarize(g.get(k));
      switch (cfg.metric) {
        case 'cum': running += s.total; return running;
        case 'net': return s.total;
        case 'winrate': return s.winRate * 100;
        case 'pf': return isFinite(s.pf) ? s.pf : null;
        case 'avgwl': return isFinite(s.ratio) ? s.ratio : null;
        case 'expectancy': return s.expectancy;
        case 'trades': return s.count;
        case 'volume': return s.volume;
        case 'fees': return s.fees;
      }
    });
    const labels = keys.map(k => cfg.group === 'month' ? `${U.MONTHS[+k.slice(5, 7) - 1].slice(0, 3)} ${k.slice(2, 4)}` : U.fmtShort(k));
    return { labels, vals: vals.map(v => v == null ? null : +(+v).toFixed(2)) };
  },

  chartPanel(id, cfg) {
    const opts = Object.entries(this.METRICS).map(([k, m]) => `<option value="${k}" ${k === cfg.metric ? 'selected' : ''}>${m.label}</option>`).join('');
    return `<div class="card">
      <div class="metric-bar">
        <select data-panel="${id}" data-f="metric">${opts}</select>
        <select data-panel="${id}" data-f="group" style="margin-left:auto">
          ${['day', 'week', 'month'].map(g => `<option value="${g}" ${g === cfg.group ? 'selected' : ''}>${g[0].toUpperCase() + g.slice(1)}</option>`).join('')}
        </select>
      </div>
      <div class="card-body"><div class="chart-box lg"><canvas id="${id}"></canvas></div></div></div>`;
  },

  drawPanel(el, id, cfg) {
    const trades = App.filtered();
    const box = U.$('#' + id, el).parentElement;
    Charts.destroyIn(box);
    box.innerHTML = `<canvas id="${id}"></canvas>`;
    const cv = U.$('canvas', box);
    const { labels, vals } = this.series(trades, cfg);
    const m = this.METRICS[cfg.metric];
    if (!labels.length) { box.innerHTML = '<div class="no-data">No data in range</div>'; return; }
    if (m.type === 'area') Charts.area(cv, labels, vals);
    else if (m.type === 'bar') Charts.bars(cv, labels, vals, { money: !!m.money, colors: m.money ? null : vals.map(() => '#5867D6') });
    else Charts.lineSeries(cv, labels, vals, { money: !!m.money, pct: !!m.pct, fill: false });
  },

  performance(body) {
    const s = M.summarize(App.filtered());
    const stat = (k, v, cls = '', tip = '') => `<div class="s"><div class="k">${k} ${tip ? UI.info(tip) : ''}</div><div class="v ${cls}">${v}</div></div>`;
    body.innerHTML = `
      <div class="grid g-2">${this.chartPanel('rcLeft', this.left)}${this.chartPanel('rcRight', this.right)}</div>
      <div class="card"><div class="tabs"><button class="active">Summary</button></div>
        <div class="summary-grid">
          ${stat('Net P&L', U.money(s.total), U.cls(s.total))}
          ${stat('Trade expectancy', U.money(s.expectancy), U.cls(s.expectancy), 'Win% × avg win − loss% × avg loss')}
          ${stat('Avg net trade P&L', U.money(s.avgTrade), U.cls(s.avgTrade))}
          ${stat('Avg daily volume', U.num(s.avgDailyVolume))}
          ${stat('Win %', U.pct(s.winRate))}
          ${stat('Avg daily net P&L', U.money(s.avgDay), U.cls(s.avgDay))}
          ${stat('Profit factor', U.num(s.pf))}
          ${stat('Logged days', s.dayCount)}
          ${stat('Avg daily win %', U.pct(s.dayWinRate))}
          ${stat('Avg trade win/loss', U.num(s.ratio))}
          ${stat('Avg winning trade', U.money(s.avgWin), 'pos')}
          ${stat('Avg losing trade', U.money(-s.avgLoss), 'neg')}
          ${stat('Largest winning trade', U.money(s.largestWin), 'pos')}
          ${stat('Largest losing trade', U.money(s.largestLoss), 'neg')}
          ${stat('Best day', U.money(s.bestDay), 'pos')}
          ${stat('Worst day', U.money(s.worstDay), 'neg')}
          ${stat('Max drawdown (trade)', U.money(s.maxDD), 'neg', 'Largest peak-to-trough drop in cumulative net P&L, trade by trade.')}
          ${stat('Max daily net drawdown', U.money(s.maxDailyDD), 'neg', 'Largest peak-to-trough drop using end-of-day equity.')}
          ${stat('Recovery factor', U.num(s.recovery), '', 'Net P&L ÷ max drawdown')}
          ${stat('Best day % of profit', isFinite(s.bestDayShare) ? U.pct(s.bestDayShare, 1) : '—', '', 'Prop-firm consistency check: how much of total profit came from your single best day.')}
          ${stat('Max consecutive wins', s.maxConsecWins)}
          ${stat('Max consecutive losses', s.maxConsecLosses)}
          ${stat('Avg hold time', U.duration(s.avgHold))}
          ${stat('Avg hold — winners / losers', `${U.duration(s.avgWinHold)} / ${U.duration(s.avgLossHold)}`)}
          ${stat('Total trades', s.count)}
          ${stat('Winners / losers / BE', `${s.wins} / ${s.losses} / ${s.be}`)}
          ${stat('Gross P&L', U.money(s.gross), U.cls(s.gross))}
          ${stat('Total commissions', U.money(s.fees))}
        </div></div>`;
    this.drawPanel(body, 'rcLeft', this.left);
    this.drawPanel(body, 'rcRight', this.right);
    U.$$('select[data-panel]', body).forEach(sel => sel.onchange = () => {
      const cfg = sel.dataset.panel === 'rcLeft' ? this.left : this.right;
      cfg[sel.dataset.f] = sel.value;
      this.drawPanel(body, sel.dataset.panel, cfg);
    });
  },

  breakdownView(body) {
    const trades = App.filtered();
    const b = this.BREAKDOWNS[this.breakdown];
    const g = M.groupBy(trades, b.key);
    let keys = [...g.keys()];
    keys.sort(b.order || ((x, y) => M.summarize(g.get(y)).total - M.summarize(g.get(x)).total));
    const rows = keys.map(k => ({ k, name: b.name(k), s: M.summarize(g.get(k)) }));
    body.innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <div class="metric-bar" style="padding-bottom:14px">
          ${Object.entries(this.BREAKDOWNS).map(([k, v]) => `<button class="btn sm ${k === this.breakdown ? 'primary' : ''}" data-b="${k}">${v.label}</button>`).join('')}
        </div></div>
      <div class="grid g-2">
        <div class="card"><div class="card-head"><h3>Net P&amp;L by ${b.label.toLowerCase()}</h3></div><div class="card-body"><div class="chart-box"><canvas id="bk1"></canvas></div></div></div>
        <div class="card"><div class="card-head"><h3>Win % by ${b.label.toLowerCase()}</h3></div><div class="card-body"><div class="chart-box"><canvas id="bk2"></canvas></div></div></div>
      </div>
      <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr>
        <th>${b.label}</th><th class="num">Trades</th><th class="num">Win %</th><th class="num">Net P&amp;L</th><th class="num">Avg trade</th><th class="num">Avg win</th><th class="num">Avg loss</th><th class="num">Profit factor</th><th class="num">Volume</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td><b>${U.esc(r.name)}</b></td><td class="num">${r.s.count}</td><td class="num">${U.pct(r.s.winRate, 1)}</td>
          <td class="num ${U.cls(r.s.total)}"><b>${U.money(r.s.total)}</b></td><td class="num ${U.cls(r.s.avgTrade)}">${U.money(r.s.avgTrade)}</td>
          <td class="num pos">${U.money(r.s.avgWin)}</td><td class="num neg">${U.money(-r.s.avgLoss)}</td><td class="num">${U.num(r.s.pf)}</td><td class="num">${r.s.volume}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="9">No data</td></tr>'}
        </tbody></table></div></div>`;
    U.$$('[data-b]', body).forEach(x => x.onclick = () => { this.breakdown = x.dataset.b; App.render(); });
    if (rows.length) {
      const horiz = rows.length > 8;
      Charts.bars(U.$('#bk1', body), rows.map(r => r.name), rows.map(r => +r.s.total.toFixed(2)), { horizontal: horiz });
      Charts.bars(U.$('#bk2', body), rows.map(r => r.name), rows.map(r => +(r.s.winRate * 100).toFixed(1)), { money: false, pct: true, horizontal: horiz, colors: rows.map(() => '#5867D6') });
    }
  },

  yearView(body) {
    const trades = App.filtered();
    const days = M.days(trades);
    const years = [...new Set(days.map(d => d.key.slice(0, 4)))].sort();
    if (!this.year || !years.includes(this.year)) this.year = years[years.length - 1] || String(new Date().getFullYear());
    const map = new Map(days.map(d => [d.key, d]));
    const y = +this.year;
    let yearNet = 0;
    const months = U.MONTHS.map((name, mi) => {
      const first = new Date(y, mi, 1).getDay(), n = new Date(y, mi + 1, 0).getDate();
      let cells = U.DOW.map(d => `<div class="dw">${d[0]}</div>`).join(''), mNet = 0;
      for (let i = 0; i < first; i++) cells += '<div class="md blank"></div>';
      for (let dn = 1; dn <= n; dn++) {
        const key = `${y}-${U.pad(mi + 1)}-${U.pad(dn)}`, d = map.get(key);
        if (d) mNet += d.net;
        cells += `<div class="md ${d ? (d.net > 0 ? 'win' : d.net < 0 ? 'loss' : 'be') : ''}" ${d ? `data-day="${key}" title="${U.money(d.net)} · ${d.trades.length} trades"` : ''}>${dn}</div>`;
      }
      yearNet += mNet;
      return `<div class="card year-month" style="padding:12px"><h4><span>${name}</span><span class="${U.cls(mNet)}">${mNet ? U.moneyShort(mNet) : ''}</span></h4><div class="mini-grid">${cells}</div></div>`;
    }).join('');
    body.innerHTML = `<div class="card"><div class="cal-head">
        <select class="inp" id="ySel" style="width:auto">${(years.length ? years : [this.year]).map(x => `<option ${x === this.year ? 'selected' : ''}>${x}</option>`).join('')}</select>
        <div class="stats">Year net: <span class="chip ${U.cls(yearNet)}">${U.money(yearNet)}</span></div></div>
        <div class="year-grid">${months}</div></div>`;
    U.$('#ySel', body).onchange = e => { this.year = e.target.value; App.render(); };
    U.$$('[data-day]', body).forEach(c => c.onclick = () => App.go(`#/journal?day=${c.dataset.day}`));
  },
};

</script>
  <script>
window.Views = window.Views || {};

Views.runs = {
  title: 'Runs',

  render(el, params) {
    const runs = Runs.all();
    const order = r => (r.status === 'active' ? 0 : 1);
    const sorted = [...runs].sort((a, b) => order(a) - order(b) || ((Runs.span(b) || {}).from || '').localeCompare((Runs.span(a) || {}).from || ''));
    const free = Runs.unassigned();

    el.innerHTML = `
      <div class="card" style="margin-bottom:16px"><div class="card-body" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:260px">
          <div style="font-weight:600;margin-bottom:4px">Keep your progress when you get promoted</div>
          <div class="help">A <b>run</b> links an eval and the funded account it turned into, so your calendar and stats follow the whole journey instead of resetting at zero. Each run gets its own color line under the days on your P&amp;L calendar.</div>
        </div>
        <button class="btn primary" id="rNew" ${Store.accounts().length ? '' : 'disabled title="Import trades first"'}>+ New run</button>
      </div></div>
      ${free.length && runs.length ? `<div class="result-box warn" style="margin:0 0 16px">${free.length} account${free.length > 1 ? 's are' : ' is'} not in a run yet: ${free.map(a => `<b>${U.esc(a)}</b>`).join(', ')}.</div>` : ''}
      <div id="rList">${sorted.length ? sorted.map(r => this.card(r)).join('') : `<div class="card"><div class="empty">
        <h3>No runs yet</h3><div>Create a run for each eval you start. When you pass, click <b>I'm funded</b> and pick the funded account — the run keeps going.</div>
        <div class="actions">${Store.accounts().length ? '<button class="btn primary" data-new>Create your first run</button>' : '<a class="btn primary" href="#/import">Import trades first</a>'}<button class="btn" data-demo>Load demo data</button></div></div></div>`}</div>`;

    sorted.forEach(r => this.chart(el, r));
    const newBtn = () => this.editModal(null);
    U.$('#rNew', el).onclick = newBtn;
    U.$$('[data-new]', el).forEach(b => b.onclick = newBtn);
    U.$$('[data-act]', el).forEach(b => b.onclick = () => this.action(b.dataset.act, b.dataset.run, b.dataset.pid));
    if (params.id) setTimeout(() => document.getElementById('run-' + params.id)?.scrollIntoView({ behavior: 'smooth' }), 60);
  },

  card(r) {
    const sm = Runs.summary(r);
    const st = Runs.statusLabel(r);
    const last = r.stages[r.stages.length - 1];
    const canPromote = r.status === 'active' && last && last.type === 'Eval';
    const funded = r.stages.some(s => s.type !== 'Eval');
    const sp = sm.span;
    const stagesHtml = sm.stages.map((s, i) => `
      ${i ? '<div class="stage-arrow">→</div>' : ''}
      <div class="stage st-${s.type.toLowerCase()}" style="--rc:${r.color}">
        <div class="k"><span>${s.type}</span><span class="pill ${s.result === 'blown' ? 'r' : s.result === 'passed' || s.result === 'payout' ? 'g' : 'b'}">${s.result ? Runs.RESULTS[s.result] : (r.status === 'active' && i === sm.stages.length - 1 ? 'Active' : 'Ended')}</span></div>
        <div class="acct" title="${U.esc(s.account)}">${U.esc(s.account)}</div>
        <div class="meta">${U.fmtShort(s.from)} → ${U.fmtShort(s.to)}<br>${s.days} trading day${s.days === 1 ? '' : 's'} · ${s.trades} trades<br>Net <b class="${U.cls(s.net)}">${U.money(s.net)}</b></div>
      </div>`).join('');
    return `<div class="card run-card" id="run-${r.id}" style="--rc:${r.color}">
      <div class="card-head">
        <span class="run-dot"></span>
        <div><div class="run-title">${U.esc(r.name)}</div><div class="run-dates">${sp ? `${U.fmtDate(sp.from)} → ${r.status === 'active' ? 'today' : U.fmtDate(sp.to)}` : 'No trades yet in these accounts'}</div></div>
        <span class="pill ${st.cls}" style="margin-left:6px">${st.text}</span>
        <div class="right">
          ${canPromote ? `<button class="btn sm primary" data-act="promote" data-run="${r.id}">🎉 I'm funded</button>` : ''}
          ${funded && r.status === 'active' ? `<button class="btn sm" data-act="payout" data-run="${r.id}">+ Payout</button>` : ''}
          ${r.status === 'active' ? `<button class="btn sm danger" data-act="blown" data-run="${r.id}">Mark blown</button>` : `<button class="btn sm" data-act="reopen" data-run="${r.id}">Reopen</button>`}
          <button class="btn sm ghost" data-act="edit" data-run="${r.id}">Edit</button>
        </div>
      </div>
      <div class="card-body">
        <div class="stages">${stagesHtml || '<div class="help">This run has no stages with trades yet.</div>'}</div>
        <div class="run-kpis">
          <div><div class="k">Run net P&amp;L</div><div class="v ${U.cls(sm.s.total)}">${U.money(sm.s.total)}</div></div>
          <div><div class="k">Payouts</div><div class="v ${sm.payouts ? 'pos' : ''}">${U.money(sm.payouts)}</div></div>
          <div><div class="k">Trading days</div><div class="v">${sm.s.dayCount}</div></div>
          <div><div class="k">Calendar days</div><div class="v">${sm.calendarDays}</div></div>
          <div><div class="k">Win % · PF</div><div class="v">${U.pct(sm.s.winRate, 0)} · ${U.num(sm.s.pf)}</div></div>
          <div><div class="k">Max drawdown</div><div class="v neg">${U.money(sm.s.maxDD)}</div></div>
        </div>
        <div class="chart-box sm"><canvas id="rc-${r.id}"></canvas></div>
        ${(r.payouts || []).length ? `<div class="list-rows" style="margin-top:10px">${r.payouts.map(p => `<div class="row"><span>💰 Payout · ${U.fmtLong(p.date)}</span><b class="pos" style="margin-left:auto">${U.money(p.amount)}</b><button class="btn sm ghost" data-act="delpay" data-run="${r.id}" data-pid="${p.id}" title="Remove payout">✕</button></div>`).join('')}</div>` : ''}
      </div></div>`;
  },

  chart(el, r) {
    const cv = U.$('#rc-' + r.id, el);
    if (!cv) return;
    const sm = Runs.summary(r);
    const days = M.days(sm.trades);
    if (!days.length) { cv.parentElement.innerHTML = '<div class="no-data">No trades in this run yet</div>'; return; }
    const stageOfDay = d => Math.min(...d.trades.map(t => t._stage));
    let cum = 0;
    const pts = days.map(d => { cum += d.net; return { key: d.key, y: +cum.toFixed(2), stage: stageOfDay(d) }; });
    const labels = pts.map(p => U.fmtShort(p.key));
    const stageIdx = [...new Set(pts.map(p => p.stage))];
    const stInfo = Runs.stagesOf(r);
    const datasets = stageIdx.map(si => {
      const type = (stInfo.find(s => s.index === si) || {}).type || 'Eval';
      const data = pts.map((p, i) => (p.stage === si || (pts[i + 1] && pts[i + 1].stage === si && p.stage !== si) ? p.y : null));
      return { label: type, data, borderColor: r.color, backgroundColor: r.color + '22', fill: 'origin', borderWidth: 2.2, tension: .25, spanGaps: false,
        borderDash: type === 'Eval' ? [6, 4] : [], pointRadius: pts.length < 40 ? 2 : 0, pointBackgroundColor: r.color };
    });
    const payKeys = new Map((r.payouts || []).map(p => [p.date, p]));
    datasets.push({ label: 'Payout', data: pts.map(p => (payKeys.has(p.key) ? p.y : null)), showLine: false, pointRadius: 7, pointHoverRadius: 9,
      pointStyle: 'rectRot', pointBackgroundColor: '#12A06A', pointBorderColor: '#fff', pointBorderWidth: 2 });
    const promos = stInfo.filter(s => s.index > 0).map(s => s.from);
    datasets.push({ label: 'Promoted', data: pts.map((p, i) => (promos.some(k => p.key >= k && (i === 0 || pts[i - 1].key < k)) ? p.y : null)), showLine: false,
      pointRadius: 7, pointStyle: 'triangle', pointBackgroundColor: r.color, pointBorderColor: '#fff', pointBorderWidth: 2 });
    Charts.make(cv, {
      type: 'line', data: { labels, datasets },
      options: {
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: true, position: 'bottom', labels: { boxWidth: 18, boxHeight: 2, usePointStyle: false, filter: (it, data) => !['Payout', 'Promoted'].includes(it.text) && data.datasets[it.datasetIndex].data.some(v => v != null) } },
          tooltip: {
            filter: (it, i, items) => ['Payout', 'Promoted'].includes(it.dataset.label) || items.findIndex(x => x.dataIndex === it.dataIndex && !['Payout', 'Promoted'].includes(x.dataset.label)) === i,
            callbacks: { title: items => items.length ? U.fmtLong(pts[items[0].dataIndex].key) : '', label: ctx => {
            const p = pts[ctx.dataIndex];
            if (ctx.dataset.label === 'Payout') return `💰 Payout ${U.money(payKeys.get(p.key).amount)}`;
            if (ctx.dataset.label === 'Promoted') return '▲ Promoted to the next stage';
            return `${ctx.dataset.label}: ${U.money(ctx.parsed.y)} run total`;
          } } },
        },
        scales: { x: { grid: { display: false }, border: { display: false }, ticks: { maxTicksLimit: 8, maxRotation: 0 } },
          y: { grid: { color: '#EEF1F6' }, border: { display: false }, ticks: { callback: v => U.moneyAxis(v), maxTicksLimit: 6 } } },
      },
    });
  },

  action(act, id, pid) {
    const r = Runs.get(id);
    if (!r) return;
    if (act === 'edit') return this.editModal(r);
    if (act === 'promote') return this.promoteModal(r);
    if (act === 'payout') return this.payoutModal(r);
    if (act === 'delpay') { Runs.removePayout(id, pid); App.toast('Payout removed'); return App.render(); }
    if (act === 'reopen') { Runs.setStatus(id, 'active'); App.toast('Run reopened'); return App.render(); }
    if (act === 'blown') {
      UI.confirm('Mark run as blown?', `This ends <b>${U.esc(r.name)}</b>. Its line stops on the last trading day, and its history is kept.`, 'Mark blown').then(ok => {
        if (ok) { Runs.setStatus(id, 'blown'); App.toast('Run marked as blown — onto the next one'); App.render(); }
      });
    }
  },

  accountOptions(selected, preferFree = true) {
    const free = Runs.unassigned();
    const all = Store.accounts();
    const ordered = preferFree ? [...free, ...all.filter(a => !free.includes(a))] : all;
    return ordered.map(a => `<option ${a === selected ? 'selected' : ''}>${U.esc(a)}</option>`).join('') + '<option value="__new">+ Account not imported yet…</option>';
  },

  promoteModal(r) {
    const cur = r.stages[r.stages.length - 1];
    const lastDay = Runs.accountRange(cur.account).last || U.todayKey();
    const body = U.h(`<div>
      <p style="margin-top:0;line-height:1.6">Nice work 🎉 — <b>${U.esc(cur.account)}</b> is marked as <b>passed</b>, and <b>${U.esc(r.name)}</b> continues on the account you pick below. Your progression stays in one line.</p>
      <div class="form-row">
        <div><label class="field-label">Passed on</label><input class="inp" type="date" id="pmPass" value="${lastDay}"></div>
        <div><label class="field-label">New stage</label><select class="inp" id="pmType">${Runs.TYPES.filter(t => t !== 'Eval').map(t => `<option>${t}</option>`).join('')}</select></div>
      </div>
      <label class="field-label">Funded account</label>
      <select class="inp" id="pmAcct">${this.accountOptions('', true)}</select>
      <input class="inp" id="pmNew" placeholder="Name it exactly as you'll import it, e.g. Tradeify Funded 50K" style="margin-top:8px;display:none">
      <div class="help" style="margin-top:8px">Haven't imported the funded account yet? Pick “Account not imported yet”, type its name, and import its CSV under that same name later — it'll join this run automatically.</div>
    </div>`);
    const sel = U.$('#pmAcct', body), inp = U.$('#pmNew', body);
    const free = Runs.unassigned().filter(a => a !== cur.account);
    if (!free.length) { sel.value = '__new'; inp.style.display = ''; }
    else sel.value = free[0];
    sel.onchange = () => { inp.style.display = sel.value === '__new' ? '' : 'none'; };
    UI.modal({ title: "I'm funded", body, footer: [{ label: 'Cancel' }, { label: 'Continue the run', cls: 'primary', onClick: c => {
      const account = sel.value === '__new' ? inp.value.trim() : sel.value;
      if (!account) { inp.focus(); return; }
      const pass = U.$('#pmPass', body).value || lastDay;
      Runs.promote(r.id, { account, type: U.$('#pmType', body).value, passDate: pass, start: sel.value === '__new' ? U.addDays(pass, 1) : '' });
      c(); App.toast(`${r.name} continues on ${account}`); App.render();
    } }] });
  },

  payoutModal(r) {
    const body = U.h(`<div class="form-row">
      <div><label class="field-label">Date</label><input class="inp" type="date" id="poDate" value="${U.todayKey()}"></div>
      <div><label class="field-label">Amount received ($)</label><input class="inp" type="number" min="0" step="1" id="poAmt" placeholder="e.g. 1500"></div></div>`);
    UI.modal({ title: `Log a payout · ${r.name}`, body, footer: [{ label: 'Cancel' }, { label: 'Save payout', cls: 'primary', onClick: c => {
      const amt = +U.$('#poAmt', body).value;
      if (!amt) { U.$('#poAmt', body).focus(); return; }
      Runs.addPayout(r.id, U.$('#poDate', body).value || U.todayKey(), amt);
      c(); App.toast('Payout logged 💰'); App.render();
    } }] });
  },

  editModal(r) {
    const isNew = !r;
    let color = r ? r.color : Runs.PALETTE.find(c => !Runs.all().some(x => x.color === c)) || Runs.PALETTE[0];
    const stages = r ? r.stages.map(s => ({ ...s })) : [{ id: 's_' + U.uid(), account: Runs.unassigned()[0] || Store.accounts()[0] || '', type: 'Eval', start: '', end: '', result: '' }];
    const body = U.h(`<div>
      <div class="form-row">
        <div><label class="field-label">Run name</label><input class="inp" id="reName" value="${U.esc(r ? r.name : `Run ${Runs.all().length + 1}`)}" placeholder="e.g. Tradeify 50K · Run 2"></div>
        <div><label class="field-label">Line color</label><div class="swatches" id="reColors">${Runs.PALETTE.map(c => `<button type="button" style="--rc:${c}" data-c="${c}" class="${c === color ? 'on' : ''}" aria-label="Color ${c}"></button>`).join('')}</div></div>
      </div>
      <label class="field-label">Stages <span class="help">(in order — e.g. Eval, then Funded)</span></label>
      <div id="reStages"></div>
      <button class="btn sm" id="reAdd" type="button">+ Add stage</button>
      <div class="help" style="margin-top:10px">Leave dates blank to use the account's first and last trade.</div>
    </div>`);
    const accts = Store.accounts();
    const drawStages = () => {
      U.$('#reStages', body).innerHTML = stages.map((s, i) => `<div class="stage-edit" data-i="${i}">
        <div><label class="field-label">Account</label><input class="inp" list="reAccts" data-f="account" value="${U.esc(s.account)}"></div>
        <div><label class="field-label">Type</label><select class="inp" data-f="type">${Runs.TYPES.map(t => `<option ${t === s.type ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label class="field-label">Start</label><input class="inp" type="date" data-f="start" value="${s.start || ''}"></div>
        <div><label class="field-label">End</label><input class="inp" type="date" data-f="end" value="${s.end || ''}"></div>
        <div><label class="field-label">Result</label><select class="inp" data-f="result">${Object.entries(Runs.RESULTS).map(([k, v]) => `<option value="${k}" ${k === (s.result || '') ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <button class="btn sm ghost" type="button" data-del="${i}" title="Remove stage" ${stages.length < 2 ? 'disabled' : ''}>✕</button>
      </div>`).join('') + `<datalist id="reAccts">${accts.map(a => `<option value="${U.esc(a)}">`).join('')}</datalist>`;
      U.$$('[data-f]', body).forEach(inp => inp.oninput = inp.onchange = () => { stages[+inp.closest('[data-i]').dataset.i][inp.dataset.f] = inp.value; });
      U.$$('[data-del]', body).forEach(b => b.onclick = () => { stages.splice(+b.dataset.del, 1); drawStages(); });
    };
    drawStages();
    U.$('#reAdd', body).onclick = () => { stages.push({ id: 's_' + U.uid(), account: '', type: 'Funded', start: '', end: '', result: '' }); drawStages(); };
    U.$$('#reColors button', body).forEach(b => b.onclick = () => { color = b.dataset.c; U.$$('#reColors button', body).forEach(x => x.classList.toggle('on', x === b)); });

    const footer = [];
    if (!isNew) footer.push({ label: 'Delete run', cls: 'danger left', onClick: async c => {
      c();
      if (await UI.confirm('Delete run?', `Removes the <b>${U.esc(r.name)}</b> grouping and its payouts. Your trades are not deleted.`, 'Delete run')) { Runs.remove(r.id); App.toast('Run deleted'); App.render(); }
    } });
    footer.push({ label: 'Cancel' }, { label: isNew ? 'Create run' : 'Save', cls: 'primary', onClick: c => {
      const clean = stages.map(s => ({ ...s, account: (s.account || '').trim() })).filter(s => s.account);
      if (!clean.length) { App.toast('Add at least one account', 'err'); return; }
      const name = U.$('#reName', body).value.trim() || 'Untitled run';
      if (isNew) {
        const run = Runs.create({ name, account: clean[0].account, type: clean[0].type, start: clean[0].start });
        Runs.update(run.id, { color, stages: clean.map((s, i) => ({ ...run.stages[0], ...s, id: i ? 's_' + U.uid() : run.stages[0].id })) });
      } else {
        Runs.update(r.id, { name, color, stages: clean });
      }
      c(); App.toast(isNew ? 'Run created' : 'Run saved'); App.render();
    } });
    UI.modal({ title: isNew ? 'New run' : 'Edit run', body, wide: true, footer });
  },
};

</script>
  <script>
window.Views = window.Views || {};

Views.import = {
  title: 'Import Trades',
  pending: null, // { files:[{name, result, error}] }

  render(el) {
    const accounts = Store.accounts().filter(a => !/^Demo\b/.test(a));
    const last = Store.data.imports.find(i => i.id !== 'demo' && !/^Demo\b/.test(i.account));
    const defaultAcct = last ? last.account : (accounts[0] || '');
    el.innerHTML = `
      <div class="grid g-2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
        <div class="card">
          <div class="card-head"><h3>Import CSV</h3></div>
          <div class="card-body">
            <div class="form-row">
              <div><label class="field-label">Account</label>
                <select class="inp" id="impAcct">
                  ${accounts.map(a => `<option ${a === defaultAcct ? 'selected' : ''}>${U.esc(a)}</option>`).join('')}
                  <option value="__new" ${!accounts.length ? 'selected' : ''}>+ New account…</option>
                </select></div>
              <div id="newAcctWrap" style="${accounts.length ? 'display:none' : ''}"><label class="field-label">New account name</label>
                <input class="inp" id="impNewAcct" placeholder="e.g. Tradeify 50K #1"></div>
            </div>
            <label class="dropzone" id="drop">
              <input type="file" id="impFile" accept=".csv,text/csv" multiple hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
              <div class="big">Drop your CSV here or click to browse</div>
              <div class="help">You can drop several files at once. Trades already in your journal are skipped automatically.</div>
            </label>
            <div id="impPreview"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Daily routine</h3></div>
          <div class="card-body">
            <ol class="steps">
              <li>In Tradovate, open <b>Account Reports → Performance</b>, pick today (or the whole week), and click <b>Download / Export CSV</b>.</li>
              <li>Come here, pick the account, and drop the file in.</li>
              <li>Exporting overlapping date ranges is fine — duplicates are detected and skipped.</li>
              <li>Open the <a href="#/journal">Daily Journal</a> and write your notes while the session is fresh.</li>
            </ol>
            <div class="help" style="margin-top:14px">
              <b>Formats recognised</b><br>
              • Tradovate <b>Performance</b> export (<code>buyPrice, sellPrice, pnl, boughtTimestamp, soldTimestamp</code>) — best option.<br>
              • TradingView <b>trade history</b> export (<code>Trade number, Type, Date and time, Price, Net PnL</code>).<br>
              • Any closed-trades CSV with a P&amp;L column (date, symbol, side, qty, entry, exit, pnl, fees) — see <code>sample-data/template-trades.csv</code>.<br>
              • Fills / Orders exports (<code>B/S, Contract, Qty, Price, Fill Time</code>) — fills are paired FIFO into round trips using contract point values.<br><br>
              Tradovate's Performance P&amp;L does <b>not</b> include commissions — set your per-contract round-turn cost in <a href="#/settings">Settings</a> and it's applied everywhere.
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Import history</h3><span class="help">Undo removes exactly the trades that import added.</span></div>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Imported</th><th>File</th><th>Account</th><th>Format</th><th class="num">Added</th><th class="num">Skipped (dupes)</th><th>Range</th><th></th></tr></thead>
        <tbody>${Store.data.imports.map(i => `<tr>
          <td>${U.fmtDateTime(i.at)}</td><td><b>${U.esc(i.file)}</b></td><td>${U.esc(i.account)}</td><td class="help">${U.esc(i.format)}</td>
          <td class="num">${i.added}</td><td class="num">${i.dupes}</td><td class="help">${i.from ? `${U.fmtDate(i.from)} → ${U.fmtDate(i.to)}` : '—'}</td>
          <td class="num"><button class="btn sm danger" data-undo="${i.id}">Undo</button></td></tr>`).join('') || '<tr class="empty-row"><td colspan="8">No imports yet</td></tr>'}</tbody></table></div>
      </div>`;

    const acctSel = U.$('#impAcct', el), newWrap = U.$('#newAcctWrap', el);
    acctSel.onchange = () => { newWrap.style.display = acctSel.value === '__new' ? '' : 'none'; if (this.pending) this.showPreview(el); };
    U.$('#impNewAcct', el).addEventListener('input', U.debounce(() => this.pending && this.showPreview(el), 300));
    const drop = U.$('#drop', el), input = U.$('#impFile', el);
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', e => this.handleFiles(el, [...e.dataTransfer.files]));
    input.onchange = () => { this.handleFiles(el, [...input.files]); input.value = ''; };
    U.$$('[data-undo]', el).forEach(b => b.onclick = async () => {
      const imp = Store.data.imports.find(i => i.id === b.dataset.undo);
      if (await UI.confirm('Undo import?', `Remove the ${imp.added} trade(s) added from <b>${U.esc(imp.file)}</b>?`, 'Remove trades')) {
        Store.undoImport(imp.id); App.toast('Import undone'); App.render();
      }
    });
    if (this.pending) this.showPreview(el);
  },

  account(el) {
    const v = U.$('#impAcct', el).value;
    return v === '__new' ? U.$('#impNewAcct', el).value.trim() : v;
  },

  async handleFiles(el, files) {
    files = files.filter(f => /\.csv$/i.test(f.name) || f.type.includes('csv') || f.type === 'text/plain');
    if (!files.length) { App.toast('Please choose a .csv file', 'err'); return; }
    const opts = { pointValues: Store.data.settings.pointValues };
    const parsed = [];
    for (const f of files) {
      try { parsed.push({ name: f.name, result: Parser.parse(await U.readFile(f), opts) }); }
      catch (e) { parsed.push({ name: f.name, error: e.message }); }
    }
    this.pending = { files: parsed };
    this.showPreview(el);
  },

  /* Build final trades for the chosen account and split new vs duplicate. */
  prepare(acct) {
    const existing = Store.idSet();
    const seen = new Set();
    return this.pending.files.map(f => {
      if (f.error) return { ...f };
      const fresh = [], dupes = [];
      f.result.trades.forEach(t => {
        const account = (t.account && t.account.trim()) || acct;
        const id = U.hash(account + '|' + t.baseId);
        const full = { ...t, id, account, setup: t.setup || '', notes: t.notes || '', tags: [], rating: 0 };
        delete full.baseId;
        if (existing.has(id) || seen.has(id)) dupes.push(full); else { seen.add(id); fresh.push(full); }
      });
      return { ...f, fresh, dupes };
    });
  },

  showPreview(el) {
    const box = U.$('#impPreview', el);
    const acct = this.account(el);
    const prep = this.prepare(acct || '(no account)');
    const totalNew = prep.reduce((a, f) => a + (f.fresh ? f.fresh.length : 0), 0);
    const needsAcct = prep.some(f => f.fresh && f.fresh.some(t => t.account === '(no account)'));
    box.innerHTML = prep.map(f => {
      if (f.error) return `<div class="result-box err"><b>${U.esc(f.name)}</b> — ${U.esc(f.error)}</div>`;
      const sample = f.fresh.slice(0, 6);
      const net = f.fresh.reduce((a, t) => a + M.net(t), 0);
      return `<div class="result-box ${f.fresh.length ? 'ok' : 'warn'}">
        <b>${U.esc(f.name)}</b> · ${U.esc(f.result.format)}<br>
        <b>${f.fresh.length}</b> new trade${f.fresh.length === 1 ? '' : 's'}${f.fresh.length ? ` (net ${U.money(net)})` : ''}, <b>${f.dupes.length}</b> already in your journal.
        ${f.result.warnings.map(w => `<br>⚠ ${U.esc(w)}`).join('')}
      </div>
      ${sample.length ? `<div class="table-wrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>Date</th><th>Symbol</th><th>Side</th><th class="num">Qty</th><th class="num">Entry</th><th class="num">Exit</th><th class="num">Net P&amp;L</th></tr></thead><tbody>
        ${sample.map(t => { const n = M.net(t); return `<tr><td>${U.fmtDateTime(t.entryTime)}</td><td>${U.esc(t.symbol)}</td><td><span class="side ${t.side.toLowerCase()}">${t.side}</span></td><td class="num">${t.qty}</td><td class="num">${U.price(t.entryPrice)}</td><td class="num">${U.price(t.exitPrice)}</td><td class="num ${U.cls(n)}">${U.money(n)}</td></tr>`; }).join('')}
        ${f.fresh.length > sample.length ? `<tr><td colspan="7" class="help">…and ${f.fresh.length - sample.length} more</td></tr>` : ''}
      </tbody></table></div>` : ''}`;
    }).join('') + `<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn" id="impCancel">Cancel</button>
        <button class="btn primary" id="impGo" ${!totalNew ? 'disabled' : ''}>Import ${totalNew} trade${totalNew === 1 ? '' : 's'}</button></div>`;

    U.$('#impCancel', box).onclick = () => { this.pending = null; box.innerHTML = ''; };
    U.$('#impGo', box).onclick = () => {
      if (needsAcct && !acct) { App.toast('Enter an account name first', 'err'); U.$('#impNewAcct', el).focus(); return; }
      let added = 0;
      prep.forEach(f => {
        if (!f.fresh || !f.fresh.length) return;
        const id = U.uid();
        const keys = f.fresh.map(t => U.dayKey(t.entryTime)).sort();
        f.fresh.forEach(t => { t.importId = id; });
        Store.commitImport({ id, at: U.isoOf(new Date()), file: f.name, account: f.fresh[0].account, format: f.result.format,
          added: f.fresh.length, dupes: f.dupes.length, from: keys[0], to: keys[keys.length - 1] }, f.fresh);
        added += f.fresh.length;
        App.calMonth = keys[keys.length - 1].slice(0, 7);
      });
      this.pending = null;
      App.toast(`Imported ${added} trade${added === 1 ? '' : 's'}`);
      App.refreshFilters();
      App.go('#/dashboard');
    };
  },
};

</script>

            <button class="btn" id="sDemo">${App.hasDemo() ? 'Remove demo data' : 'Load demo data'}</button>
            <button class="btn danger" id="sClear" style="margin-left:auto">Delete everything</button>
          </div>
          <div class="danger-zone">
            <div><b>Delete my account</b><div class="help">Permanently deletes your login, trades, notes and settings from our servers and this browser. This cannot be undone — export a backup first if you want a copy.</div></div>

/* Accounts + cloud sync through Supabase.
   Each user has one row in public.journals holding their whole journal (trades, notes, settings) as JSON.
   The browser keeps a cached copy so pages load instantly; every change is pushed to the cloud a moment later. */
const Cloud = (() => {
  const SUPABASE_URL = 'https://vfpjddkmdirhwekcaubn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_-u5S2qowcoOJz10EtW43aA_6eW7af8y'; // publishable key — safe in a public page

  let sb = null, timer = null, saving = false, again = false, status = 'idle';
  const C = { user: null };

  function client() {
    if (sb) return sb;
    if (!window.supabase || !window.supabase.createClient) throw new Error('Could not load the sign-in service. Check your internet connection and refresh.');
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' },
    });
    return sb;
  }
  const redirectUrl = () => location.origin + location.pathname;

  /* ---------- status indicator ---------- */
  function setStatus(s) {
    status = s;
    const el = document.getElementById('syncStatus');
    if (!el) return;
    const map = {
      idle: ['', 'Synced'], saved: ['ok', 'All changes saved'], pending: ['busy', 'Saving…'], saving: ['busy', 'Saving…'],
      error: ['err', 'Not saved — retrying'], offline: ['err', 'Offline — will sync when back'],
    };
    const [cls, txt] = map[s] || map.idle;
    el.className = 'sync ' + cls;
    el.textContent = txt;
  }

  /* ---------- sync ---------- */
  async function pull() {
    const { data, error } = await client().from('journals').select('data, updated_at').eq('user_id', C.user.id).maybeSingle();
    if (error) throw error;
    return data;
  }

  async function push() {
    if (!C.user) return;
    if (saving) { again = true; return; }
    if (!navigator.onLine) { setStatus('offline'); return; }
    saving = true; setStatus('saving');
    const now = new Date().toISOString();
    try {
      const { error } = await client().from('journals').upsert({ user_id: C.user.id, data: Store.data, updated_at: now });
      if (error) throw error;
      Store.setMeta({ dirty: false, syncedAt: now });
      setStatus('saved');
    } catch (e) {
      console.error('Sync failed', e);
      setStatus('error');
      clearTimeout(timer); timer = setTimeout(push, 15000);
    } finally {
      saving = false;
      if (again) { again = false; queue(); }
    }
  }

  function queue(delay = 1200) {
    clearTimeout(timer);
    setStatus('pending');
    timer = setTimeout(push, delay);
  }
  function flush() { if (Store.meta().dirty) { clearTimeout(timer); push(); } }

  /* Decide which copy wins when the app opens. */
  async function loadForUser(user) {
    C.user = user;
    Store.useUser(user.id);
    Store.load();
    const meta = Store.meta();
    let remote = null;
    try { remote = await pull(); }
    catch (e) {
      console.error(e);
      setStatus('offline');
      App.toast('Could not reach the server — showing the copy saved on this device.', 'err');
      return;
    }
    if (remote) {
      const localNewer = meta.dirty && meta.localAt && meta.localAt > remote.updated_at;
      if (localNewer) { push(); }
      else Store.setFromRemote(remote.data, remote.updated_at);
    } else {
      // First sign-in: bring over anything saved in this browser before accounts existed.
      const legacy = Store.legacyData();
      if (!Store.data.trades.length && legacy && (legacy.trades.length || Object.keys(legacy.notes || {}).length)) {
        Store.data = Store.normalize(legacy);
        Store.retireLegacy();
        setTimeout(() => App.toast(`Moved ${legacy.trades.length} trades from this browser into your account`), 600);
      }
      Store.save();
      await push();
    }
    setStatus('saved');
  }

  /* Pick up changes made on another device when this tab comes back into focus. */
  async function refreshIfStale() {
    if (!C.user || saving || Store.meta().dirty) return;
    try {
      const remote = await pull();
      const meta = Store.meta();
      if (remote && (!meta.syncedAt || remote.updated_at > meta.syncedAt)) {
        Store.setFromRemote(remote.data, remote.updated_at);
        App.loadFilters(); App.refreshFilters(); App.render();
        App.toast('Updated with changes from another device');
      }
    } catch (e) { /* ignore */ }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush(); else refreshIfStale();
  });
  window.addEventListener('online', () => { if (Store.meta && Store.meta().dirty) queue(200); });
  window.addEventListener('beforeunload', e => {
    if (C.user && (saving || Store.meta().dirty)) { flush(); e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------- auth ---------- */
  async function session() {
    const { data } = await client().auth.getSession();
    return data.session;
  }
  async function signIn(email, password) {
    const { data, error } = await client().auth.signInWithPassword({ email, password });
    if (error) throw error;
    return data.session;
  }
  async function signUp(email, password) {
    const { data, error } = await client().auth.signUp({ email, password, options: { emailRedirectTo: redirectUrl() } });
    if (error) throw error;
    return data; // data.session is null when email confirmation is required
  }
  async function resetPassword(email) {
    const { error } = await client().auth.resetPasswordForEmail(email, { redirectTo: redirectUrl() });
    if (error) throw error;
  }
  async function updatePassword(password) {
    const { error } = await client().auth.updateUser({ password });
    if (error) throw error;
  }
  async function signOut() {
    if (Store.meta().dirty) { clearTimeout(timer); await push(); }
    await client().auth.signOut();
    history.replaceState(null, '', redirectUrl());
    location.reload();
  }
  /* Permanently deletes the signed-in user's login and journal (server function delete_my_account). */
  async function deleteAccount() {
    clearTimeout(timer);
    const user = C.user;
    C.user = null; // stop any further syncing so nothing re-creates the row
    const { error } = await client().rpc('delete_my_account');
    if (error) { C.user = user; throw error; }
    try {
      Object.keys(localStorage).filter(k => k.startsWith('mubu-journal-v1:' + user.id)).forEach(k => localStorage.removeItem(k));
    } catch (e) {}
    try { await client().auth.signOut({ scope: 'local' }); } catch (e) {}
    history.replaceState(null, '', redirectUrl());
    location.reload();
  }
  function onAuth(cb) { client().auth.onAuthStateChange((event, s) => cb(event, s)); }

  return Object.assign(C, { client, queue, flush, loadForUser, session, signIn, signUp, resetPassword, updatePassword, signOut, deleteAccount, onAuth, setStatus });
})();

const Auth = (() => {

  let booted = false;

  const screen = () => document.getElementById('auth');

  function show(m, msg = '', kind = '') {
    mode = m;
    document.getElementById('app').style.display = 'none';
    const el = screen();
    el.hidden = false;
    const titles = { signin: 'Sign in to your journal', signup: 'Create your account', forgot: 'Reset your password', recover: 'Choose a new password' };
    const btn = { signin: 'Sign in', signup: 'Create account', forgot: 'Send reset link', recover: 'Save new password' };
    el.innerHTML = `
      <div class="auth-card">
        <div class="auth-brand"><div class="logo"><svg viewBox="0 0 32 32"><path d="M7 23V9l9 9 9-9v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span>MUBU JOURNAL</span></div>
        <h2>${titles[m]}</h2>
        ${msg ? `<div class="result-box ${kind || 'warn'}" style="margin:0 0 14px">${msg}</div>` : ''}
        <form id="authForm" novalidate>
          ${m !== 'recover' ? `<label class="field-label" for="aEmail">Email</label>
            <input class="inp" id="aEmail" type="email" autocomplete="email" required>` : ''}
          ${m === 'signin' || m === 'signup' || m === 'recover' ? `<label class="field-label" for="aPass" style="margin-top:12px">${m === 'recover' ? 'New password' : 'Password'}</label>
            <input class="inp" id="aPass" type="password" autocomplete="${m === 'signin' ? 'current-password' : 'new-password'}" minlength="8" required>` : ''}
          ${m === 'signup' || m === 'recover' ? `<div class="help" style="margin-top:6px">At least 8 characters.</div>` : ''}
          <button class="btn primary auth-submit" type="submit">${btn[m]}</button>
        </form>
        <div class="auth-links">
          ${m === 'signin' ? `<a href="#" data-m="forgot">Forgot password?</a><span>New here? <a href="#" data-m="signup">Create an account</a></span>` : ''}
          ${m === 'signup' ? `<span>Already have an account? <a href="#" data-m="signin">Sign in</a></span>` : ''}
          ${m === 'forgot' ? `<a href="#" data-m="signin">Back to sign in</a>` : ''}
        </div>
      </div>`;
    el.querySelectorAll('[data-m]').forEach(a => a.onclick = e => { e.preventDefault(); show(a.dataset.m); });
    const f = document.getElementById('authForm');
    f.onsubmit = e => { e.preventDefault(); submit(f); };
    const first = f.querySelector('input'); if (first) first.focus();
  }

  async function submit(f) {

    const email = (f.querySelector('#aEmail')?.value || '').trim();
    const pass = f.querySelector('#aPass')?.value || '';
    if (mode !== 'recover' && !/^\S+@\S+\.\S+$/.test(email)) return show(mode, 'Enter a valid email address.', 'err');
    if ((mode === 'signup' || mode === 'recover') && pass.length < 8) return show(mode, 'Password must be at least 8 characters.', 'err');
    btn.disabled = true; btn.textContent = 'Please wait…';
    try {
      if (mode === 'signin') {
        const s = await Cloud.signIn(email, pass);
        await enter(s.user);
      } else if (mode === 'signup') {
        const r = await Cloud.signUp(email, pass);
        if (r.session) await enter(r.session.user);

      }
    } catch (err) {
      btn.disabled = false; btn.textContent = label;
      let m = err.message || 'Something went wrong.';
      if (/invalid login/i.test(m)) m = 'Wrong email or password.';
      if (/email not confirmed/i.test(m)) m = 'Please confirm your email first — check your inbox for the link.';
      if (/already registered/i.test(m)) m = 'An account with this email already exists. Sign in instead.';
      show(mode, U.esc(m), 'err');
    }
  }

  async function enter(user) {
    screen().hidden = true;
    screen().innerHTML = '';
    document.getElementById('app').style.display = '';
    document.getElementById('view').innerHTML = '<div class="empty">Loading your journal…</div>';
    await Cloud.loadForUser(user);
    if (!booted) { booted = true; App.boot(); } else { App.loadFilters(); App.refreshFilters(); App.render(); }
    const who = document.getElementById('userEmail'); if (who) who.textContent = user.email;
  }

  async function start() {
    let s = null;
    try {
      Cloud.onAuth((event, sess) => {
        if (event === 'PASSWORD_RECOVERY') show('recover');
      });
      s = await Cloud.session();
    } catch (e) {
      screen().hidden = false;
      document.getElementById('app').style.display = 'none';
      screen().innerHTML = `<div class="auth-card"><h2>Can't connect</h2><div class="result-box err">${U.esc(e.message)}</div><button class="btn primary auth-submit" onclick="location.reload()">Try again</button></div>`;
      return;
    }
    // Clean the ?code=… left in the address bar after email links.
    if (/[?&]code=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
    if (mode === 'recover') return;
    if (s) await enter(s.user); else show('signin');
  }

  return { start, show };
})();

      if (f.account !== 'all' && t.account !== f.account) return false;
      if (f.symbol !== 'all' && t.root !== f.symbol) return false;
      const k = U.dayKey(t.entryTime);
      return k >= a && k <= b;
    });
  },

  refreshFilters() {
    const f = this.filters;
    const accts = Store.accounts(), roots = Store.roots();
    if (f.account !== 'all' && !accts.includes(f.account)) f.account = 'all';
    if (f.symbol !== 'all' && !roots.includes(f.symbol)) f.symbol = 'all';
    const box = U.$('#filters');
    box.innerHTML = `
      <select id="fAcct" title="Account"><option value="all">All accounts</option>${accts.map(a => `<option ${a === f.account ? 'selected' : ''}>${U.esc(a)}</option>`).join('')}</select>
      <select id="fSym" title="Symbol"><option value="all">All symbols</option>${roots.map(r => `<option ${r === f.symbol ? 'selected' : ''}>${U.esc(r)}</option>`).join('')}</select>
      <select id="fRange" title="Date range">
        ${[['all', 'All time'], ['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['last30', 'Last 30 days'], ['last90', 'Last 90 days'], ['ytd', 'Year to date'], ['custom', 'Custom range…']]
          .map(([v, l]) => `<option value="${v}" ${v === f.range ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      ${f.range === 'custom' ? `<input type="date" id="fFrom" value="${f.from}"><input type="date" id="fTo" value="${f.to}">` : ''}`;
    const upd = () => { this.saveFilters(); this.calMonth = null; this.render(); };
    U.$('#fAcct').onchange = e => { f.account = e.target.value; upd(); };
    U.$('#fSym').onchange = e => { f.symbol = e.target.value; upd(); };
    U.$('#fRange').onchange = e => { f.range = e.target.value; this.refreshFilters(); upd(); };
    if (U.$('#fFrom')) {
      U.$('#fFrom').onchange = e => { f.from = e.target.value; upd(); };
      U.$('#fTo').onchange = e => { f.to = e.target.value; upd(); };
    }
  },

  /* ---------- Routing ---------- */
  go(hash) { if (location.hash === hash) this.render(); else location.hash = hash; },

  render() {
    const raw = location.hash.replace(/^#\/?/, '') || 'dashboard';
    const [route, qs] = raw.split('?');
    this.route = Views[route] ? route : 'dashboard';
    this.params = Object.fromEntries(new URLSearchParams(qs || ''));
    const view = Views[this.route];
    Charts.destroyAll();
    U.$('#modalRoot').innerHTML = '';
    U.$('#app').classList.remove('mobile-open');
    U.$$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.route === this.route));
    U.$('#pageTitle').textContent = view.title;
    document.title = `${view.title} · Mubu Journal`;
    U.$('#filters').style.display = ['import', 'settings'].includes(this.route) ? 'none' : '';
    this.renderBanner();
    const el = U.$('#view');
    try { view.render(el, this.params); }
    catch (e) { console.error(e); el.innerHTML = `<div class="card"><div class="empty"><h3>Something went wrong</h3><div>${U.esc(e.message)}</div></div></div>`; }
  },

  renderBanner() {
    const b = U.$('#banner');
    const hasDemo = this.hasDemo();
    const onlyDemo = hasDemo && Store.data.trades.every(t => t.importId === 'demo');
    if (hasDemo && !['import', 'settings'].includes(this.route)) {
      b.innerHTML = `<div class="banner"><span class="tagx">DEMO</span><span>${onlyDemo ? 'You are viewing demo trades. Ready to add your own?' : 'Demo trades are mixed in with your data — filter by account or remove them.'}</span>
        <div class="right"><button class="btn sm" data-demo>Remove demo</button><a class="btn sm primary" href="#/import">Add trades</a></div></div>`;
    } else b.innerHTML = '';
  },

  toast(msg, type = '') {
    const t = U.$('#toast');
    t.textContent = msg; t.className = `toast show ${type}`;
    clearTimeout(this._tt); this._tt = setTimeout(() => { t.className = 'toast'; }, 2600);
  },

  /* ---------- Demo data ---------- */
  hasDemo() { return Store.data.trades.some(t => t.importId === 'demo') || (Store.data.runs || []).some(r => r.demo); },

  toggleDemo() {
    if (this.hasDemo()) {
      const demoAccts = new Set(Store.data.trades.filter(t => t.importId === 'demo').map(t => t.account));
      Store.data.trades = Store.data.trades.filter(t => t.importId !== 'demo');
      Store.data.imports = Store.data.imports.filter(i => i.id !== 'demo');
      Store.data.runs = (Store.data.runs || []).filter(r => !r.demo);
      demoAccts.forEach(a => delete Store.data.settings.startingBalances[a]);
      Store.save();
      this.toast('Demo data removed');
    } else {
      const { trades, runs, accounts } = this.makeDemo();
      Store.commitImport({ id: 'demo', at: U.isoOf(new Date()), file: 'demo-data', account: 'Demo accounts', format: 'Generated', added: trades.length, dupes: 0,
        from: U.dayKey(trades[0].entryTime), to: U.dayKey(trades[trades.length - 1].entryTime) }, trades);
      accounts.forEach(a => { Store.data.settings.startingBalances[a] = 50000; });
      Store.data.runs = [...(Store.data.runs || []), ...runs];
      Store.save();
      this.calMonth = null;
      this.toast(`Loaded ${trades.length} demo trades in ${runs.length} runs`);
    }
    this.refreshFilters();
    this.render();
  },

  /* Three demo runs: a blown eval, an eval that passed into a funded account (with payouts),
     and a new eval that overlaps the funded account — so the calendar shows stacked run lines. */
  makeDemo() {
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const A = 'Demo Lucid Eval #1', B1 = 'Demo Tradeify Eval #2', B2 = 'Demo Tradeify Funded #2', C = 'Demo Lucid Eval #3';
    const plan = [ // [account, fromDaysAgo, toDaysAgo, winProbability]
      [A, 120, 97, 0.2], [B1, 94, 71, 0.6], [B2, 68, 1, 0.52], [C, 30, 1, 0.5],
    ];
    const out = [];
    let price = 20400;
    const today = U.todayKey();
    for (let i = 120; i >= 1; i--) {
      const key = U.addDays(today, -i);
      const dow = U.toLocal(key).getDay();
      price += (rnd() - 0.47) * 160;
      if (dow === 0 || dow === 6) continue;
      plan.filter(p => i <= p[1] && i >= p[2]).forEach(([account, , , winP], ai) => {
        if (rnd() < 0.15) return; // skipped day
        const n = 1 + Math.floor(rnd() * 3);
        let minute = 8 * 60 + 31 + Math.floor(rnd() * 20) + ai * 7;
        for (let j = 0; j < n; j++) {
          const sym = rnd() < 0.8 ? 'MNQZ6' : 'NQZ6';
          const root = sym.startsWith('MNQ') ? 'MNQ' : 'NQ';
          const qty = root === 'MNQ' ? 5 : 1;
          const side = rnd() < 0.55 ? 'Long' : 'Short';
          const win = rnd() < winP;
          const pts = win ? 15 + Math.round(rnd() * 70) / 2 * 2 : -(12 + Math.round(rnd() * 14));
          const tick = v => Math.round(v * 4) / 4;
          const entry = tick(price + (rnd() - 0.5) * 40);
          const exit = tick(side === 'Long' ? entry + pts : entry - pts);
          const hold = 60 + Math.floor(rnd() * 1500);
          const et = U.toLocal(key); et.setMinutes(minute); et.setSeconds(Math.floor(rnd() * 60));
          const xt = new Date(et.getTime() + hold * 1000);
          const pv = Parser.POINT_VALUES[root];
          out.push({
            id: `demo-${account.replace(/\W+/g, '')}-${key}-${j}`, account, symbol: sym, root, side, qty, entryPrice: entry, exitPrice: exit,
            entryTime: U.isoOf(et), exitTime: U.isoOf(xt), gross: Math.round(pts * pv * qty * 100) / 100, fees: root === 'MNQ' ? 0.74 * qty : 2.6,
            importId: 'demo', setup: ['Opening drive', 'Liquidity sweep', 'Trend pullback'][Math.floor(rnd() * 3)], notes: '', tags: [], rating: 0,
          });
          minute += Math.ceil(hold / 60) + 3 + Math.floor(rnd() * 30);
        }
      });
    }
    out.sort((a, b) => (a.entryTime < b.entryTime ? -1 : 1));
    const days = acct => [...new Set(out.filter(t => t.account === acct).map(t => U.dayKey(t.entryTime)))].sort();
    const dA = days(A), dB1 = days(B1), dB2 = days(B2);
    const st = (account, type, result = '', end = '') => ({ id: 's_' + U.uid(), account, type, start: '', end, result });
    const runs = [
      { id: 'run_demo1', demo: true, name: 'Lucid 50K · Run 1', color: '#64748B', status: 'blown', payouts: [], createdAt: U.isoOf(new Date()),
        stages: [st(A, 'Eval', 'blown', dA[dA.length - 1])] },
      { id: 'run_demo2', demo: true, name: 'Tradeify 50K · Run 2', color: '#4F6BED', status: 'active', createdAt: U.isoOf(new Date()),
        stages: [st(B1, 'Eval', 'passed', dB1[dB1.length - 1]), st(B2, 'Funded')],
        payouts: [{ id: 'p_demo1', date: dB2[Math.floor(dB2.length * 0.45)], amount: 1200 }, { id: 'p_demo2', date: dB2[Math.floor(dB2.length * 0.85)], amount: 1650 }] },
      { id: 'run_demo3', demo: true, name: 'Lucid 50K · Run 3', color: '#F59E0B', status: 'active', payouts: [], createdAt: U.isoOf(new Date()),
        stages: [st(C, 'Eval')] },
    ];
    return { trades: out, runs, accounts: [A, B1, B2, C] };
  },
};

document.addEventListener('DOMContentLoaded', () => Auth.start());

</script>
