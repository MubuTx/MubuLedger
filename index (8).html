<style>
:root{
  --paper:#E8DFC9;
  --paper-2:#DCD0B5;
  --ink:#1B1A17;
  --ink-soft:#645F55;
  --ink-faint:#948C78;
  --rule:#CCBFA1;
  --out:#9E3B26;
  --in:#2C5A4C;
  --limit:#B08A2E;
  --glyph:#161A1F;
}
[data-theme="dark"]{
  --paper:#15171B;
  --paper-2:#22252B;
  --ink:#ECECE8;
  --ink-soft:#A3A7AF;
  --ink-faint:#6F737C;
  --rule:#2F333A;
  --out:#D3654C;
  --in:#5FA58C;
  --limit:#D1A94A;
  --glyph:#ECECE8;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:30px 20px 90px}

/* masthead + controls */
.mast{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:14px;flex-wrap:wrap;
  padding-bottom:13px;border-bottom:2px solid var(--ink);
}
.mast-left h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-0.01em}
.stamp{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px}

.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctl{
  display:inline-flex;align-items:center;gap:0;
  border:1px solid var(--rule);background:var(--paper-2);
  font-size:12.5px;line-height:1;overflow:hidden;
}
.ctl button{
  appearance:none;border:0;background:transparent;color:var(--ink-soft);
  font:inherit;padding:7px 10px;cursor:pointer;letter-spacing:.02em;
}
.ctl button + button{border-left:1px solid var(--rule)}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ctl button:hover:not([aria-pressed="true"]){color:var(--ink)}

.hero{padding:40px 0 8px}
.hero-figs{display:flex;flex-wrap:wrap;gap:18px 56px;align-items:flex-end}
.hero-figs > div{min-width:0}
.hero-label{font-size:14px;color:var(--ink-soft);margin:0 0 4px}
.figure{
  font-family:"Archivo",system-ui,sans-serif;
  font-weight:500;
  font-size:clamp(52px,12vw,88px);
  line-height:0.95;letter-spacing:-0.035em;margin:0;
}
.hero-note{margin:14px 0 0;font-size:15px;color:var(--ink-soft);max-width:52ch}

.bar{
  margin-top:26px;height:34px;display:flex;
  border:1px solid var(--ink);background:var(--paper-2);overflow:hidden;
}
.bar div{height:100%}
.seg-in{background:var(--in)}
.seg-out{background:var(--out)}
.bar-key{display:flex;flex-wrap:wrap;gap:20px;margin-top:11px;font-size:14px}
.bar-key b{font-weight:600}
.sw{display:inline-block;width:10px;height:10px;margin-right:7px}
.sw.in{background:var(--in)}
.sw.out{background:var(--out)}

.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:18px 16px;margin-top:36px;padding-top:22px;
  border-top:1px solid var(--rule);
}
@media (min-width:620px){ .stats{grid-template-columns:repeat(6,1fr)} }
.stats span{display:block;font-size:12.5px;color:var(--ink-soft);line-height:1.3}
.stats b{display:block;font-weight:600;font-size:19px;margin-top:3px}

.goal{margin-top:46px;padding:22px 0 0;border-top:1px solid var(--rule)}
.goal-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.goal-head h2{margin:0;border:0;padding:0}
section .goal-head{border-bottom:1px solid var(--rule);padding-bottom:9px;margin-bottom:6px}
.goal-pct{font-family:"Archivo",system-ui,sans-serif;font-weight:500;font-size:30px;line-height:1;letter-spacing:-0.02em}
.track{margin-top:14px;height:20px;background:var(--paper-2);border:1px solid var(--ink);overflow:hidden}
.fill{height:100%;background:var(--in)}
.goal-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:16px 22px;margin-top:18px}
.goal-meta div span{display:block;font-size:13px;color:var(--ink-soft)}
.goal-meta div b{font-weight:600;font-size:19px}

section{margin-top:54px}
h2{font-size:15px;font-weight:600;margin:0 0 6px;padding-bottom:9px;border-bottom:1px solid var(--rule)}
.sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;max-width:62ch}
.chart{width:100%;margin-top:6px}
.chart svg{display:block;width:100%;height:auto}

table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:4px}
th{text-align:left;font-weight:500;color:var(--ink-soft);padding:0 0 8px;font-size:13px}
td{padding:9px 0;border-top:1px solid var(--rule);vertical-align:baseline}
.num{text-align:right;white-space:nowrap}
.out-val{color:var(--out)}
.in-val{color:var(--in)}
tfoot td{border-top:2px solid var(--ink);font-weight:600;padding-top:11px}
.firm{font-weight:500}
.note{color:var(--ink-soft);font-size:13.5px}
.led-date{color:var(--ink-soft);font-size:13px;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--in);border:1px solid var(--in);padding:1px 5px;margin-left:6px;vertical-align:middle}
#liveTable{margin-top:14px}

@media (max-width:540px){
  .hide-sm{display:none}
  table{font-size:14px}
  .mast{flex-direction:column}
}

footer{margin-top:66px;padding-top:16px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--ink-soft)}
footer p{margin:0 0 6px;max-width:62ch}
</style>
</head>

<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="wrap">

  <header class="mast">
    <div class="mast-left">
      <h1>Mubu Ledger</h1>
      <span class="stamp" id="stamp"></span>
    </div>
    <div class="controls">
      <div class="ctl" role="group" aria-label="Language">
        <button data-lang="en">EN</button>
        <button data-lang="es">ES</button>
        <button data-lang="fr">FR</button>
      </div>
      <div class="ctl"><button id="themeBtn"></button></div>
    </div>
  </header>

  <div class="hero">
    <div class="hero-figs">
      <div>
        <p class="hero-label" data-t="heroLabel"></p>
        <p class="figure" id="net">—</p>
      </div>
      <div>
        <p class="hero-label" id="heroRoiLabel"></p>
        <p class="figure" id="heroRoi">—</p>
      </div>
    </div>
    <div class="bar" aria-hidden="true">
      <div class="seg-in" id="segIn"></div>
      <div class="seg-out" id="segOut"></div>
    </div>
    <div class="bar-key">
      <span><i class="sw in"></i><span data-t="payouts"></span> <b id="kIn">—</b></span>
      <span><i class="sw out"></i><span data-t="costs"></span> <b id="kOut">—</b></span>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="goal">
    <div class="goal-head">
      <h2 id="goalTitle"></h2>
      <span class="goal-pct" id="goalPct">—</span>
    </div>
    <div class="track"><div class="fill" id="goalFill"></div></div>
    <div class="goal-meta" id="goalMeta"></div>
  </div>

  <section>
    <div class="goal-head">
      <h2 id="roiTitle"></h2>
      <span class="goal-pct" id="roiPct">—</span>
    </div>
    <p class="sub" data-t="subROI"></p>
    <div class="chart" id="roi"></div>
    <p class="note" id="roiNote"></p>
    <p class="note" id="roiSources"></p>
  </section>

  <section>
    <h2 data-t="secLive"></h2>
    <p class="sub" data-t="subLive"></p>
    <div class="goal-meta" id="liveMeta"></div>
    <table id="liveTable"><tbody id="liveRows"></tbody></table>
  </section>

  <section>
    <h2 data-t="secCurve"></h2>
    <p class="sub" data-t="subCurve"></p>
    <div class="chart" id="curve"></div>
  </section>

  <section>
    <h2 data-t="secMonthly"></h2>
    <p class="sub" data-t="subMonthly"></p>
    <div class="chart" id="monthly"></div>
    <table>
      <thead><tr>
        <th data-t="thMonth"></th>
        <th class="num" data-t="costs"></th>
        <th class="num" data-t="payouts"></th>
        <th class="num" data-t="thNet"></th>
        <th class="num hide-sm" data-t="thShare"></th>
      </tr></thead>
      <tbody id="monthRows"></tbody>
      <tfoot id="monthFoot"></tfoot>
    </table>
  </section>

  <section>
    <h2 data-t="secCycle"></h2>
    <p class="sub" data-t="subCycle"></p>
    <div class="chart" id="cycle"></div>
  </section>

  <section>
    <h2 data-t="secPareto"></h2>
    <p class="sub" data-t="subPareto"></p>
    <div class="chart" id="pareto"></div>
  </section>

  <section>
    <h2 data-t="secControl"></h2>
    <p class="sub" data-t="subControl"></p>
    <div class="chart" id="control"></div>
  </section>

  <section>
    <h2 data-t="secFirm"></h2>
    <table>
      <thead><tr>
        <th data-t="thFirm"></th>
        <th class="num" data-t="costs"></th>
        <th class="num" data-t="payouts"></th>
        <th class="num" data-t="thNet"></th>
        <th class="num hide-sm" data-t="thROI"></th>
      </tr></thead>
      <tbody id="firmRows"></tbody>
      <tfoot id="firmFoot"></tfoot>
    </table>
  </section>

  <section>
    <h2 data-t="secLedger"></h2>
    <table>
      <thead><tr>
        <th data-t="thDate"></th>
        <th data-t="thDetail"></th>
        <th class="num" data-t="thAmount"></th>
        <th class="num hide-sm" data-t="thRunning"></th>
      </tr></thead>
      <tbody id="ledgerRows"></tbody>
    </table>
  </section>

  <footer>
    <p data-t="footNote"></p>
    <p data-t="footLegal"></p>
  </footer>

</div>

<script>
/* ── settings (language / theme / motion), persisted ───────── */
const SETTINGS = (function(){
  const store = function(k,v){ try{ localStorage.setItem("mubu."+k, v); }catch(e){} };
  const load  = function(k,d){ try{ return localStorage.getItem("mubu."+k) || d; }catch(e){ return d; } };
  const browserLang = (navigator.language||"en").slice(0,2);
  return {
    lang:   load("lang",  I18N[browserLang] ? browserLang : "en"),
    theme:  load("theme", "light"),
    set: function(k,v){ this[k]=v; store(k,v); }
  };
})();
document.documentElement.setAttribute("data-theme", SETTINGS.theme);
document.documentElement.lang = SETTINGS.lang;
</script>

<script>
/* ── background: slow-drifting math glyphs ─────────────────── */
const BG = (function(){
  const c = document.getElementById("bg");
  const ctx = c.getContext("2d");
  const GLYPHS = ["∑","σ","μ","x̄","Δ","∂","∫","√","≈","∞","±","λ","θ","π","∏","∇",
                  "σ²","χ²","R²","3σ","6σ","Cpk","UCL","LCL","x̄","σ","∑","Δ","μ","∫"];
  let W=0,H=0,items=[],last=0,raf=null,running=false;

  function seed(){
    const n = W < 600 ? 22 : 40;
    items = [];
    for(let i=0;i<n;i++) items.push({
      g: GLYPHS[Math.floor(Math.random()*GLYPHS.length)],
      x: Math.random()*W, y: Math.random()*H,
      s: (W<600?16:18) + Math.random()*(W<600?28:36),
      v: 5 + Math.random()*9, dx: (Math.random()-0.5)*4,
      r: (Math.random()-0.5)*0.5, a: 0.04 + Math.random()*0.035
    });
  }
  function size(){
    const dpr = Math.min(2, window.devicePixelRatio||1);
    const nw = window.innerWidth, nh = window.innerHeight;
    const reseed = Math.abs(nw-W) > 60 || !items.length;
    W=nw; H=nh;
    c.width=W*dpr; c.height=H*dpr; c.style.width=W+"px"; c.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(reseed) seed();
  }
  function draw(dt){
    ctx.clearRect(0,0,W,H);
    const color = getComputedStyle(document.documentElement).getPropertyValue("--glyph").trim() || "#161A1F";
    for(const it of items){
      it.y -= it.v*dt; it.x += it.dx*dt;
      if(it.y < -60){ it.y = H+60; it.x = Math.random()*W; }
      if(it.x < -80) it.x = W+80; else if(it.x > W+80) it.x = -80;
      ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.r);
      ctx.globalAlpha = it.a; ctx.fillStyle = color;
      ctx.font = it.s + 'px "Instrument Serif", Georgia, serif';
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(it.g,0,0); ctx.restore();
    }
  }
  function loop(now){
    const dt = Math.min(0.05,(now-last)/1000); last=now;
    draw(dt);
    if(running) raf = requestAnimationFrame(loop);
  }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; cancelAnimationFrame(raf); ctx.clearRect(0,0,W,H); }

  let rt;
  window.addEventListener("resize", function(){ clearTimeout(rt); rt=setTimeout(size,120); });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ cancelAnimationFrame(raf); running=false; }
    else start();
  });
  size();
  return { start:start, stop:stop };
})();
</script>

<script>
(function(){

const E = LEDGER.entries.slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
const $ = function(id){ return document.getElementById(id); };
let T = I18N[SETTINGS.lang];

const fmt = function(s,o){ return s.replace(/\{(\w+)\}/g, function(_,k){ return o[k]; }); };
const money = function(n){ return (n<0?"\u2212":"") + "$" + Math.abs(Math.round(n)).toLocaleString("en-US"); };
const moneyK = function(n){
  const a = Math.abs(n); let s;
  if(a >= 1000){ const k=a/1000; s = "$" + (Math.abs(k%1)<0.05 ? Math.round(k) : k.toFixed(1)) + "k"; }
  else s = "$" + Math.round(a);
  return (n<0?"\u2212":"") + s;
};
const pct = function(n){ return (n<0?"\u2212":"") + Math.abs(Math.round(n)) + "%"; };
const esc = function(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); };
const fmtDate = function(s){ return new Date(s+"T00:00:00").toLocaleDateString(T.locale,{month:"short",day:"numeric",year:"2-digit"}); };
const days = function(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); };
const typeLabel = function(t){ return T.types[t] || t; };

/* ── numbers (language-independent) ───────────── */
const inflows = E.filter(function(e){return e.amount>0;});
const payoutList = inflows.filter(function(e){return e.stage!=="live";});   /* prop-firm payouts drive the process charts */
const payouts = inflows.reduce(function(s,e){return s+e.amount;},0);         /* everything received, live included */
const costs   = E.filter(function(e){return e.amount<0;}).reduce(function(s,e){return s+Math.abs(e.amount);},0);
const net     = payouts - costs;
const d = new Date(LEDGER.updated);
const goal = LEDGER.goal.amount;
const monthsLeft = Math.max(1, 12 - d.getMonth());
const remaining = Math.max(0, goal-net);

let run=0, peak=0, maxDD=0;
const withRun = E.map(function(e){
  run += e.amount; if(run>peak) peak=run; const dd=run-peak; if(dd<maxDD) maxDD=dd;
  return {date:e.date, firm:e.firm, type:e.type, amount:e.amount, note:e.note, stage:e.stage, run:run};
});
const gaps=[]; for(let i=1;i<payoutList.length;i++) gaps.push(days(payoutList[i-1].date, payoutList[i].date));
const avgGap = gaps.length ? gaps.reduce(function(a,b){return a+b;},0)/gaps.length : 0;

const months={};
E.forEach(function(e){ const k=e.date.slice(0,7); if(!months[k]) months[k]={cost:0,pay:0};
  if(e.amount<0) months[k].cost+=Math.abs(e.amount); else months[k].pay+=e.amount; });
const mKeys = Object.keys(months).sort();
const mNets = mKeys.map(function(k){ return months[k].pay-months[k].cost; });
const avgMonth = mNets.reduce(function(a,b){return a+b;},0)/(mNets.length||1);

const firms={};
E.forEach(function(e){ const f=e.firm||"\u2014"; if(!firms[f]) firms[f]={cost:0,pay:0,live:false}; if(e.stage==="live") firms[f].live=true;
  if(e.amount<0) firms[f].cost+=Math.abs(e.amount); else firms[f].pay+=e.amount; });

const evalCount = E.filter(function(e){return e.type==="eval";}).length;

/* ── text render (language-dependent) ─────────── */
function renderText(){
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = T[el.getAttribute("data-t")]; });

  $("stamp").textContent = T.updated + " " +
    d.toLocaleDateString(T.locale,{month:"short",day:"numeric",year:"numeric"}) + " \u00b7 " +
    d.toLocaleTimeString(T.locale,{hour:"numeric",minute:"2-digit",second:"2-digit"}) +
    (LEDGER.timezone ? " "+LEDGER.timezone : "");

  $("net").textContent = money(net);
  $("heroRoiLabel").textContent = fmt(T.secROI,{y:LEDGER.goal.year});
  $("heroRoi").textContent = pct(costs>0 ? (net/costs)*100 : 0);
  $("kIn").textContent = money(payouts);
  $("kOut").textContent = money(costs);
  const pctIn = payouts+costs>0 ? (payouts/(payouts+costs))*100 : 50;
  $("segIn").style.width = pctIn.toFixed(2)+"%";
  $("segOut").style.width = (100-pctIn).toFixed(2)+"%";

  $("stats").innerHTML =
    '<div><span>'+T.stTx+'</span><b>'+E.length+'</b></div>' +
    '<div><span>'+T.stEvals+'</span><b>'+evalCount+'</b></div>' +
    '<div><span>'+T.stPayouts+'</span><b>'+payoutList.length+'</b></div>' +
    '<div><span>'+T.stCost+'</span><b>'+(payoutList.length?money(costs/payoutList.length):"\u2014")+'</b></div>' +
    '<div><span>'+T.stDays+'</span><b>'+(gaps.length?Math.round(avgGap):"\u2014")+'</b></div>' +
    '<div><span>'+T.stDD+'</span><b>'+money(maxDD)+'</b></div>';

  const gPct = Math.max(0,Math.min(100,(net/goal)*100));
  $("goalTitle").textContent = fmt(T.goalTitle,{a:money(goal), y:LEDGER.goal.year});
  $("goalPct").textContent = gPct.toFixed(1)+"%";
  $("goalFill").style.width = gPct.toFixed(2)+"%";
  $("goalMeta").innerHTML =
    '<div><span>'+T.stillToGo+'</span><b>'+money(remaining)+'</b></div>' +
    '<div><span>'+fmt(T.monthsLeft,{y:LEDGER.goal.year})+'</span><b>'+monthsLeft+'</b></div>' +
    '<div><span>'+T.needed+'</span><b>'+money(remaining/monthsLeft)+'</b></div>' +
    '<div><span>'+T.averaging+'</span><b>'+money(avgMonth)+'</b></div>';

  const roi = costs>0 ? (net/costs)*100 : 0;
  const back = costs>0 ? (payouts/costs) : 0;
  document.querySelector('[data-t="subROI"]').textContent = fmt(T.subROI,{r:"$"+back.toFixed(2)});
  $("roiTitle").textContent = fmt(T.secROI,{y:LEDGER.goal.year});
  $("roiPct").textContent = pct(roi);
  $("roiNote").textContent = T.roiTypicalNote;
  $("roiSources").textContent = T.roiSources;

  const live = E.filter(function(e){ return e.stage==="live"; });
  const livePay = live.filter(function(e){return e.amount>0;}).reduce(function(s,e){return s+e.amount;},0);
  $("liveMeta").innerHTML = live.length
    ? '<div><span>'+T.livePayouts+'</span><b>'+money(livePay)+'</b></div>' +
      '<div><span>'+T.liveCount+'</span><b>'+live.filter(function(e){return e.amount>0;}).length+'</b></div>'
    : '<div><span>'+T.liveNone+'</span></div>';
  $("liveRows").innerHTML = live.slice().reverse().map(function(e){
    return '<tr><td class="led-date">'+fmtDate(e.date)+'</td><td>'+typeLabel(e.type)+(e.firm?" \u00b7 "+esc(e.firm):"") +
      (e.note?'<br><span class="note">'+esc(e.note)+'</span>':"")+'</td>' +
      '<td class="num '+(e.amount<0?"out-val":"in-val")+'">'+money(e.amount)+'</td></tr>';
  }).join("");

  $("monthRows").innerHTML = mKeys.map(function(k){
    const v=months[k], n=v.pay-v.cost;
    return '<tr><td>'+mLabel(k)+'</td><td class="num out-val">'+money(-v.cost)+'</td>' +
      '<td class="num in-val">'+(v.pay?money(v.pay):"\u2014")+'</td><td class="num">'+money(n)+'</td>' +
      '<td class="num hide-sm">'+pct((n/goal)*100)+'</td></tr>';
  }).join("");
  $("monthFoot").innerHTML = '<tr><td>'+T.total+'</td><td class="num">'+money(-costs)+'</td>' +
    '<td class="num">'+money(payouts)+'</td><td class="num">'+money(net)+'</td>' +
    '<td class="num hide-sm">'+pct((net/goal)*100)+'</td></tr>';

  $("firmRows").innerHTML = Object.keys(firms).map(function(f){return [f,firms[f]];})
    .sort(function(a,b){ return (b[1].pay-b[1].cost)-(a[1].pay-a[1].cost); })
    .map(function(p){ const f=p[0], v=p[1], n=v.pay-v.cost;
      return '<tr><td class="firm">'+esc(f==="\u2014"?T.notFirm:f)+(v.live?' <span class="tag">'+T.liveTag+'</span>':"")+'</td>' +
        '<td class="num out-val">'+money(-v.cost)+'</td><td class="num in-val">'+(v.pay?money(v.pay):"\u2014")+'</td>' +
        '<td class="num">'+money(n)+'</td><td class="num hide-sm">'+(v.cost>0?pct((n/v.cost)*100):"\u2014")+'</td></tr>';
    }).join("");
  $("firmFoot").innerHTML = '<tr><td>'+T.total+'</td><td class="num">'+money(-costs)+'</td>' +
    '<td class="num">'+money(payouts)+'</td><td class="num">'+money(net)+'</td>' +
    '<td class="num hide-sm">'+(costs>0?pct((net/costs)*100):"\u2014")+'</td></tr>';

  $("ledgerRows").innerHTML = withRun.slice().reverse().map(function(e){
    return '<tr><td class="led-date">'+fmtDate(e.date)+'</td><td>'+typeLabel(e.type) +
      (e.firm&&e.firm!=="\u2014"?" \u00b7 "+esc(e.firm):"") + (e.stage==="live"?' <span class="tag">'+T.liveTag+'</span>':"") +
      (e.note?'<br><span class="note">'+esc(e.note)+'</span>':"")+'</td>' +
      '<td class="num '+(e.amount<0?"out-val":"in-val")+'">'+money(e.amount)+'</td>' +
      '<td class="num hide-sm">'+money(e.run)+'</td></tr>';
  }).join("");

  $("themeBtn").textContent  = SETTINGS.theme==="dark" ? T.light : T.dark;
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-lang")===SETTINGS.lang ? "true" : "false");
  });
}
function mLabel(k){ const p=k.split("-"); return new Date(p[0],p[1]-1,1).toLocaleDateString(T.locale,{month:"short"}).replace(".",""); }

/* ══ charts ════════════════════════════════════ */
let C = {};
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  const g = function(n){ return cs.getPropertyValue(n).trim(); };
  C = { ink:g("--ink"), soft:g("--ink-soft"), faint:g("--ink-faint"), rule:g("--rule"),
        out:g("--out"), in:g("--in"), limit:g("--limit") };
}
function svgOpen(w,h){ return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img">'; }
function txt(x,y,s,o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" fill="'+(o.fill||C.soft)+'" font-size="'+(o.size||11) +
    '" font-family="Archivo,sans-serif" text-anchor="'+(o.anchor||"start")+'" font-weight="'+(o.weight||400)+'">'+s+'</text>'; }
function gridLine(P,w,y,strong){
  return '<line x1="'+P.l+'" y1="'+y.toFixed(1)+'" x2="'+(w-P.r)+'" y2="'+y.toFixed(1) +
    '" stroke="'+(strong?C.ink:C.rule)+'" stroke-width="'+(strong?1.2:1)+'"/>'; }
function niceTicks(min,max,count){
  const span=max-min||1, raw=span/count, mag=Math.pow(10,Math.floor(Math.log10(raw))), norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag, out=[];
  for(let v=Math.ceil(min/step)*step; v<=max+1e-9; v+=step) out.push(v);
  return out;
}

function drawCurve(w){
  const h = w<520?260:320, P={l:54,r:12,t:16,b:30}, iw=w-P.l-P.r, ih=h-P.t-P.b;
  const vals = withRun.map(function(e){return e.run;});
  let lo=Math.min.apply(null,vals.concat([0])), hi=Math.max.apply(null,vals.concat([0]));
  const pad=(hi-lo)*0.08||100; lo-=pad; hi+=pad;
  const X=function(i){return P.l+(withRun.length<2?iw/2:(i/(withRun.length-1))*iw);};
  const Y=function(v){return P.t+ih-((v-lo)/(hi-lo))*ih;};
  let s=svgOpen(w,h);
  niceTicks(lo,hi,5).forEach(function(v){ s+=gridLine(P,w,Y(v),Math.abs(v)<1e-9); s+=txt(P.l-8,Y(v)+4,moneyK(v),{anchor:"end"}); });
  s+='<polyline points="'+withRun.map(function(e,i){return X(i).toFixed(1)+","+Y(e.run).toFixed(1);}).join(" ") +
     '" fill="none" stroke="'+C.ink+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>';
  withRun.forEach(function(e,i){ const pay=e.amount>0;
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(e.run).toFixed(1)+'" r="'+(pay?4:2.2)+'" fill="'+(pay?C.in:C.out)+'"><title>' +
      fmtDate(e.date)+" \u00b7 "+typeLabel(e.type)+(e.firm&&e.firm!=="\u2014"?" \u00b7 "+e.firm:"")+" "+money(e.amount)+" \u00b7 "+T.running+" "+money(e.run)+'</title></circle>'; });
  s+=txt(P.l,h-8,fmtDate(withRun[0].date),{}); s+=txt(w-P.r,h-8,fmtDate(withRun[withRun.length-1].date),{anchor:"end"});
  return s+"</svg>";
}

function drawMonthly(w){
  const h=w<520?220:250, P={l:54,r:12,t:22,b:26}, iw=w-P.l-P.r, ih=h-P.t-P.b;
  let lo=Math.min.apply(null,mNets.concat([0])), hi=Math.max.apply(null,mNets.concat([0]));
  const pad=(hi-lo)*0.16||100; lo-=pad; hi+=pad;
  const slot=iw/mKeys.length, bw=Math.min(46,slot*0.58);
  const X=function(i){return P.l+(i+0.5)*slot;}, Y=function(v){return P.t+ih-((v-lo)/(hi-lo))*ih;};
  let s=svgOpen(w,h);
  niceTicks(lo,hi,4).forEach(function(v){ s+=gridLine(P,w,Y(v),Math.abs(v)<1e-9); s+=txt(P.l-8,Y(v)+4,moneyK(v),{anchor:"end"}); });
  mKeys.forEach(function(k,i){ const v=mNets[i], y0=Y(0), y1=Y(v);
    s+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+Math.min(y0,y1).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,Math.abs(y1-y0)).toFixed(1) +
      '" fill="'+(v>=0?C.in:C.out)+'"><title>'+mLabel(k)+" \u00b7 "+money(v)+'</title></rect>';
    if(slot>52) s+=txt(X(i), v>=0?y1-7:y1+15, moneyK(v), {anchor:"middle",fill:C.ink,weight:500});
    s+=txt(X(i),h-8,mLabel(k),{anchor:"middle"}); });
  return s+"</svg>";
}

function drawCycle(w){
  if(gaps.length<2) return '<p class="sub">'+fmt(T.cycleNeed,{n:payoutList.length})+'</p>';
  const h=w<520?200:230, P={l:54,r:12,t:22,b:30}, iw=w-P.l-P.r, ih=h-P.t-P.b;
  const hi=Math.max.apply(null,gaps)*1.18, slot=iw/gaps.length, bw=Math.min(40,slot*0.55);
  const X=function(i){return P.l+(i+0.5)*slot;}, Y=function(v){return P.t+ih-(v/hi)*ih;};
  let s=svgOpen(w,h);
  niceTicks(0,hi,4).forEach(function(v){ s+=gridLine(P,w,Y(v),Math.abs(v)<1e-9); s+=txt(P.l-8,Y(v)+4,Math.round(v)+T.dayUnit,{anchor:"end"}); });
  gaps.forEach(function(g,i){
    s+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+Y(g).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(P.t+ih-Y(g)).toFixed(1)+'" fill="'+C.in+'"><title>' +
      fmtDate(payoutList[i].date)+" \u2192 "+fmtDate(payoutList[i+1].date)+" \u00b7 "+g+" "+T.days+'</title></rect>';
    if(slot>40) s+=txt(X(i),Y(g)-7,g,{anchor:"middle",fill:C.ink,weight:500}); });
  s+='<line x1="'+P.l+'" y1="'+Y(avgGap).toFixed(1)+'" x2="'+(w-P.r)+'" y2="'+Y(avgGap).toFixed(1)+'" stroke="'+C.limit+'" stroke-width="1.2" stroke-dasharray="5 4"/>';
  s+=txt(w-P.r,Y(avgGap)-6,T.avg+" "+Math.round(avgGap)+T.dayUnit,{anchor:"end",fill:C.limit});
  s+=txt(P.l,h-8,T.cycleFirst,{}); s+=txt(w-P.r,h-8,T.cycleLatest,{anchor:"end"});
  return s+"</svg>";
}

function drawPareto(w){
  const cats={};
  E.filter(function(e){return e.amount<0;}).forEach(function(e){ if(!cats[e.type]) cats[e.type]={n:0,sum:0}; cats[e.type].n++; cats[e.type].sum+=Math.abs(e.amount); });
  const list=Object.keys(cats).map(function(t){return [t,cats[t]];}).sort(function(a,b){return b[1].sum-a[1].sum;});
  if(!list.length) return "";
  const h=w<520?240:270, P={l:54,r:44,t:20,b:42}, iw=w-P.l-P.r, ih=h-P.t-P.b, hi=list[0][1].sum*1.12;
  const slot=iw/list.length, bw=Math.min(58,slot*0.56);
  const X=function(i){return P.l+(i+0.5)*slot;}, Y=function(v){return P.t+ih-(v/hi)*ih;}, Yp=function(p){return P.t+ih-(p/100)*ih;};
  let s=svgOpen(w,h);
  niceTicks(0,hi,4).forEach(function(v){ s+=gridLine(P,w,Y(v),false); s+=txt(P.l-8,Y(v)+4,moneyK(v),{anchor:"end"}); });
  [0,50,100].forEach(function(p){ s+=txt(w-P.r+8,Yp(p)+4,p+"%",{fill:C.faint}); });
  let cum=0; const line=[];
  list.forEach(function(pair,i){ const t=pair[0], v=pair[1];
    s+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+Y(v.sum).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(P.t+ih-Y(v.sum)).toFixed(1)+'" fill="'+C.out+'"><title>' +
      typeLabel(t)+" \u00b7 "+money(v.sum)+" "+T.across+" "+v.n+'</title></rect>';
    cum+=v.sum; line.push(X(i).toFixed(1)+","+Yp((cum/costs)*100).toFixed(1));
    s+=txt(X(i),h-24,typeLabel(t).split(" ")[0],{anchor:"middle",fill:C.ink});
    s+=txt(X(i),h-9,v.n+"\u00d7",{anchor:"middle",size:10.5,fill:C.faint}); });
  s+='<polyline points="'+line.join(" ")+'" fill="none" stroke="'+C.ink+'" stroke-width="1.4" stroke-dasharray="3 3"/>';
  line.forEach(function(p){ const xy=p.split(","); s+='<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="3" fill="'+C.ink+'"/>'; });
  return s+"</svg>";
}

function drawROI(w){
  const B = LEDGER.benchmarks || {};
  const roi = costs>0 ? (net/costs)*100 : 0;
  const rows = [
    {label:T.roiMe, v:roi, me:true},
    {label:T.roiSP + (B.sp500&&B.sp500.asOf ? " ("+T.asOf+" "+fmtDate(B.sp500.asOf)+")" : ""), v:B.sp500?B.sp500.value:0},
    {label:T.roiAverage, v:B.average?B.average.value:-75}
  ].sort(function(a,b){ return b.v-a.v; });
  const rowH = 44, h = rows.length*rowH + 34, P={l:12,r:64,t:8,b:26}, iw=w-P.l-P.r;
  let lo=Math.min.apply(null,rows.map(function(r){return r.v;}).concat([0]));
  let hi=Math.max.apply(null,rows.map(function(r){return r.v;}).concat([0]));
  const pad=(hi-lo)*0.05||10; lo-=pad; hi+=pad;
  const X=function(v){return P.l+((v-lo)/(hi-lo))*iw;};
  let s=svgOpen(w,h);
  s+='<line x1="'+X(0).toFixed(1)+'" y1="'+P.t+'" x2="'+X(0).toFixed(1)+'" y2="'+(h-P.b)+'" stroke="'+C.ink+'" stroke-width="1.2"/>';
  rows.forEach(function(r,i){
    const y=P.t+i*rowH, x0=X(0), x1=X(r.v), bh=16;
    s+='<rect x="'+Math.min(x0,x1).toFixed(1)+'" y="'+(y+20)+'" width="'+Math.max(1,Math.abs(x1-x0)).toFixed(1)+'" height="'+bh+'" fill="'+(r.v>=0?C.in:C.out)+'"'+(r.me?'':' opacity="0.55"')+'/>';
    s+=txt(P.l, y+13, r.label, {fill:C.ink, weight:r.me?600:400, size:12});
    s+=txt(r.v>=0 ? x1+8 : x0+8, y+32, pct(r.v), {anchor:"start", fill:C.ink, weight:600, size:12});
  });
  return s+"</svg>";
}

function drawControl(w){
  const ps=payoutList;
  if(ps.length<4) return '<p class="sub">'+fmt(T.controlNeed,{n:ps.length})+'</p>';
  const v=ps.map(function(e){return e.amount;}), mean=v.reduce(function(a,b){return a+b;},0)/v.length;
  let mr=0; for(let i=1;i<v.length;i++) mr+=Math.abs(v[i]-v[i-1]);
  const sigma=(mr/(v.length-1))/1.128, ucl=mean+3*sigma, lcl=Math.max(0,mean-3*sigma);
  const h=w<520?240:270, P={l:w<520?78:92,r:12,t:22,b:30}, iw=w-P.l-P.r, ih=h-P.t-P.b;
  let lo=Math.min.apply(null,v.concat([lcl])), hi=Math.max.apply(null,v.concat([ucl]));
  const pad=(hi-lo)*0.14||100; lo-=pad; hi+=pad;
  const X=function(i){return P.l+(v.length<2?iw/2:(i/(v.length-1))*iw);}, Y=function(y){return P.t+ih-((y-lo)/(hi-lo))*ih;};
  let s=svgOpen(w,h);
  s+='<rect x="'+P.l+'" y="'+Y(ucl).toFixed(1)+'" width="'+iw+'" height="'+(Y(lcl)-Y(ucl)).toFixed(1)+'" fill="'+C.in+'" opacity="0.08"/>';
  [[ucl,"UCL"],[mean,T.mean],[lcl,"LCL"]].forEach(function(pair,idx){ const y=pair[0], isMean=idx===1;
    s+='<line x1="'+P.l+'" y1="'+Y(y).toFixed(1)+'" x2="'+(w-P.r)+'" y2="'+Y(y).toFixed(1)+'" stroke="'+(isMean?C.ink:C.limit)+'" stroke-width="1.2"'+(isMean?"":' stroke-dasharray="5 4"')+'/>';
    s+=txt(P.l-8,Y(y)+4,pair[1]+"  "+moneyK(y),{anchor:"end",fill:isMean?C.ink:C.limit,weight:isMean?500:400}); });
  s+='<polyline points="'+v.map(function(y,i){return X(i).toFixed(1)+","+Y(y).toFixed(1);}).join(" ")+'" fill="none" stroke="'+C.ink+'" stroke-width="1.5"/>';
  v.forEach(function(y,i){ const bad=y>ucl||y<lcl;
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(y).toFixed(1)+'" r="'+(bad?6:4)+'" fill="'+(bad?C.out:C.in)+'"'+(bad?' fill-opacity="0.35" stroke="'+C.out+'" stroke-width="1.5"':'') +
      '><title>'+fmtDate(ps[i].date)+" \u00b7 "+ps[i].firm+" "+money(y)+(bad?" \u00b7 "+T.outside:"")+'</title></circle>'; });
  s+=txt(P.l,h-8,fmtDate(ps[0].date),{}); s+=txt(w-P.r,h-8,fmtDate(ps[ps.length-1].date),{anchor:"end"});
  return s+"</svg>";
}

function renderCharts(){
  readColors();
  const w=Math.max(280,Math.floor($("curve").clientWidth));
  $("curve").innerHTML=drawCurve(w); $("monthly").innerHTML=drawMonthly(w);
  $("cycle").innerHTML=drawCycle(w); $("pareto").innerHTML=drawPareto(w); $("control").innerHTML=drawControl(w);
  $("roi").innerHTML=drawROI(w);
}
function renderAll(){ renderText(); renderCharts(); }

/* ── controls ─────────────────────────────────── */
document.querySelectorAll("[data-lang]").forEach(function(b){
  b.addEventListener("click", function(){
    SETTINGS.set("lang", b.getAttribute("data-lang"));
    T = I18N[SETTINGS.lang]; document.documentElement.lang = SETTINGS.lang;
    renderAll();
  });
});
$("themeBtn").addEventListener("click", function(){
  SETTINGS.set("theme", SETTINGS.theme==="dark"?"light":"dark");
  document.documentElement.setAttribute("data-theme", SETTINGS.theme);
  renderAll();
});

let raf;
window.addEventListener("resize", function(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(renderCharts); });

renderAll();
BG.start();

})();
</script>
